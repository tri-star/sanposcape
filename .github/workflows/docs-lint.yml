name: docs lint

on:
  # paths で絞らない。コードの改名・削除だけの変更でも、それを参照する文書が古くなる
  # （check-doc-references.py が拾う）ため。main への push も、別々の PR の組み合わせで壊れうるので同じ。
  # どの検査も依存のインストールが要らず、数秒で終わる。
  push:
    branches: [main]
  pull_request:

# 全 PR・main への push で走らせるので、リポジトリの既定に頼らず読み取りだけに絞る（lp-ci.yml と同じ）。
permissions:
  contents: read

jobs:
  tmp-references:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # 恒久ドキュメント(ADR・docs・agent-memory)が .gitignore 対象の tmp/ を
      # 参照していないか検査する。tmp/ 参照は別環境でリンク切れになるため。
      - name: Check references into tmp/
        run: scripts/knowledge/check-tmp-references.sh

      # agent-memory の front-matter 規約（scope / source_issue / ADR 転記先）を検査する。
      # ベースラインに載っている既存メモリは対象外で、新規流入のみを止める。
      - name: Check agent-memory front-matter
        run: python3 scripts/knowledge/check-memory-frontmatter.py --all

      # 文書中のリンク・ファイルパス・pnpm script が実在するか検査する（名前やパスのずれによる文書の乖離）。
      # ベースラインに載っている既存の違反は対象外で、新規流入のみを止める。
      - name: Check links, paths and pnpm scripts in docs
        run: python3 scripts/knowledge/check-doc-references.py

      # ハーネス専用の標準ライブラリ検証。アプリ環境や外部サービスは不要。
      - name: Validate Codex harness references and formats
        run: python3 .agents/skills/import-claude-skill/scripts/validate_harness.py

      - name: Test incremental Claude import
        run: python3 -m unittest discover -s .agents/skills/import-claude-skill/tests -v
