name: backend deploy (SAM)

# packages/backend を AWS SAM で Lambda へデプロイする。手順・前提・トラブルシュートは
# packages/backend/docs/deployment.md の「GitHub Actions からのデプロイ」を参照。
#
# ★ 認証は OIDC のみ（ADR-004 決定5）。GitHub に置くのはロール ARN（秘密ではない）だけで、
#   Environment Variables `AWS_SAM_DEPLOY_ROLE_ARN` から読む。
# ★ GitHub Environment（development / production）と AWS アカウントを 1:1 に対応させる
#   （ADR-004 決定6）。デプロイロールの trust は `environment:<名前>` の subject だけを許すので、
#   environment を付けない job からはそもそも AssumeRole できない。
#   production は Required reviewers と Deployment branches（main 限定）で保護している。
# ★ build と deploy を別 job に分けている。build は PyPI から依存を取得して任意のコード
#   （パッケージのビルドスクリプト等）を実行し得るため、id-token: write も environment も
#   持たせない。OIDC トークンを要求できるのは、ビルド済み成果物を受け取るだけの deploy job に限る。
# ★ マイグレーション（migrate Lambda の invoke）は自動実行しない。デプロイロールに
#   lambda:InvokeFunction が無く、スキーマ変更をデプロイと不可分にしない方針のため
#   （ADR-005 決定9）。デプロイ後に手元から実行する（Job Summary に案内を出す）。
# ★ デプロイ順は常に SAM → Terraform（sanposcape-infra）。このワークフローは Terraform を触らない。
# ★ 起動は workflow_dispatch のみ（main への push による自動デプロイはしない）。
#   - development: 任意の ref から起動できる（書き込み権限を持つ人が明示的に起動する）。
#   - production: main からのみ。prepare の ref チェック + Environment の main 限定 + Required reviewers。
# ★ production のデプロイに成功したときだけ、release job がデプロイした SHA に `backend/vX.Y.Z` タグと
#   GitHub Release を作る（development ではバージョンを振らない）。バージョンとリリースノートは
#   リポジトリ直下の cliff.toml（git-cliff）で、前回の backend/v* タグ以降の packages/backend/** の
#   コミットから算出する。入力 `release_version` を指定したときは算出せずその値を使う
#   （1.0.0 への移行など、人が番号を決めるとき。production のみ）。
# ★ pull_request / pull_request_target トリガーを絶対に足さないこと。このリポジトリは public で、
#   fork からの PR のワークフロー定義でデプロイ経路（environment と OIDC）に到達され得る。
#   インフラ側のロールの trust も pull_request の subject を含めていない。

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "デプロイ先（production は main からのみ・承認が必要）"
        type: choice
        options: [development, production]
        default: development
        required: true
      release_version:
        description: "production のみ・任意。タグのバージョンを X.Y.Z で指定する（空なら git-cliff が算出）。前回タグより大きい値だけ指定できる"
        type: string
        default: ""
        required: false

# 実行単位（ビルド・リリースを含む）で環境ごとに直列化する。deploy job 単位の直列化だけだと、
# 後から来た run のビルドが先に終わった場合に古いコミットが後からデプロイされて巻き戻る。
# release job（タグの採番）も同じ run に含めることで、production の採番が並行しない。
# 実行中のデプロイを途中で止めると CloudFormation が UPDATE_ROLLBACK に入るため取り消さない
# （待機中の run は新しい run に置き換わる = 最後に起動したものだけが残る）。
concurrency:
  group: backend-deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      config-env: ${{ steps.resolve.outputs.config_env }}
    steps:
      - name: Resolve target environment
        id: resolve
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
          GIT_REF: ${{ github.ref }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          environment="$INPUT_ENVIRONMENT"
          case "$environment" in
            development) config_env=dev ;;
            production) config_env=prod ;;
            *)
              echo "::error::未知のデプロイ先です: $environment"
              exit 1
              ;;
          esac
          # Environment の Deployment branches（main 限定）でも弾かれるが、CI の実行や
          # ビルドを始める前に落とす（承認待ちにも入れない）。
          if [ "$environment" = "production" ] && [ "$GIT_REF" != "refs/heads/main" ]; then
            echo "::error::production へのデプロイは main からのみ実行できます（ref: $GIT_REF）"
            exit 1
          fi
          # release_version は production の release job が使う。承認待ちやデプロイに入る前に、
          # 形式・対象・前回タグとの大小を確かめて落とす（デプロイ後にタグだけ作れない事態を避ける）。
          if [ -n "$INPUT_RELEASE_VERSION" ]; then
            if [ "$environment" != "production" ]; then
              echo "::error::release_version は production でのみ指定できます（development ではバージョンを振りません）"
              exit 1
            fi
            if ! [[ "$INPUT_RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::release_version は X.Y.Z の形式で指定してください: $INPUT_RELEASE_VERSION"
              exit 1
            fi
            # 公開リポジトリなので checkout せずにタグ一覧を取れる。
            latest="$(git ls-remote --tags --refs "https://github.com/$GH_REPO.git" 'refs/tags/backend/v*' \
              | sed 's#.*refs/tags/backend/v##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$INPUT_RELEASE_VERSION" | sort -V | tail -n 1)" != "$INPUT_RELEASE_VERSION" -o "$latest" = "$INPUT_RELEASE_VERSION" ]; then
              echo "::error::release_version は前回のタグ backend/v$latest より大きい値にしてください: $INPUT_RELEASE_VERSION"
              exit 1
            fi
          fi
          {
            echo "environment=$environment"
            echo "config_env=$config_env"
          } >> "$GITHUB_OUTPUT"

  # テスト（lint / test / マイグレーションのスモーク）を通ったコミットだけをデプロイする。
  # development は任意の ref から起動でき、main の ruleset も PR を必須にしていないため、
  # デプロイする ref そのものでここで担保する。
  ci:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/backend-ci.yml

  build:
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ★ id-token: write / environment を付けない（先頭コメント参照）。
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/backend
    env:
      SAM_CLI_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"

      # ビルドコンテナ（public.ecr.aws/sam/build-python3.12）に uv が無いため、
      # requirements-lambda.txt だけランナー上で生成する（Makefile 冒頭コメント参照）。
      - name: Export Lambda requirements
        run: make lambda-requirements

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          version: "1.165.0"
          use-installer: true

      - name: Validate template
        run: sam validate --lint --region ap-southeast-1

      # --use-container は省略できない（psycopg[binary] の manylinux wheel がホストに依存するため）。
      - name: Build
        run: sam build --use-container

      # upload-artifact は実行権限などのファイル属性を保持しないため tar で固めて渡す。
      - name: Archive build output
        run: tar -C .aws-sam -czf "$RUNNER_TEMP/sam-build.tgz" build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sam-build
          path: ${{ runner.temp }}/sam-build.tgz
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.prepare.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/backend
    env:
      CONFIG_ENV: ${{ needs.prepare.outputs.config-env }}
      SAM_CLI_TELEMETRY: "0"
    steps:
      - name: Check deploy role is configured
        working-directory: .
        env:
          ROLE_ARN: ${{ vars.AWS_SAM_DEPLOY_ROLE_ARN }}
          TARGET_ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Environment '$TARGET_ENVIRONMENT' に Variables 'AWS_SAM_DEPLOY_ROLE_ARN' が設定されていません（packages/backend/docs/deployment.md 参照）"
            exit 1
          fi

      # samconfig.toml（スタック名・リージョン・タグ・parameter_overrides）を使うため。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sam-build
          path: ${{ runner.temp }}

      - name: Extract build output
        run: |
          mkdir -p .aws-sam
          tar -C .aws-sam -xzf "$RUNNER_TEMP/sam-build.tgz"

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          version: "1.165.0"
          use-installer: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_SAM_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: gha-sam-deploy-${{ github.run_id }}
          mask-aws-account-id: true

      # samconfig.toml の confirm_changeset = true は手元での実行向け（changeset を目で確認する）。
      # CI では承認を GitHub Environment の保護ルールで取るので、ここでだけ無効化する。
      - name: Deploy
        run: sam deploy --config-env "$CONFIG_ENV" --no-confirm-changeset --no-fail-on-empty-changeset

      - name: Show next steps
        run: |
          {
            echo "## デプロイ完了（$CONFIG_ENV）"
            echo
            echo "マイグレーションは自動実行していません（ADR-005 決定9）。スキーマ変更を含む場合は、"
            echo "手元の AWS 認証情報で次を実行してください（packages/backend/docs/deployment.md §5.2）。"
            echo
            echo '```bash'
            echo "aws lambda invoke --function-name sanposcape-${CONFIG_ENV}-backend-migrate \\"
            echo "  --region ap-southeast-1 \\"
            echo "  --cli-binary-format raw-in-base64-out --payload '{}' \\"
            echo "  --cli-read-timeout 360 /dev/stdout"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # production へのデプロイ成功後に、デプロイした SHA へ backend/vX.Y.Z タグと GitHub Release を作る。
  # - バージョン: git-cliff の bump 規則（cliff.toml の [bump]）。タグが無い初回は backend/v0.1.0。
#   入力 release_version があればその値（1.0.0 への移行など、人が決める場合）。
  # - 本文: 前回の backend/v* タグ以降で packages/backend/** に触れたコミット（Conventional Commits で分類）。
  # 次の場合はタグを作らずにスキップし、理由を Job Summary に出す（デプロイ自体は成功扱いのまま）。
  # - デプロイした SHA が既に backend/v* タグ付き（同じコミットの再デプロイ）
  # - 最新の backend/v* タグがデプロイした SHA の祖先ではない（過去のコミットの再デプロイ = ロールバック。
  #   ここで採番すると既存タグと番号が衝突し得る）
  # - 前回タグ以降にリリースノートへ載るべき backend のコミットが無い
  release:
    needs: [prepare, deploy]
    if: needs.prepare.outputs.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # タグと Release の作成に contents: write が必要。AWS には触らないので id-token / environment は付けない。
    permissions:
      contents: write
    env:
      GIT_CLIFF_VERSION: "2.14.1"
      # https://github.com/orhun/git-cliff/releases/download/v2.14.1/git-cliff-2.14.1-x86_64-unknown-linux-musl.tar.gz.sha512
      GIT_CLIFF_SHA512: b5ce5da0189e50fe6c64753bb205b4c8a4a657b5ab9301d2690d7bb66238388e8146237ba0eb407a5b8ee49d9a1646ea02b392b470d8ca19f0b948cf8a62965f
      TAG_PREFIX: backend/v
      DEPLOYED_SHA: ${{ github.sha }}
      # 空なら git-cliff の算出値を使う。形式と前回タグとの大小は prepare で確かめ済み。
      RELEASE_VERSION_OVERRIDE: ${{ inputs.release_version }}
    steps:
      # 前回タグの検出と差分の算出に全履歴とタグが要る。タグの作成は gh（API）で行うので git の認証情報は残さない。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install git-cliff
        run: |
          set -euo pipefail
          archive="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/${archive}"
          echo "${GIT_CLIFF_SHA512}  $RUNNER_TEMP/$archive" | sha512sum -c -
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/$archive"
          echo "$RUNNER_TEMP/git-cliff-${GIT_CLIFF_VERSION}" >> "$GITHUB_PATH"

      - name: Resolve release version and notes
        id: version
        env:
          # タグが1つも無いときのバージョン（cliff.toml の initial_tag を接頭辞付きで上書き）。
          GIT_CLIFF__BUMP__INITIAL_TAG: backend/v0.1.0
        run: |
          set -euo pipefail
          # --unreleased を必ず付ける。付けないと、--include-path に当たらないコミット（マージコミット等）に
          # 付いた前回タグを見失い、全履歴から bump してしまう（git-cliff 2.14.1 で確認）。
          cliff=(git-cliff --offline --unreleased
            --include-path 'packages/backend/**'
            --tag-pattern '^backend/v[0-9]+\.[0-9]+\.[0-9]+$')

          skip() {
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "## リリース作成をスキップしました"
              echo
              echo "$1"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          existing="$(git tag --points-at "$DEPLOYED_SHA" --list "${TAG_PREFIX}*" | head -n 1)"
          if [ -n "$existing" ]; then
            skip "デプロイしたコミット \`$DEPLOYED_SHA\` は既に \`$existing\` としてリリース済みです（再デプロイ）。"
          fi

          latest="$(git tag --list "${TAG_PREFIX}*" --sort=-v:refname | head -n 1)"
          if [ -n "$latest" ] && ! git merge-base --is-ancestor "$latest" "$DEPLOYED_SHA"; then
            skip "最新のタグ \`$latest\` がデプロイしたコミット \`$DEPLOYED_SHA\` の祖先ではありません（過去のコミットの再デプロイ）。バージョンは振りません。"
          fi

          commit_count="$("${cliff[@]}" --context | jq '[.[].commits | length] | add // 0')"
          if [ "$commit_count" -eq 0 ]; then
            skip "前回のタグ（${latest:-なし}）以降に、リリースノートに載る packages/backend のコミットがありません。"
          fi

          if [ -n "$RELEASE_VERSION_OVERRIDE" ]; then
            next="${TAG_PREFIX}${RELEASE_VERSION_OVERRIDE}"
          else
            next="$("${cliff[@]}" --bumped-version)"
          fi
          if ! [[ "$next" =~ ^backend/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::git-cliff が想定外のバージョンを返しました: $next"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$next" > /dev/null; then
            echo "::error::タグ $next は既に存在します（前回タグ: ${latest:-なし}）"
            exit 1
          fi

          "${cliff[@]}" --strip all --output "$RUNNER_TEMP/release-notes.md"
          {
            echo "skip=false"
            echo "tag=$next"
          } >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # タグが無ければ --target の SHA に作られる。GITHUB_TOKEN で作ったタグは他のワークフローを起動しない。
          gh release create "$RELEASE_TAG" \
            --target "$DEPLOYED_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          {
            echo "## リリースを作成しました: $RELEASE_TAG"
            echo
            echo "対象コミット: \`$DEPLOYED_SHA\`"
            echo
            cat "$RUNNER_TEMP/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
