name: lp CI

on:
  push:
    branches: [main]
    paths:
      - "packages/lp/**"
      # 推移的依存だけの更新 (Dependabot の npm PR など) は packages/lp/ に触れず
      # ルートのロックファイルだけが変わる。それでも検証が走るようにする。
      - "pnpm-lock.yaml"
      - ".github/workflows/lp-ci.yml"
  pull_request:
    paths:
      - "packages/lp/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/lp-ci.yml"
  # lp-deploy.yml から、デプロイする ref そのものの検査として呼び出す。
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI では Astro の匿名テレメトリを送らない
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # astro@7 の engines は >=22.12.0。ワークスペースの他パッケージ（mobile-ci.yml）と揃えて 24 にする。
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (astro check)
        run: pnpm --filter lp check

      - name: Format check (Prettier)
        run: pnpm --filter lp format:check

      - name: Build
        run: pnpm --filter lp build

      # CloudFront が付ける CSP（'unsafe-inline' なし）で動くよう、出力 HTML にインラインの
      # <script> 本文・<style>・style 属性・on* イベントハンドラ属性が無いことを確かめる。
      # build.format: "directory" でページは dist/<name>/index.html に出るので、サブディレクトリまで見る。
      - name: Check no inline scripts or styles
        run: |
          set +e
          grep -rnE --include='*.html' \
            '<style|[[:space:]]style=|[[:space:]]on[a-z]+=|<script([[:space:]][^>]*)?>[^<]' \
            packages/lp/dist
          status=$?
          set -e
          # grep の終了コード: 0 = 見つかった、1 = 見つからない、2 以上 = grep 自体の失敗。
          case "$status" in
            0)
              echo "::error::dist の HTML にインラインのスクリプト・スタイルがあります（CSP で拒否されます）"
              exit 1
              ;;
            1) ;;
            *)
              echo "::error::インライン混入の検査に失敗しました（grep の終了コード: $status）"
              exit 1
              ;;
          esac
