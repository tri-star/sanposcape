name: feature flags (AppConfig)

# フィーチャーフラグを1本切り替える（= リリース / 引き返し）。SS-99 / ADR-008 決定6。
# 手順は docs/release-runbook.md §3「フラグの操作」を参照。
#
# ★ フラグの切り替えはこのワークフローからのみ行う。AWS コンソールから直接操作しない。
#   Actions の実行履歴を「いつ・誰が・何をリリースしたか」の記録にするため。
# ★ フラグの定義（キー・名前・説明・既定値）の正本は packages/backend/feature-flags.json、
#   現在値の正本は AppConfig（直近に配信を完了した hosted configuration version）。
#   現在値を引き継いで指定の1本だけを書き換えた版を作り、StartDeployment する
#   （組み立ては packages/backend/scripts/feature_flags_document.py）。
# ★ 認証は OIDC のみ。sam-deploy とは別のロール `sanposcape-<env>-feature-flags`（infra SS-96）を
#   Environment Variables `AWS_FEATURE_FLAGS_ROLE_ARN` から読む。ロールの trust は
#   `environment:<名前>` の subject だけを許すので、environment を付けない job からは assume できない。
#   production は Required reviewers と Deployment branches（main 限定）で保護している。
# ★ AppConfig の ID は SSM `/sanposcape/<env>/platform/appconfig/*` からロールで読む。
#   このリポジトリは public で Actions のログも公開されるため、読んだ ID はマスクする。
# ★ deploy job ではサードパーティの依存を入れない（aws CLI と python3 の標準ライブラリだけ）。
#   OIDC トークンを要求できる job で PyPI 等から任意のコードを取得しないため。
# ★ pull_request / pull_request_target トリガーを絶対に足さないこと（backend-deploy.yml と同じ理由）。

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "切り替え先（production は main からのみ・承認が必要）"
        type: choice
        options: [development, production]
        default: development
        required: true
      flag:
        description: "フラグのキー（packages/backend/feature-flags.json に定義済みのもの。例: pin_registration）"
        type: string
        required: true
      state:
        description: "切り替え後の値"
        type: choice
        options: ["off", "on"]
        default: "off"
        required: true
      prune:
        description: "定義ファイルから消えたキーを AppConfig からも削除する（フラグ削除 PR を当該環境にデプロイした後だけ使う）"
        type: boolean
        default: false

# 環境ごとに直列化する。AppConfig は同じ環境で配信中（ベイク中を含む）の間は次の
# StartDeployment を ConflictException で弾くため、run 側で待たせる。各 run は配信の
# 完了（ベイク終了）まで待ってから終わるので、後続の run は衝突しない。
# 配信は途中で止めると巻き戻るため取り消さない。
# ★ GitHub の仕様で、同じ group で待機できる run は1つだけ。待機中にさらに起動すると、
#   待機していた run はキャンセルされる（実行されない）。runbook §3 に確認手順がある。
concurrency:
  group: feature-flags-${{ inputs.environment }}
  cancel-in-progress: false

permissions: {}

jobs:
  # 承認待ちに入る前に、入力と定義ファイルを検査して落とす。AWS には触らない。
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      config-env: ${{ steps.resolve.outputs.config_env }}
    steps:
      - name: Resolve target environment
        id: resolve
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          environment="$INPUT_ENVIRONMENT"
          case "$environment" in
            development) config_env=dev ;;
            production) config_env=prod ;;
            *)
              echo "::error::未知の切り替え先です: $environment"
              exit 1
              ;;
          esac
          # production のフラグ定義は main のものだけを使う（Environment の main 限定でも弾かれる）。
          if [ "$environment" = "production" ] && [ "$GIT_REF" != "refs/heads/main" ]; then
            echo "::error::production のフラグは main からのみ切り替えられます（ref: $GIT_REF）"
            exit 1
          fi
          {
            echo "environment=$environment"
            echo "config_env=$config_env"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate flag definitions and input
        working-directory: packages/backend
        env:
          FLAG: ${{ inputs.flag }}
        run: python3 scripts/feature_flags_document.py validate --flag "$FLAG"

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.prepare.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/backend
    env:
      AWS_REGION: ap-southeast-1
      CONFIG_ENV: ${{ needs.prepare.outputs.config-env }}
      TARGET_ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
      FLAG: ${{ inputs.flag }}
      STATE: ${{ inputs.state }}
      PRUNE: ${{ inputs.prune }}
    steps:
      - name: Check role is configured
        working-directory: .
        env:
          ROLE_ARN: ${{ vars.AWS_FEATURE_FLAGS_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Environment '$TARGET_ENVIRONMENT' に Variables 'AWS_FEATURE_FLAGS_ROLE_ARN' が設定されていません（docs/release-runbook.md §3 参照）"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_FEATURE_FLAGS_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: gha-feature-flags-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Resolve AppConfig IDs
        id: ids
        run: |
          set -euo pipefail
          prefix="/sanposcape/${CONFIG_ENV}/platform/appconfig"
          params="$(aws ssm get-parameters-by-path --path "$prefix" --output json)"
          for name in application_id environment_id configuration_profile_id deployment_strategy_id; do
            value="$(jq -r --arg n "$prefix/$name" '.Parameters[] | select(.Name == $n) | .Value' <<< "$params")"
            if [ -z "$value" ]; then
              echo "::error::SSM パラメータ $prefix/$name がありません（sanposcape-infra の live/platform が未 apply の可能性）"
              exit 1
            fi
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_OUTPUT"
          done

      - name: Read the currently deployed version
        id: current
        env:
          APP_ID: ${{ steps.ids.outputs.application_id }}
          ENV_ID: ${{ steps.ids.outputs.environment_id }}
          PROFILE_ID: ${{ steps.ids.outputs.configuration_profile_id }}
        run: |
          set -euo pipefail
          profile_name="$(aws appconfig get-configuration-profile \
            --application-id "$APP_ID" --configuration-profile-id "$PROFILE_ID" \
            --query Name --output text)"
          # ListDeployments は DeploymentNumber の降順で返る。
          deployments="$(aws appconfig list-deployments \
            --application-id "$APP_ID" --environment-id "$ENV_ID" --max-items 100 \
            --output json | jq --arg p "$profile_name" '[.Items[] | select(.ConfigurationName == $p)]')"

          in_progress="$(jq -r '[.[] | select(.State | IN("DEPLOYING", "BAKING", "VALIDATING", "ROLLING_BACK"))][0].DeploymentNumber // empty' <<< "$deployments")"
          if [ -n "$in_progress" ]; then
            echo "::error::この環境では配信 #$in_progress が進行中です。完了してから再実行してください（ワークフロー外から始めた配信の可能性）"
            exit 1
          fi

          version="$(jq -r '[.[] | select(.State == "COMPLETE")][0].ConfigurationVersion // empty' <<< "$deployments")"
          if [ -z "$version" ]; then
            echo "この環境には配信済みの版がありません。定義ファイルの既定値から組み立てます。"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          aws appconfig get-hosted-configuration-version \
            --application-id "$APP_ID" --configuration-profile-id "$PROFILE_ID" \
            --version-number "$version" "$RUNNER_TEMP/current.json" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the next version
        id: build
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
        run: |
          set -euo pipefail
          extra_args=()
          if [ -n "$CURRENT_VERSION" ]; then
            extra_args+=(--current "$RUNNER_TEMP/current.json")
          fi
          if [ "$PRUNE" = "true" ]; then
            extra_args+=(--prune)
          fi
          summary="$(python3 scripts/feature_flags_document.py build \
            --flag "$FLAG" --state "$STATE" "${extra_args[@]}" \
            --output "$RUNNER_TEMP/next.json")"
          echo "$summary" | jq .
          {
            echo "changed=$(jq -r .changed <<< "$summary")"
            echo "previous=$(jq -r '.previous // "未設定"' <<< "$summary")"
            echo "dropped=$(jq -r '.dropped_keys | join(", ")' <<< "$summary")"
            echo "kept=$(jq -r '.kept_undefined_keys | join(", ")' <<< "$summary")"
            echo "added=$(jq -r '.added_keys | join(", ")' <<< "$summary")"
          } >> "$GITHUB_OUTPUT"

      - name: Skip when nothing changes
        if: steps.build.outputs.changed != 'true'
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
        run: |
          {
            echo "## 変更なし（$TARGET_ENVIRONMENT）"
            echo
            echo "\`$FLAG\` は既に \`$STATE\` で、配信中の版（#$CURRENT_VERSION）と内容が同じため配信しませんでした。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create hosted configuration version
        id: version
        if: steps.build.outputs.changed == 'true'
        env:
          APP_ID: ${{ steps.ids.outputs.application_id }}
          PROFILE_ID: ${{ steps.ids.outputs.configuration_profile_id }}
          DESCRIPTION: "${{ inputs.flag }}=${{ inputs.state }} by ${{ github.actor }} (run ${{ github.run_id }}, ${{ github.sha }})"
        run: |
          set -euo pipefail
          number="$(aws appconfig create-hosted-configuration-version \
            --application-id "$APP_ID" --configuration-profile-id "$PROFILE_ID" \
            --content "fileb://$RUNNER_TEMP/next.json" --content-type application/json \
            --description "${DESCRIPTION:0:1024}" \
            "$RUNNER_TEMP/created.json" --query VersionNumber --output text)"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Start deployment
        id: deployment
        if: steps.build.outputs.changed == 'true'
        env:
          APP_ID: ${{ steps.ids.outputs.application_id }}
          ENV_ID: ${{ steps.ids.outputs.environment_id }}
          PROFILE_ID: ${{ steps.ids.outputs.configuration_profile_id }}
          STRATEGY_ID: ${{ steps.ids.outputs.deployment_strategy_id }}
          VERSION: ${{ steps.version.outputs.number }}
          DESCRIPTION: "${{ inputs.flag }}=${{ inputs.state }} by ${{ github.actor }} (run ${{ github.run_id }})"
        run: |
          set -euo pipefail
          number="$(aws appconfig start-deployment \
            --application-id "$APP_ID" --environment-id "$ENV_ID" \
            --configuration-profile-id "$PROFILE_ID" --deployment-strategy-id "$STRATEGY_ID" \
            --configuration-version "$VERSION" --description "${DESCRIPTION:0:1024}" \
            --query DeploymentNumber --output text)"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # ベイクを含めて完了まで待つ。後続の run が ConflictException にならないようにするため
      # （concurrency の説明を参照）。ベイク中に止めたい場合はコンソールではなく、
      # 逆の値でこのワークフローを起動する（ベイクが終わってから配信される）。
      - name: Wait for deployment to complete
        if: steps.build.outputs.changed == 'true'
        env:
          APP_ID: ${{ steps.ids.outputs.application_id }}
          ENV_ID: ${{ steps.ids.outputs.environment_id }}
          DEPLOYMENT: ${{ steps.deployment.outputs.number }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 20 * 60))
          while :; do
            state="$(aws appconfig get-deployment \
              --application-id "$APP_ID" --environment-id "$ENV_ID" \
              --deployment-number "$DEPLOYMENT" --query State --output text)"
            echo "deployment #$DEPLOYMENT: $state"
            case "$state" in
              COMPLETE) break ;;
              ROLLED_BACK | REVERTED)
                echo "::error::配信 #$DEPLOYMENT が $state で終わりました。フラグは切り替わっていません"
                exit 1
                ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::配信 #$DEPLOYMENT が 20 分以内に完了しませんでした（最後の状態: $state）"
              exit 1
            fi
            sleep 10
          done

      - name: Summary
        if: steps.build.outputs.changed == 'true'
        env:
          PREVIOUS: ${{ steps.build.outputs.previous }}
          DROPPED: ${{ steps.build.outputs.dropped }}
          KEPT: ${{ steps.build.outputs.kept }}
          ADDED: ${{ steps.build.outputs.added }}
          VERSION: ${{ steps.version.outputs.number }}
          DEPLOYMENT: ${{ steps.deployment.outputs.number }}
        run: |
          {
            echo "## フラグを切り替えました（$TARGET_ENVIRONMENT）"
            echo
            echo "| フラグ | 変更前 | 変更後 | 版 | 配信 |"
            echo "|---|---|---|---|---|"
            echo "| \`$FLAG\` | $PREVIOUS | $STATE | #$VERSION | #$DEPLOYMENT |"
            if [ -n "$DROPPED" ]; then
              echo
              echo "定義ファイルから消えたため削除したキー（prune）: $DROPPED"
            fi
            if [ -n "$KEPT" ]; then
              echo
              echo "定義ファイルに無いが値を維持したキー: $KEPT（削除 PR をこの環境にデプロイ済みなら prune を付けて再実行する）"
            fi
            if [ -n "$ADDED" ]; then
              echo
              echo "定義ファイルに追加され既定値（OFF）で配信したキー: $ADDED"
            fi
            echo
            echo "backend への反映はポーリング間隔（既定60秒）と実行環境ごとのばらつきの分だけ遅れます。"
            echo "確認: \`curl -s https://app-api.${CONFIG_ENV}.sanposcape.com/app-config | jq\`"
          } >> "$GITHUB_STEP_SUMMARY"
