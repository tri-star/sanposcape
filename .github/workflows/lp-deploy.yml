name: lp deploy (S3 + CloudFront)

# packages/lp（Astro の静的サイト）をビルドし、S3 へアップロードして CloudFront のキャッシュを削除する。
# 手順・前提・トラブルシュートは packages/lp/docs/deployment.md を参照。
# 配信面（S3 / CloudFront / OIDC ロール）は sanposcape-infra の live/services/lp（SS-74）が持つ。
#
# ★ 認証は OIDC のみ（ADR-004 決定5）。GitHub に置くのはロール ARN（秘密ではない）だけで、
#   Environment Variables `AWS_LP_DEPLOY_ROLE_ARN` から読む。バケット名・distribution ID は
#   SSM（/sanposcape/<env>/services/lp/*）から実行時に読み、リポジトリには書かない。
# ★ ロールの trust は `environment:<名前>` の subject だけを許すので、environment を付けない job からは
#   AssumeRole できない。production は Required reviewers と Deployment branches（main 限定）で保護する。
# ★ build と deploy を別 job に分けている。build は npm から取得した依存のコードを実行するため、
#   id-token: write も environment も持たせない（backend-deploy.yml と同じ考え方）。
# ★ 起動:
#   - development: packages/lp/** を含む main への push で自動。workflow_dispatch なら任意の ref からも可
#     （ブランチを dev で確認した後に main への push が来ると、dev は main の内容に戻る）。
#   - production: workflow_dispatch のみ。main からのみ + Environment の承認。
# ★ production のデプロイに成功したときだけ、release job が `lp/vX.Y.Z` タグと GitHub Release を作る
#   （backend-deploy.yml の release job と同じ規則。cliff.toml を共有する）。
# ★ pull_request / pull_request_target トリガーを絶対に足さないこと。このリポジトリは public で、
#   fork からの PR のワークフロー定義でデプロイ経路（environment と OIDC）に到達され得る。
# ★ public リポジトリのため Actions のログは誰でも読める。バケット名と distribution ID は取得直後に
#   add-mask し、`aws s3 sync` には --only-show-errors を付ける。ただしアカウント ID は秘匿対象ではない
#   （ロール ARN がステップの env / with として表示される。backend-deploy.yml と同じ）。マスクは多層防御。

on:
  push:
    branches: [main]
    paths:
      - "packages/lp/**"
      - ".github/workflows/lp-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "デプロイ先（production は main からのみ・承認が必要）"
        type: choice
        options: [development, production]
        default: development
        required: true

# 実行単位で環境ごとに直列化する（dev への push が重なってもアップロードとキャッシュ削除を交差させない）。
# 実行中の run は取り消さず、待機中の run は新しい run に置き換わる（最後に起動したものだけが残る）。
concurrency:
  group: lp-deploy-${{ github.event_name == 'push' && 'development' || inputs.environment }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      site-url: ${{ steps.resolve.outputs.site_url }}
    steps:
      - name: Resolve target environment
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            environment=development
          else
            environment="$INPUT_ENVIRONMENT"
          fi
          # 公開 URL は秘密ではなく、ビルド時に canonical / OGP / sitemap へ焼き込むためここで決める
          # （ホスト名の割り当ては sanposcape-infra の ADR-0001 §2.11）。
          case "$environment" in
            development) site_url=https://dev.sanposcape.com ;;
            production) site_url=https://sanposcape.com ;;
            *)
              echo "::error::未知のデプロイ先です: $environment"
              exit 1
              ;;
          esac
          # Environment の Deployment branches（main 限定）でも弾かれるが、ビルドを始める前に落とす。
          if [ "$environment" = "production" ] && [ "$GIT_REF" != "refs/heads/main" ]; then
            echo "::error::production へのデプロイは main からのみ実行できます（ref: $GIT_REF）"
            exit 1
          fi
          {
            echo "environment=$environment"
            echo "site_url=$site_url"
          } >> "$GITHUB_OUTPUT"

  # 型検査・整形・ビルド・インライン混入の検査（lp-ci.yml）を通ったコミットだけをデプロイする。
  # dev は任意の ref から起動できるため、デプロイする ref そのものでここで担保する。
  ci:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/lp-ci.yml

  build:
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ★ id-token: write / environment を付けない（先頭コメント参照）。
    permissions:
      contents: read
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 環境ごとの公開 URL（canonical・OGP・sitemap）と環境区分（production 以外は noindex）を焼き込む。
      - name: Build
        env:
          PUBLIC_LP_ENV: ${{ needs.prepare.outputs.environment }}
          LP_SITE_URL: ${{ needs.prepare.outputs.site-url }}
        run: pnpm --filter lp build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lp-dist
          path: packages/lp/dist
          # production は承認待ちの間も成果物が残っている必要がある（承認が翌日以降になっても deploy できるように）。
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ needs.prepare.outputs.environment }}
      url: ${{ needs.prepare.outputs.site-url }}
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
      SITE_URL: ${{ needs.prepare.outputs.site-url }}
      # _astro/ 配下はファイル名にハッシュが付くので永久にキャッシュしてよい。
      # それ以外（HTML・404.html・public/ の素材・robots.txt・sitemap）はブラウザが毎回エッジへ再検証し、
      # エッジは最大1日保持する（invalidation に失敗しても1日で入れ替わる保険）。
      CACHE_CONTROL_HASHED: "public, max-age=31536000, immutable"
      CACHE_CONTROL_DEFAULT: "public, max-age=0, s-maxage=86400"
    steps:
      - name: Check deploy role is configured
        env:
          ROLE_ARN: ${{ vars.AWS_LP_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Environment '$TARGET_ENVIRONMENT' に Variables 'AWS_LP_DEPLOY_ROLE_ARN' が設定されていません（packages/lp/docs/deployment.md 参照）"
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lp-dist
          path: dist

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_LP_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: gha-lp-deploy-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Resolve deploy targets
        id: targets
        run: |
          set -euo pipefail
          case "$TARGET_ENVIRONMENT" in
            development) env=dev ;;
            production) env=prod ;;
          esac
          prefix="/sanposcape/${env}/services/lp"
          bucket="$(aws ssm get-parameter --name "${prefix}/bucket_name" --query Parameter.Value --output text)"
          echo "::add-mask::$bucket"
          distribution="$(aws ssm get-parameter --name "${prefix}/distribution_id" --query Parameter.Value --output text)"
          echo "::add-mask::$distribution"
          # ビルドに焼き込んだ公開 URL（prepare で決めたもの）が、配信面の実際の URL と食い違っていないか確かめる。
          site_url="$(aws ssm get-parameter --name "${prefix}/site_url" --query Parameter.Value --output text)"
          if [ "$site_url" != "$SITE_URL" ]; then
            echo "::error::ビルドの公開 URL（$SITE_URL）が SSM の site_url（$site_url）と一致しません"
            exit 1
          fi
          {
            echo "bucket=$bucket"
            echo "distribution=$distribution"
          } >> "$GITHUB_OUTPUT"

      # 古い HTML を持っている閲覧者が旧アセットを取りに来ても 404 にならないよう、
      # 「上げる → キャッシュ削除 → 掃除（--delete）」の順にする。
      - name: Upload hashed assets
        env:
          BUCKET: ${{ steps.targets.outputs.bucket }}
        run: |
          aws s3 sync dist/_astro "s3://$BUCKET/_astro" \
            --cache-control "$CACHE_CONTROL_HASHED" --only-show-errors

      - name: Upload pages and other files
        env:
          BUCKET: ${{ steps.targets.outputs.bucket }}
        run: |
          aws s3 sync dist "s3://$BUCKET" --exclude "_astro/*" \
            --cache-control "$CACHE_CONTROL_DEFAULT" --only-show-errors

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ steps.targets.outputs.distribution }}
        run: |
          set -euo pipefail
          id="$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*' --query Invalidation.Id --output text)"
          # wait は 20 秒 × 30 回（10 分）で諦めるため、最大 3 回まで待ち直す。
          for attempt in 1 2 3; do
            if aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"; then
              exit 0
            fi
            echo "::warning::invalidation の完了待ちがタイムアウトしました（${attempt} 回目）"
          done
          echo "::error::invalidation が 30 分以内に完了しませんでした。古いファイルの掃除を行わずに終了します（再実行で回復します）"
          exit 1

      # 掃除でも cache-control を付けるのは、万一ファイルが上げ直されてもメタデータが消えないようにするため。
      # 誤って消した場合はバケットのバージョニング（30日）から戻せる。
      - name: Remove stale files
        env:
          BUCKET: ${{ steps.targets.outputs.bucket }}
        run: |
          set -euo pipefail
          aws s3 sync dist/_astro "s3://$BUCKET/_astro" --delete \
            --cache-control "$CACHE_CONTROL_HASHED" --only-show-errors
          aws s3 sync dist "s3://$BUCKET" --exclude "_astro/*" --delete \
            --cache-control "$CACHE_CONTROL_DEFAULT" --only-show-errors

      - name: Smoke check
        run: |
          set -euo pipefail
          status="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$SITE_URL/")"
          if [ "$status" != "200" ]; then
            echo "::error::$SITE_URL/ が $status を返しました"
            exit 1
          fi
          {
            echo "## デプロイ完了（$TARGET_ENVIRONMENT）"
            echo
            echo "- 公開 URL: $SITE_URL/"
            echo "- コミット: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # production へのデプロイ成功後に、デプロイした SHA へ lp/vX.Y.Z タグと GitHub Release を作る。
  # 規則は backend-deploy.yml の release job と同じ（接頭辞とパスだけが違う）。
  # 次の場合はタグを作らずにスキップし、理由を Job Summary に出す（デプロイ自体は成功扱いのまま）。
  # - デプロイした SHA が既に lp/v* タグ付き（同じコミットの再デプロイ）
  # - 最新の lp/v* タグがデプロイした SHA の祖先ではない（過去のコミットの再デプロイ = ロールバック）
  # - 前回タグ以降にリリースノートへ載るべき lp のコミットが無い
  release:
    needs: [prepare, deploy]
    if: needs.prepare.outputs.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # タグと Release の作成に contents: write が必要。AWS には触らないので id-token / environment は付けない。
    permissions:
      contents: write
    env:
      GIT_CLIFF_VERSION: "2.14.1"
      # https://github.com/orhun/git-cliff/releases/download/v2.14.1/git-cliff-2.14.1-x86_64-unknown-linux-musl.tar.gz.sha512
      GIT_CLIFF_SHA512: b5ce5da0189e50fe6c64753bb205b4c8a4a657b5ab9301d2690d7bb66238388e8146237ba0eb407a5b8ee49d9a1646ea02b392b470d8ca19f0b948cf8a62965f
      TAG_PREFIX: lp/v
      DEPLOYED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install git-cliff
        run: |
          set -euo pipefail
          archive="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/${archive}"
          echo "${GIT_CLIFF_SHA512}  $RUNNER_TEMP/$archive" | sha512sum -c -
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/$archive"
          echo "$RUNNER_TEMP/git-cliff-${GIT_CLIFF_VERSION}" >> "$GITHUB_PATH"

      - name: Resolve release version and notes
        id: version
        env:
          GIT_CLIFF__BUMP__INITIAL_TAG: lp/v0.1.0
        run: |
          set -euo pipefail
          # --unreleased を必ず付ける（cliff.toml 冒頭コメント参照）。
          cliff=(git-cliff --offline --unreleased
            --include-path 'packages/lp/**'
            --tag-pattern '^lp/v[0-9]+\.[0-9]+\.[0-9]+$')

          skip() {
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "## リリース作成をスキップしました"
              echo
              echo "$1"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          existing="$(git tag --points-at "$DEPLOYED_SHA" --list "${TAG_PREFIX}*" | head -n 1)"
          if [ -n "$existing" ]; then
            skip "デプロイしたコミット \`$DEPLOYED_SHA\` は既に \`$existing\` としてリリース済みです（再デプロイ）。"
          fi

          latest="$(git tag --list "${TAG_PREFIX}*" --sort=-v:refname | head -n 1)"
          if [ -n "$latest" ] && ! git merge-base --is-ancestor "$latest" "$DEPLOYED_SHA"; then
            skip "最新のタグ \`$latest\` がデプロイしたコミット \`$DEPLOYED_SHA\` の祖先ではありません（過去のコミットの再デプロイ）。バージョンは振りません。"
          fi

          commit_count="$("${cliff[@]}" --context | jq '[.[].commits | length] | add // 0')"
          if [ "$commit_count" -eq 0 ]; then
            skip "前回のタグ（${latest:-なし}）以降に、リリースノートに載る packages/lp のコミットがありません。"
          fi

          next="$("${cliff[@]}" --bumped-version)"
          if ! [[ "$next" =~ ^lp/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::git-cliff が想定外のバージョンを返しました: $next"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$next" > /dev/null; then
            echo "::error::タグ $next は既に存在します（前回タグ: ${latest:-なし}）"
            exit 1
          fi

          "${cliff[@]}" --strip all --output "$RUNNER_TEMP/release-notes.md"
          {
            echo "skip=false"
            echo "tag=$next"
          } >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --target "$DEPLOYED_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          {
            echo "## リリースを作成しました: $RELEASE_TAG"
            echo
            echo "対象コミット: \`$DEPLOYED_SHA\`"
            echo
            cat "$RUNNER_TEMP/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
