name: mobile release build (EAS)

# 配布ビルド専用。E2E（mobile-e2e.yml）とは目的もコスト構造も異なる。
#   - E2E:   `eas build --local` でランナー上でビルドし、EAS のクラウド枠を消費しない（ADR-004）
#   - 本WF:  EAS の *クラウド* ビルドを使う。internal distribution の配布リンク/QR は EAS 側の
#            成果物にしか発行されず、`--local` の成果物（ランナー上のファイル）では得られないため（SS-79）
# EAS Free プラン: Android 15回 / iOS 15回（月）・同時実行1・low-priority キュー。
# 自動実行しない（workflow_dispatch のみ）のはこの枠を守るため。
# 3分以内に fast-fail した回は月10回まで枠を消費しないので、設定ミスの早期発見は比較的安全。

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "ビルド対象"
        type: choice
        options: [android, ios, all]
        default: android
        required: true
      submit_ios:
        description: "iOS を TestFlight へ submit する（false ならビルドのみ）"
        type: boolean
        default: true

# EAS の同時実行は1なので、複数ディスパッチを並べても待つだけ。取り消さずに直列化する。
concurrency:
  group: mobile-release-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # low-priority キューの待ち + iOS のビルド処理を含むため長めに取る（GitHub の上限は 6 時間）。
    timeout-minutes: 180
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # クラウドビルドでは EAS のワーカーが `eas-build-post-install`（= pnpm run orval）で
      # 生成し直すため必須ではない。ここで先に流すのは「OpenAPI 定義の破損や orval の失敗を
      # EAS の枠を消費する前にランナー側で落とす」早期失敗ゲートのため。
      - name: Generate API client (Orval)
        run: pnpm --filter mobile orval

      # 配布する「表示用バージョン」をログに残す。
      #
      # buildNumber / versionCode は SS-89 で EAS サーバー側の採番へ移した
      # （eas.json の cli.appVersionSource: "remote" + staging の autoIncrement: true）。
      # リポジトリ側にはもう値が無いのでここでは表示できないし、ディスパッチ前に番号を
      # 上げる PR も不要になった。実際に採番された番号は下のビルドステップが EAS の応答
      # JSON から拾えた場合のみ Job Summary に出す（拾えなければ expo.dev 側で確認）。
      # 現在値は `eas build:version:get` で読めるが（公式ドキュメント未記載・CLI には実在）、
      # ここでは呼ばない。ビルド前に読めるのは「次に採番される値 - 1」でしかなく、
      # 実際に採番された値は下のビルドステップの応答から取れるため、EAS への往復を増やす
      # 価値がない。手元で現在値を知りたいときに使うコマンドであり、CI の依存先ではない。
      #
      # expo.version を表示する意味は残る: runtimeVersion.policy が "appVersion" なので
      # version はそのまま OTA の互換境界であり、「このディスパッチがどの runtimeVersion の
      # バイナリを作るのか」はビルド前に確認する価値がある（version を上げた直後は、
      # このバイナリを配るまでその version 宛の eas update が誰にも届かない）。
      - name: Show target app version
        run: |
          node -e "const c=require('./packages/mobile/app.json').expo; console.log(JSON.stringify({version:c.version, runtimeVersionPolicy:c.runtimeVersion?.policy ?? null}))" | tee -a "$GITHUB_STEP_SUMMARY"

      # このリポジトリは public。internal distribution の配布ページ（staging-apk）も
      # TestFlight 内部テスターの前段となるビルドページも、URL を Job Summary / Actions
      # ログに残さない（ADR-006 の SS-79 追補が GitHub Releases を不採用にした理由と同じ
      # リスクを、別経路で再現しないため）。
      #
      # `eas-cli build --json` は進行ログ（ビルド URL を含む）を stdout ではなく stderr に
      # 出す。CLI が --json 指定時に `process.stdout.write` を stderr へ付け替え、最終的な
      # JSON 配列を書くときだけ一時的に stdout へ戻すため（eas-cli 24.3.0 のソースで確認:
      # `commands/build/index.js` の `enableJsonOutput()` と `utils/json.js`）。加えて
      # `build/runBuildAndSubmit.js` は `--local` を使わない限り `printLogsUrls()` を
      # 無条件で呼び、ビルド URL（`.../builds/<id>` 形式）をログへ出す。
      # そのため stderr はいったん $RUNNER_TEMP のファイルへ退避し、成功時は使わず捨て、
      # 失敗時のみ URL を伏せ字にして出力する（診断性は保ちつつ URL は残さない）。
      - name: Build Android APK (staging-apk)
        if: inputs.platform == 'android' || inputs.platform == 'all'
        working-directory: packages/mobile
        run: |
          # GOOGLE_MAPS_ANDROID_SDK_KEY はここで渡さない（渡せない）。
          # クラウドビルドはシェル環境変数を受け取らないため、EAS の `preview` 環境に
          # secret visibility で登録した値がワーカー側で注入される（SS-79 / ADR-007 追補。
          # 2026-09-14 に secret 化済み。記録は packages/mobile/docs/build-profiles.md の実測欄）。
          set +e
          BUILD_JSON=$(npx eas-cli build \
            --platform android --profile staging-apk \
            --non-interactive --json \
            --message "SS-79 manual dispatch (run ${GITHUB_RUN_ID})" \
            2>"$RUNNER_TEMP/android-build.stderr.log")
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Android ビルド（eas-cli build）が失敗しました（exit ${STATUS}）。ログ（URL は伏せ字）:"
            sed -E 's#https://expo\.dev/[^[:space:]"]*#https://expo.dev/<redacted>#g' "$RUNNER_TEMP/android-build.stderr.log"
            exit "$STATUS"
          fi
          echo "$BUILD_JSON" > "$RUNNER_TEMP/android-build.json"
          BUILD_ID=$(echo "$BUILD_JSON" | jq -r '.[0].id // empty')
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "::error::Android ビルドの BUILD_ID を取得できませんでした（空または null）。$RUNNER_TEMP/android-build.json を確認してください。"
            exit 1
          fi
          # EAS が採番した versionCode を Job Summary に出す（best-effort）。
          # キー名 `appBuildVersion` は `eas-cli build:list --json` の実出力で確認した
          # （同じ Build オブジェクトを返すので `build --json` でも同じはずだが、そちらは未実測）。
          # 取れなければ何も壊さずメッセージだけ差し替える（ここでワークフローを落とさない。
          # 番号を表示できないことより、ビルド済みの成果物を落とすことのほうが高くつく）。
          APP_BUILD_VERSION=$(echo "$BUILD_JSON" | jq -r '.[0].appBuildVersion // empty' 2>/dev/null || true)
          {
            echo "### Android (staging-apk)"
            echo "- BUILD_ID: ${BUILD_ID}"
            if [ -n "$APP_BUILD_VERSION" ]; then
              echo "- versionCode（EAS が採番）: ${APP_BUILD_VERSION}"
            else
              echo "- versionCode: 応答 JSON から取得できませんでした。expo.dev のビルド詳細で確認してください。"
            fi
            echo "- 配布ページ（internal distribution。URL を知っていれば誰でもインストール可）は"
            echo "  expo.dev のプロジェクト（メンバーのみ閲覧可）のビルド一覧から開いてください。"
            echo "  public リポジトリのため、このログに URL は出しません。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build iOS (staging)
        id: ios_build
        if: inputs.platform == 'ios' || inputs.platform == 'all'
        working-directory: packages/mobile
        run: |
          set +e
          BUILD_JSON=$(npx eas-cli build \
            --platform ios --profile staging \
            --non-interactive --json \
            --message "SS-79 manual dispatch (run ${GITHUB_RUN_ID})" \
            2>"$RUNNER_TEMP/ios-build.stderr.log")
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::iOS ビルド（eas-cli build）が失敗しました（exit ${STATUS}）。ログ（URL は伏せ字）:"
            sed -E 's#https://expo\.dev/[^[:space:]"]*#https://expo.dev/<redacted>#g' "$RUNNER_TEMP/ios-build.stderr.log"
            exit "$STATUS"
          fi
          BUILD_ID=$(echo "$BUILD_JSON" | jq -r '.[0].id // empty')
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "::error::iOS ビルドの BUILD_ID を取得できませんでした（空または null）。BUILD_JSON=${BUILD_JSON}"
            exit 1
          fi
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"
          # Android 側と同じ best-effort。取れなくても落とさない。
          APP_BUILD_VERSION=$(echo "$BUILD_JSON" | jq -r '.[0].appBuildVersion // empty' 2>/dev/null || true)
          {
            echo "### iOS (staging)"
            echo "- BUILD_ID: ${BUILD_ID}"
            if [ -n "$APP_BUILD_VERSION" ]; then
              echo "- buildNumber（EAS が採番）: ${APP_BUILD_VERSION}"
            else
              echo "- buildNumber: 応答 JSON から取得できませんでした。expo.dev のビルド詳細 / App Store Connect で確認してください。"
            fi
            echo "- ビルド詳細は expo.dev のプロジェクト（メンバーのみ閲覧可）のビルド一覧から開いてください。"
            echo "  public リポジトリのため、このログに URL は出しません。"
          } >> "$GITHUB_STEP_SUMMARY"

      # build --auto-submit-with-profile ではなく submit を分けている理由:
      #   - ビルド失敗と submit 失敗をジョブのステップとして分離でき、ログの切り分けが早い
      #   - submit だけをやり直したいときに再ビルド（= EAS 枠1回）を要求されない
      - name: Submit iOS to TestFlight
        if: (inputs.platform == 'ios' || inputs.platform == 'all') && inputs.submit_ios
        working-directory: packages/mobile
        run: |
          npx eas-cli submit \
            --platform ios --profile staging \
            --id "${{ steps.ios_build.outputs.build_id }}" \
            --non-interactive
