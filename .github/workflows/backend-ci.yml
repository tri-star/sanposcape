name: backend CI

on:
  push:
    branches: [main]
    paths:
      - "packages/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "packages/backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: packages/backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.7.13"
      - name: Install dependencies
        run: uv sync --dev
      - name: Ruff check (lint)
        run: uv run ruff check
      - name: Ruff format check
        run: uv run ruff format --check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: app
      DB_PASSWORD: password
      DB_NAME: app
      # CI ではサービスの既定DBをテスト用に流用（各テストで create_all/drop_all）
      TEST_DB_NAME: app
      ENV: test
      AUTH_MODE: real # 既定が real であることを CI でも踏襲（dev router 404 のテストが成立する）
      AUTH_JWT_SECRET: ci-insecure-secret-0123456789abcdef
      GOOGLE_ALLOWED_AUDIENCES: test-audience
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.7.13"
      - name: Install dependencies
        run: uv sync --dev
      - name: Run migrations (smoke check)
        run: uv run alembic upgrade head
      - name: Run tests
        run: uv run pytest -q
