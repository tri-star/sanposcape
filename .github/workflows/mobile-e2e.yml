name: mobile E2E (Maestro)

# Maestro E2E は「実際にインストールした standalone APK」をエミュレータ上で操作する。
# コスト方針:
#   - EAS の *クラウド* ビルドは使わない（`eas build --local` でランナー上でビルド＝クラウド枠を消費しない）
#   - @expo/fingerprint でネイティブ影響入力のハッシュを取り、APK をキャッシュ
#     → fingerprint が変わらない限り再ビルドしない（JSのみの変更では走らない）
#   - 実行頻度を分離: 常時CI(lint/typecheck/unit)は mobile-ci.yml、E2Eは下記トリガのみ
#
# 初回運用時に必要な準備(TODO):
#   - リポジトリ Secrets に EXPO_TOKEN を設定（`eas build --local` のアカウント連携）
#   - Android の署名情報（credentials.json もしくは EAS のクレデンシャル）を用意
#   - TODO(SS-44): MVP フロー（maps-required タグ）を CI で常時実行するには、backend に
#     Settings.maps_mode と FakeGoogleMapsProvider（決定的な fake Maps provider）の実装が必要。
#     下記 backend 起動ステップの MAPS_MODE=fake は SS-21 時点で既にコンテナへ渡している
#     （compose.yaml の environment: にも受け口を追加済み）が、backend 側が未対応のため
#     現状は無視されるだけ（Settings の extra="ignore"）。SS-44 完了後にすること:
#       1. 下記 "Run Maestro flows on emulator" ステップの --exclude-tags=maps-required を外し、
#          コメントアウトしている --include-tags=maps-required の行と合わせて
#          `maestro test packages/mobile/.maestro/` の1コマンドに統合する。
#       2. このブロックと、同ステップ内の TODO(SS-44) コメントを削除する
#          （この TODO 自体も陳腐化するため）。
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 毎日 03:00 JST 相当（nightly）
  push:
    branches: [main]
    # ネイティブに影響する変更があったときだけ E2E を走らせる
    paths:
      - "packages/mobile/package.json"
      - "packages/mobile/app.json"
      - "packages/mobile/app.config.ts"
      - "packages/mobile/eas.json"
      - "packages/mobile/babel.config.js"
      - "pnpm-lock.yaml"
      - "packages/mobile/.maestro/**"
      - ".github/workflows/mobile-e2e.yml"

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API client (Orval)
        run: pnpm --filter mobile orval

      # ネイティブ影響入力のハッシュ = APK キャッシュのキー
      - name: Compute native fingerprint
        id: fp
        run: |
          HASH=$(node -e "require('@expo/fingerprint').createFingerprintAsync('packages/mobile').then(f=>console.log(f.hash))")
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Restore APK cache
        id: apk-cache
        uses: actions/cache@v4
        with:
          path: packages/mobile/e2e-build/app-preview.apk
          key: mobile-apk-${{ steps.fp.outputs.hash }}

      # fingerprint 一致時はここをスキップ（＝ネイティブ未変更なら再ビルドしない）
      - name: Build preview APK (local, no EAS cloud minutes)
        if: steps.apk-cache.outputs.cache-hit != 'true'
        working-directory: packages/mobile
        run: |
          mkdir -p e2e-build
          npx eas-cli build --local --non-interactive \
            --profile preview --platform android \
            --output e2e-build/app-preview.apk

      # backend(実API)をエミュレータから 10.0.2.2:8000 で到達可能に起動
      - name: Start backend
        working-directory: packages/backend
        run: |
          cp .env.example .env
          sed -i 's/{%BACKEND_API_PORT%}/8000/; s/{%DB_PORT%}/5432/' .env
          # MAPS_MODE=fake はコンテナには届く（compose.yaml の environment: に受け口を追加済み、
          # SS-21）。ただし backend の Settings に maps_mode フィールドが無いため、現状は
          # extra="ignore" により無視されるだけで害は無い。provider 本体は SS-44 で対応する。
          BACKEND_API_PORT=8000 DB_PORT=5432 \
          ENV=test AUTH_MODE=dev MAPS_MODE=fake AUTH_JWT_SECRET=e2e-insecure-secret-0123456789abcdef \
            docker compose up -d --build
          for i in $(seq 1 30); do
            if docker compose exec -T api python -c "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')" 2>/dev/null; then
              echo "backend healthy"; break
            fi
            sleep 3
          done
          docker compose exec -T api uv run alembic upgrade head

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            adb install -r packages/mobile/e2e-build/app-preview.apk
            # 外部データ（/explore/places の候補）に依存しないフロー。常時実行する。
            maestro test --exclude-tags=maps-required packages/mobile/.maestro/
            # TODO(SS-44): backend に Settings.maps_mode / FakeGoogleMapsProvider が入ったら
            #              上の --exclude-tags=maps-required を外し、次の行を
            #              `maestro test packages/mobile/.maestro/` に統合する
            #              （このコメントと次のコメントアウト行は削除する）。
            # maestro test --include-tags=maps-required packages/mobile/.maestro/

      - name: Upload Maestro debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-output
          path: ~/.maestro/tests/
          if-no-files-found: ignore
          # Public リポジトリのため既定の保持期間（90日）に任せず明示的に短くする。
          retention-days: 7
