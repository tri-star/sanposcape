name: mobile E2E (Maestro)

# Maestro E2E は「実際にインストールした standalone APK」をエミュレータ上で操作する。
# コスト方針:
#   - EAS の *クラウド* ビルドは使わない（`eas build --local` でランナー上でビルド＝クラウド枠を消費しない）
#   - @expo/fingerprint でネイティブ影響入力のハッシュを取り、APK をキャッシュ
#     → fingerprint が変わらない限り再ビルドしない（JSのみの変更では走らない）
#   - 実行頻度を分離: 常時CI(lint/typecheck/unit)は mobile-ci.yml、E2Eは下記トリガのみ
#
# 初回運用時に必要な準備(TODO):
#   - リポジトリ Secrets に EXPO_TOKEN を設定（`eas build --local` のアカウント連携）
#   - Android の署名情報（credentials.json もしくは EAS のクレデンシャル）を用意
#   - TODO: MVP フロー（maps-required タグ）を CI で常時実行する。
#     backend 側の前提（Settings.maps_mode と FakeGoogleMapsProvider＝決定的な fake Maps
#     provider）は SS-44 で実装済みで、下記 backend 起動ステップが渡している MAPS_MODE=fake は
#     実際に効いている（ENV=test なので許可リスト検証も通る）。つまり CI の backend は既に
#     /explore/places で決定的な候補を返す。残っているのは Maestro 側の切り替えだけ:
#       1. 下記 "Run Maestro flows on emulator" ステップの --exclude-tags=maps-required を外し、
#          コメントアウトしている --include-tags=maps-required の行と合わせて
#          `maestro test packages/mobile/.maestro/` の1コマンドに統合する。
#       2. このブロックと、同ステップ内の TODO コメントを削除する
#          （この TODO 自体も陳腐化するため）。
#     未了の理由: MVP フローは実機/エミュレータでの通し実行がまだ確認できていないため、
#     有効化は SS-21 側またはその後続 issue で、ローカル実行の確認とセットで行う。
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 毎日 03:00 JST 相当（nightly）
  push:
    branches: [main]
    # ネイティブに影響する変更があったときだけ E2E を走らせる
    paths:
      - "packages/mobile/package.json"
      - "packages/mobile/app.json"
      - "packages/mobile/app.config.ts"
      - "packages/mobile/eas.json"
      - "packages/mobile/babel.config.js"
      - "pnpm-lock.yaml"
      - "packages/mobile/.maestro/**"
      - ".github/workflows/mobile-e2e.yml"

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # GOOGLE_MAPS_ANDROID_SDK_KEY は ci-e2e environment の secret として管理する
    # （public repo のため、環境のブランチ制限でこの secret への到達経路を絞る）。
    environment: ci-e2e
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API client (Orval)
        run: pnpm --filter mobile orval

      # ネイティブ影響入力のハッシュ = APK キャッシュのキー
      # GOOGLE_MAPS_ANDROID_SDK_KEY はビルドステップと同じ値を渡す。app.config.ts が
      # このキーの有無で android.config.googleMaps.apiKey を出し分ける（ADR-007）ため、
      # ここで渡さないとキーの有無がキャッシュキーに反映されず、キー注入前にキャッシュされた
      # APK（クラッシュする）がキー注入後も使い回されてしまう。
      - name: Compute native fingerprint
        id: fp
        env:
          GOOGLE_MAPS_ANDROID_SDK_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_SDK_KEY }}
        run: |
          HASH=$(node -e "require('@expo/fingerprint').createFingerprintAsync('packages/mobile').then(f=>console.log(f.hash))")
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Restore APK cache
        id: apk-cache
        uses: actions/cache@v4
        with:
          path: packages/mobile/e2e-build/app-preview.apk
          key: mobile-apk-${{ steps.fp.outputs.hash }}

      # fingerprint 一致時はここをスキップ（＝ネイティブ未変更なら再ビルドしない）
      # timeout-minutes: Gradleの子プロセスが後片付けされずハングする事象があったため、
      # 失敗時に無限に居座らせず確実に完了させる安全策（SS-44）。通常は10分台で終わる想定。
      - name: Build preview APK (local, no EAS cloud minutes)
        if: steps.apk-cache.outputs.cache-hit != 'true'
        timeout-minutes: 40
        working-directory: packages/mobile
        env:
          # app.config.ts が android.config.googleMaps.apiKey へ注入する（ADR-007）。
          # 未注入だと Maps SDK 初期化時に RuntimeException でアプリがクラッシュし、
          # walk-start 系の Maestro フローが軒並み失敗していた（SS-44追補、google_apis
          # イメージへの切り替えで判明）。
          GOOGLE_MAPS_ANDROID_SDK_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_SDK_KEY }}
        run: |
          mkdir -p e2e-build
          npx eas-cli build --local --non-interactive \
            --profile preview --platform android \
            --output e2e-build/app-preview.apk

      # backend(実API)をエミュレータから 10.0.2.2:8000 で到達可能に起動
      - name: Start backend
        working-directory: packages/backend
        run: |
          cp .env.example .env
          sed -i 's/{%BACKEND_API_PORT%}/8000/; s/{%DB_PORT%}/5432/' .env
          # MAPS_MODE=fake は compose.yaml の environment: 経由でコンテナに届き（SS-21）、
          # backend の Settings.maps_mode で実際に解釈される（SS-44）。ENV=test なので
          # 許可リスト検証も通り、/explore/places は FakeGoogleMapsProvider の決定的な候補を返す。
          BACKEND_API_PORT=8000 DB_PORT=5432 \
          ENV=test AUTH_MODE=dev MAPS_MODE=fake AUTH_JWT_SECRET=e2e-insecure-secret-0123456789abcdef \
            docker compose up -d --build
          for i in $(seq 1 30); do
            if docker compose exec -T api python -c "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')" 2>/dev/null; then
              echo "backend healthy"; break
            fi
            sleep 3
          done
          docker compose exec -T api uv run alembic upgrade head

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # ランナーのデフォルトではこのジョブの実行ユーザーに /dev/kvm への権限がなく、
      # エミュレータが -accel off (フルソフトウェアエミュレーション) にフォールバックしていた。
      # その結果 boot に約400秒、adb install に約6分かかり、Maestro実行中に
      # 「Process system isn't responding」のANRが発生して6フロー全てが
      # splash-screen のアサーションで失敗していた（アプリ側のバグではない）。
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # AVD スナップショットのキャッシュ（android-emulator-runner 公式推奨パターン）。
      # 既定の force-avd-creation: true + -no-snapshot は毎回コールドブートになり、
      # 「ブート完了 → 約20秒後に Maestro 実行開始」という並びのため、google_apis イメージの
      # Google Play Services 初回セットアップがバックグラウンドで走っている最中に
      # アプリのコールドスタート（launchApp: clearState: true）を6フロー分繰り返すことになる。
      # これが splash-screen アサーションの断続的な失敗（3/6 flows）の負荷要因だったため、
      # 起動済みスナップショットから復帰させて競合を減らす。
      # キャッシュキーには AVD 構成（api-level/target/arch/cores/ram）を含める。構成を変えたら
      # 末尾の -v1 を上げてキャッシュを捨てること（古い config.ini が復元され設定が効かなくなるため）。
      - name: AVD cache
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-c3-r4096-v1

      # キャッシュミス時のみ AVD を作ってスナップショットを保存する。
      # 実行ステップと違い -no-snapshot-save を付けない（＝終了時にスナップショットを保存する）。
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          cores: 3
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # target 未指定時の既定 "default" は Google Play Services 非搭載の AOSP イメージで、
          # react-native-maps が "won't run without Google Play services" のエラーバナーを表示し、
          # そのぶんレイアウトが押し下げられて walk-start-duration-slider がアサート不可視になっていた
          # （SS-44追補、KVM/cleartext 修正後に判明）。google_apis イメージに切り替えて解消する。
          target: google_apis
          # 上の AVD cache ステップで復元/生成した AVD をそのまま使う（再作成しない）。
          force-avd-creation: false
          # ランナーは 4 vCPU / 16GB。既定の cores: 2 だとエミュレータ側の余裕が乏しく、
          # アプリのコールドスタート（JSバンドルのロード〜初回描画）が伸びてアサーションが
          # タイムアウトしやすい。Maestro 本体(JVM)の分を残して 3 コアに引き上げる。
          # RAM も既定の自動割り当て(2560MB)から引き上げる。
          cores: 3
          ram-size: 4096M
          # -no-snapshot-save: キャッシュしたスナップショットをテスト実行結果で上書きしない。
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r packages/mobile/e2e-build/app-preview.apk
            # 外部データ（/explore/places の候補）に依存しないフロー。常時実行する。
            maestro test --exclude-tags=maps-required packages/mobile/.maestro/
            # TODO: backend 側の前提（Settings.maps_mode / FakeGoogleMapsProvider）は SS-44 で
            #       対応済み。実機/エミュレータでの通し実行を確認したら上の
            #       --exclude-tags=maps-required を外し、次の行を
            #       `maestro test packages/mobile/.maestro/` に統合する
            #       （このコメントと次のコメントアウト行は削除する）。
            # maestro test --include-tags=maps-required packages/mobile/.maestro/

      - name: Upload Maestro debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-output
          path: ~/.maestro/tests/
          if-no-files-found: ignore
          # Public リポジトリのため既定の保持期間（90日）に任せず明示的に短くする。
          retention-days: 7
