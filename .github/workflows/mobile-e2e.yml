name: mobile E2E (Maestro)

# Maestro E2E は「実際にインストールした standalone APK」をエミュレータ上で操作する。
# コスト方針:
#   - EAS の *クラウド* ビルドは使わない（`eas build --local` でランナー上でビルド＝クラウド枠を消費しない）
#   - APK は packages/mobile 配下の内容ハッシュ（ネイティブ影響入力 + ソース全体）でキャッシュし、
#     ハッシュが変わらない限り再ビルドしない（詳細は "Compute build cache key" ステップのコメント）
#   - 実行頻度を分離: 常時CI(lint/typecheck/unit)は mobile-ci.yml、E2Eは下記トリガのみ
#
# 実行頻度についての追補（2026-08-14, ADR-004追補）:
# 当初は「ネイティブ影響パスへの push」でも自動実行していたが、APKキャッシュのキーが
# ネイティブ影響入力のみのハッシュだったため、JSのみの変更（例: SS-57のゲスト導線ボタン追加）が
# 反映されないまま古いAPKがキャッシュヒットし続け、Maestroフロー側だけが新しいUI要素を
# アサートするように更新されて「アプリのバグではないのに落ち続ける」E2Eになっていた
# （run 31811792167 / 31813105115 で確認）。対応として、キャッシュキーに packages/mobile の
# ソース全体を含めて「JSの変更でも必ず再ビルドする」方針に倒した。一方でこれは
# 「JSのみの変更ではビルドしない」というコスト最適化を無効化するため、その埋め合わせとして
# 自動実行を毎週末（土曜 08:00 JST）+ 手動実行のみに絞った（mainへのpush毎の自動実行は廃止）。
#
# 初回運用時に必要な準備:
#   - リポジトリ Secrets に EXPO_TOKEN を設定（`eas build --local` のアカウント連携）
#   - Android の署名情報（credentials.json もしくは EAS のクレデンシャル）を用意
#
# 実行対象のフロー: `.maestro/` 直下の全フロー（タグによる絞り込みはしない）。
# MVP 主要フロー（maps-required タグ）が依存する /explore/places の決定的な候補は、
# 下記 "Start backend" ステップの MAPS_MODE=fake（SS-44 の FakeGoogleMapsProvider、
# ENV=test なので許可リスト検証も通る）で供給される（SS-54 で常時実行を有効化）。
on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 5" # 毎週土曜 08:00 JST 相当（weekly）

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # GOOGLE_MAPS_ANDROID_SDK_KEY は ci-e2e environment の secret として管理する
    # （public repo のため、環境のブランチ制限でこの secret への到達経路を絞る）。
    environment: ci-e2e
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # mobile-ci.yml と同じ理由で 24 に揃える（Expo SDK 57 の最低 Node は 22.13.x）。
          # `eas build --local` も内部で app.config.ts を読むため、こちら側の引き上げも必須。
          node-version: 24
          cache: pnpm

      - name: Setup JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API client (Orval)
        run: pnpm --filter mobile orval

      # APK キャッシュのキー = ネイティブ影響入力のハッシュ + packages/mobile ソース全体のハッシュ。
      # GOOGLE_MAPS_ANDROID_SDK_KEY はビルドステップと同じ値を渡す。app.config.ts が
      # このキーの有無で android.config.googleMaps.apiKey を出し分ける（ADR-007）ため、
      # ここで渡さないとキーの有無がキャッシュキーに反映されず、キー注入前にキャッシュされた
      # APK（クラッシュする）がキー注入後も使い回されてしまう。
      #
      # ソース全体のハッシュを合成している理由（2026-08-14 追補、ADR-004追補）:
      # @expo/fingerprint 単体はネイティブに影響する入力しか見ないため、UIやロジックなど
      # JSのみの変更ではキャッシュキーが変わらず、古いJSを埋め込んだAPKが使われ続けていた
      # （standalone preview ビルドはJSを実行時取得ではなくビルド時に埋め込むため、
      # Metro前提のdevelopment buildと違いこれがそのままバグになる）。`git ls-files -s` は
      # 追跡対象ファイルのパス+blobハッシュの一覧なので、内容が変われば決定的に変わり、
      # mtimeやビルド環境には依存しない。E2Eの実行頻度を週次+手動に絞った（このファイル冒頭の
      # コメント参照）ことで、JS変更のたびに再ビルドが発生するコスト増は許容できると判断した。
      - name: Compute build cache key
        id: fp
        env:
          GOOGLE_MAPS_ANDROID_SDK_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_SDK_KEY }}
        run: |
          NATIVE_HASH=$(node -e "require('@expo/fingerprint').createFingerprintAsync('packages/mobile').then(f=>console.log(f.hash))")
          SRC_HASH=$(git ls-files -s packages/mobile | git hash-object --stdin)
          echo "hash=${NATIVE_HASH}-${SRC_HASH:0:16}" >> "$GITHUB_OUTPUT"

      # restore/save を分離している理由: 統合版 actions/cache の保存(post)ステップは
      # `post-if: success()` で定義されており、後続の Maestro ステップが失敗すると
      # キャッシュが保存されない。E2Eが失敗し続けている間はビルド済みAPKが永久に
      # 保存されず、毎回40分のEASビルドが走る悪循環になっていた（実際、SS-44の一連の
      # 修正中は毎回 "Cache not found for input keys: mobile-apk-..." になっていた）。
      # APKのビルド成否とE2Eの成否は無関係なので、ビルド直後に明示的に保存する。
      - name: Restore APK cache
        id: apk-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: packages/mobile/e2e-build/app-preview.apk
          key: mobile-apk-${{ steps.fp.outputs.hash }}

      # キャッシュキー一致時はここをスキップ（＝ネイティブ・ソースともに未変更なら再ビルドしない）
      # timeout-minutes: Gradleの子プロセスが後片付けされずハングする事象があったため、
      # 失敗時に無限に居座らせず確実に完了させる安全策（SS-44）。通常は10分台で終わる想定。
      - name: Build preview APK (local, no EAS cloud minutes)
        if: steps.apk-cache.outputs.cache-hit != 'true'
        timeout-minutes: 40
        working-directory: packages/mobile
        env:
          # app.config.ts が android.config.googleMaps.apiKey へ注入する（ADR-007）。
          # 未注入だと Maps SDK 初期化時に RuntimeException でアプリがクラッシュし、
          # walk-start 系の Maestro フローが軒並み失敗していた（SS-44追補、google_apis
          # イメージへの切り替えで判明）。
          GOOGLE_MAPS_ANDROID_SDK_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_SDK_KEY }}
        run: |
          mkdir -p e2e-build
          npx eas-cli build --local --non-interactive \
            --profile preview --platform android \
            --output e2e-build/app-preview.apk

      # ビルド直後に保存する（E2Eの成否に依存させない）。
      - name: Save APK cache
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: packages/mobile/e2e-build/app-preview.apk
          key: mobile-apk-${{ steps.fp.outputs.hash }}

      # backend(実API)をエミュレータから 10.0.2.2:8000 で到達可能に起動
      - name: Start backend
        working-directory: packages/backend
        run: |
          cp .env.example .env
          sed -i 's/{%BACKEND_API_PORT%}/8000/; s/{%DB_PORT%}/5432/' .env
          # MAPS_MODE=fake は compose.yaml の environment: 経由でコンテナに届き（SS-21）、
          # backend の Settings.maps_mode で実際に解釈される（SS-44）。ENV=test なので
          # 許可リスト検証も通り、/explore/places は FakeGoogleMapsProvider の決定的な候補を返す。
          BACKEND_API_PORT=8000 DB_PORT=5432 \
          ENV=test AUTH_MODE=dev MAPS_MODE=fake AUTH_JWT_SECRET=e2e-insecure-secret-0123456789abcdef \
            docker compose up -d --build
          for i in $(seq 1 30); do
            if docker compose exec -T api python -c "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')" 2>/dev/null; then
              echo "backend healthy"; break
            fi
            sleep 3
          done
          docker compose exec -T api uv run alembic upgrade head

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # ランナーのデフォルトではこのジョブの実行ユーザーに /dev/kvm への権限がなく、
      # エミュレータが -accel off (フルソフトウェアエミュレーション) にフォールバックしていた。
      # その結果 boot に約400秒、adb install に約6分かかり、Maestro実行中に
      # 「Process system isn't responding」のANRが発生して6フロー全てが
      # splash-screen のアサーションで失敗していた（アプリ側のバグではない）。
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # AVD スナップショットのキャッシュは意図的に採用しない。
      # ブート約50秒の短縮にしかならない一方、キャッシュ対象が「ブート済みOSのスナップショット」
      # というステートフルな塊になる。異常な状態を含んだまま保存されるとキーには何の変化も
      # 現れないため、以後の全実行がそれを引き継ぎ続ける（APKキャッシュと違い fingerprint に
      # よる自己修復が効かない）。リスクに対してリターンが見合わないと判断した。
      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          # target 未指定時の既定 "default" は Google Play Services 非搭載の AOSP イメージで、
          # react-native-maps が地図を描画できず "won't run without Google Play services" の
          # エラーバナーに置き換わる。地図の描画自体が前提のアプリなので google_apis が必要。
          #
          # 訂正: 以前このコメントには「そのバナーでレイアウトが押し下げられて
          # walk-start-duration-slider がアサート不可視になっていた」と書かれていたが、
          # これは誤った原因特定だった。google_apis に切り替えた後の実行でも同じアサーションは
          # 失敗し続けており、真因は下の profile（エミュレータの画面サイズ）だった。
          target: google_apis
          # profile 未指定時の既定AVDは 320x640dp（160dpi）と実機よりかなり小さく、
          # 散歩開始画面の walk-start-duration-slider が画面外に押し出されて
          # 「Assertion is false: id: walk-start-duration-slider is visible」で失敗していた
          # （デバッグ用スクリーンショットで「往復の時間」が最下端で見切れているのを確認）。
          # pixel_6 は 1080x2400 @420dpi = 411x914dp 相当で、実機に近い縦幅が得られる。
          # ソフトウェアGPU(swiftshader)で描画するピクセル数は約12倍になるが、実測では
          # ブート 48,985ms（既定AVD時 52,047ms）・6フロー完走 1m55s と悪化しなかった。
          profile: pixel_6
          # ランナーは 4 vCPU / 16GB。既定の cores: 2 に対し、エミュレータ側の余裕を増やす
          # （Maestro 本体のJVM用に1コア残す）。RAMも既定の自動割り当て(2560MB)から引き上げる。
          cores: 3
          ram-size: 4096M
          script: |
            # CIランナーの負荷で Pixel Launcher が ANR を起こすことがあり、その
            # 「〜isn't responding」ダイアログがシステムモーダルとして前面を塞ぐと、
            # 背後のアプリのウィンドウが accessibility 経由のビュー階層から丸ごと消え、
            # 全フローが sign-in-google-button のアサーションで失敗していた。
            # ダイアログを閉じる方式（Wait のタップ）は、ランチャーが応答不能なままなので
            # 約5秒周期で再表示され効果がなかった。ダイアログの表示自体を抑止する。
            # AppErrors はダイアログを *これから表示する* 瞬間にこの設定を参照するだけで、
            # 既に表示中のダイアログを閉じはしない。当初 `adb install` の後にこの設定を
            # 入れていたところ、install 中の負荷（ブート直後で最もCPUが逼迫する区間）で
            # Launcher が ANR し、設定が効く前にダイアログが出てしまい再発した
            # （2026-08-14 調査、run 31813105115 / 31811792167 で同一現象を確認）。
            # 設定適用をできるだけ早める（スクリプトの先頭に置く）ことで発生源となる
            # install 中の負荷区間をこの対策の対象に含める。ただし、この行が実行される
            # 前（アクション内部のブート待ち～disable-animations 処理中）に既に ANR が
            # 起きた場合はダイアログを閉じられない残存リスクがある点は未解消。
            # アプリ自身がクラッシュした場合もダイアログは出なくなるが、要素が見えず
            # アサーションが失敗するので不具合の握り潰しにはならない（logcat も残る）。
            adb shell settings put global hide_error_dialogs 1
            # --- GNSS デッドロック対策（発生源を断つ） ---
            # 事象: Google Play Services 側の裏での位置取得が system_server の GNSS サービスを
            # デッドロックさせ、Watchdog が system_server ごと強制終了する
            # （`Blocked in handler on foreground thread (android.fg) for 71s` /
            # `GnssStatusProvider.onReportStatus` で lock 待ち → `WATCHDOG KILLING SYSTEM PROCESS`）。
            # 以降の全 adb 操作が `Can't find service: package` で失敗し、実行中のフロー以降が
            # 巻き添えで落ちる（run 31819288121 / 31829640836 で同一スタックを確認）。
            #
            # 当初 `cmd location set-location-enabled false` だけを入れたが、これでは止まらない
            # ことが判明した（run 31829640836）。設定投入後も GNSS HAL
            # `android.hardware.gnss-service.ranchu` が `Gnss:onGnssLocationCb` を出し続けて
            # 実際に測位しており、`GnssLocationProvider` の start/stop がフロー境界ごとに
            # 繰り返されていた。GNSS への要求元は Play Services 側の位置プロバイダなので、
            # そちらのコンポーネントを止めないと要求の往復自体が消えない。
            #
            # fused / GoogleLocationManager は system_server が ServiceWatcher 経由で bind する
            # 位置プロバイダの実体（ログ上も両者が繰り返しクラッシュ→再起動していた）。地図の
            # 描画は Maps SDK 側の機能で位置プロバイダに依存しないため、無効化しても
            # react-native-maps の描画には影響しない。
            # 失敗しても実行は継続させる（イメージ差でコンポーネント名が無い場合に落とさない）。
            adb shell pm disable-user --user 0 com.google.android.gms/com.google.android.location.fused.FusedLocationService || true
            adb shell pm disable-user --user 0 com.google.android.gms/com.google.android.location.internal.GoogleLocationManagerService || true
            # ユーザー側の位置情報トグルも併せて落とす（単体では不十分だが、要求元を減らす方向には効く）。
            # preview ビルドは EXPO_PUBLIC_LOCATION_MODE=mock（ADR-006）でアプリ自身は
            # expo-location/GNSS に触れないため、無効化してもフローの前提は壊れない。
            adb shell cmd location set-location-enabled false
            # トグルの状態をログに残す（false が出ること）。ただしこれはユーザー設定の状態でしかなく、
            # GNSS が実際に止まったかは logcat の `Gnss:onGnssLocationCb` が消えたかで判断すること。
            adb shell cmd location is-location-enabled || true

            # --- エミュレータの負荷を下げる ---
            # 描画が約1fpsまで落ちる・`pm clear` が13分54秒かかる、といった飢餓が
            # タップの取りこぼしや Watchdog タイムアウトの温床になっていた（run 31824150888）。
            # logcat の行数で負荷源を測ったところ、上位は GMS(約4700行) / GSA(2369) /
            # settings.intelligence(1599) / GNSS HAL(933) / Bugle(898) / AiAi(592) だった。
            # このうち E2E に不要なものを止める。ネットワークには一切触らない
            # （backend へ 10.0.2.2:8000 で到達する必要があるため）。
            # `pm disable-user` は対象プロセスの kill も伴うので force-stop は不要。
            # AVD は毎回 force-avd-creation: true で作り直すため、この無効化は実行ごとに適用される。
            #
            # googlequicksearchbox は Pixel Launcher の検索ウィジェットの提供元でもあるが、
            # Maestro はランチャーを経由せず am start でアプリを直接起動するため経路上不要。
            # 仮にランチャーが不安定になっても、上の hide_error_dialogs がダイアログを抑止する。
            adb shell pm disable-user --user 0 com.google.android.googlequicksearchbox || true
            adb shell pm disable-user --user 0 com.google.android.apps.messaging || true
            adb shell pm disable-user --user 0 com.google.android.as || true
            adb shell pm disable-user --user 0 com.google.android.settings.intelligence || true
            # バックグラウンドの dexopt がブート直後の CPU を奪うため止める。
            adb shell cmd package bg-dexopt-job --disable || true

            adb install -r packages/mobile/e2e-build/app-preview.apk
            # maps-required を含む全フローを実行する（backend の MAPS_MODE=fake が
            # /explore/places の候補を決定的に返すため、外部データへの依存はない）。
            maestro test packages/mobile/.maestro/

      - name: Upload Maestro debug output
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maestro-debug-output
          path: ~/.maestro/tests/
          if-no-files-found: ignore
          # Public リポジトリのため既定の保持期間（90日）に任せず明示的に短くする。
          retention-days: 7
