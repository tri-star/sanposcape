name: mobile CI

on:
  push:
    branches: [main]
    paths:
      - "packages/mobile/**"
      - "packages/backend/openapi.yaml"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "packages/mobile/**"
      - "packages/backend/openapi.yaml"
      - ".github/workflows/mobile-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API client (Orval)
        run: pnpm --filter mobile orval

      - name: Typecheck
        run: pnpm --filter mobile typecheck

      - name: Lint (oxlint)
        run: pnpm --filter mobile lint

      - name: Format check (oxfmt)
        run: pnpm --filter mobile format:check

      - name: Design token drift check
        run: pnpm --filter mobile design:tokens:check

      - name: Unit tests (Vitest)
        run: pnpm --filter mobile test
