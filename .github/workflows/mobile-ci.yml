name: mobile CI

on:
  push:
    branches: [main]
    paths:
      - "packages/mobile/**"
      - "packages/backend/openapi.yaml"
      # 推移的依存だけの更新 (Dependabot の npm PR など) は packages/mobile/ に触れず
      # ルートのロックファイルだけが変わる。それでも検証が走るようにする。
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "packages/mobile/**"
      - "packages/backend/openapi.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 20 は現行の依存関係のサポート範囲を既に下回っている:
          #   - Expo SDK 57 の最低 Node は 22.13.x
          #   - metro@0.86 の engines は ^22.13.0 || ^24.3.0 || >= 26.0.0
          #   - orval@8.22 の engines は >=22.18.0
          # engine-strict を有効にしていないため動いていただけで、公式にはサポート外だった。
          #
          # さらに TypeScript 7 系は Go 製 tsgo への刷新に伴い ts.transpileModule 等の
          # 公開APIを提供しなくなった（復活は 7.1 予定）。そのため @expo/require-utils は
          # app.config.ts の読み込みを Node の module.stripTypeScriptTypes へフォールバック
          # するが、これは Node 22.13+ にしか存在しない。Node 20 では両方の手段が無くなり、
          # 生のTSがCJSローダーに渡って "Generate Expo Router typed routes" が
          # SyntaxError で落ちる。
          #
          # ローカル開発環境も 24 系のため、CI も 24 に揃える。
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API client (Orval)
        run: pnpm --filter mobile orval

      - name: Generate Expo Router typed routes
        # `expo start` を起動せずに `.expo/types/router.d.ts`（gitignore対象）を生成する。
        # 参考: https://docs.expo.dev/router/reference/typed-routes/#ci
        run: pnpm --filter mobile exec expo customize tsconfig.json

      - name: Typecheck
        run: pnpm --filter mobile typecheck

      - name: Lint (oxlint)
        run: pnpm --filter mobile lint

      - name: Format check (oxfmt)
        run: pnpm --filter mobile format:check

      - name: Unit tests (Vitest)
        run: pnpm --filter mobile test
