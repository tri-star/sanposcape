          ["AWS/Lambda","Duration","FunctionName","${Api}",{"stat":"p95","label":"p95"}],
          ["AWS/Lambda","Duration","FunctionName","${Api}",{"stat":"p99","label":"p99"}],
          ["AWS/Lambda","Duration","FunctionName","${Api}",{"stat":"Maximum","label":"max"}]],
          "annotations":{"horizontal":[{"label":"アプリの時間予算 25s (config.py)","value":25000},{"label":"Lambda Timeout 29s (template.yaml)","value":29000}]}}},
          {"type":"metric","x":16,"y":10,"width":8,"height":6,"properties":{"title":"Lambda: 同時実行数 (Maximum)","region":"${AWS::Region}","view":"timeSeries","period":300,"stat":"Maximum","metrics":[
          ["AWS/Lambda","ConcurrentExecutions","FunctionName","${Api}"]],
          "annotations":{"horizontal":[{"label":"上限","value":${ConcurrencyLimit}}]}}},
          {"type":"log","x":0,"y":16,"width":14,"height":8,"properties":{"title":"ルート別: 件数・レイテンシ・4xx/5xx 率 (Q1)","region":"${AWS::Region}","view":"table","query":"SOURCE 'aws/spans' | filter `resource.attributes.service.name` = '${ServiceName}' and kind = 'SERVER' and `attributes.aws.span.kind` = 'LOCAL_ROOT' | fields name as operation, `attributes.http.status_code` as status, durationNano / 1000000 as duration_ms | fields floor(status / 500) as is5xx, floor(status / 400) - floor(status / 500) as is4xx | stats count(*) as requests, pct(duration_ms, 50) as p50_ms, pct(duration_ms, 95) as p95_ms, pct(duration_ms, 99) as p99_ms, sum(is4xx) as n4xx, sum(is5xx) as n5xx, sum(is4xx) * 100 / count(*) as rate4xx_pct, sum(is5xx) * 100 / count(*) as rate5xx_pct by operation | sort requests desc | limit 100"}},
          {"type":"log","x":14,"y":16,"width":10,"height":8,"properties":{"title":"ルート × ステータス (Q2)","region":"${AWS::Region}","view":"table","query":"SOURCE 'aws/spans' | filter `resource.attributes.service.name` = '${ServiceName}' and kind = 'SERVER' and `attributes.aws.span.kind` = 'LOCAL_ROOT' | stats count(*) as requests, pct(durationNano / 1000000, 95) as p95_ms by name, `attributes.http.status_code` | sort requests desc | limit 200"}},
          {"type":"log","x":0,"y":24,"width":12,"height":8,"properties":{"title":"直近の 5xx (Q3、traceId から X-Ray のトレースへ)","region":"${AWS::Region}","view":"table","query":"SOURCE 'aws/spans' | filter `resource.attributes.service.name` = '${ServiceName}' and kind = 'SERVER' and `attributes.aws.span.kind` = 'LOCAL_ROOT' and `attributes.http.status_code` >= 500 | fields @timestamp, name, `attributes.http.status_code` as status, durationNano / 1000000 as duration_ms, traceId | sort @timestamp desc | limit 20"}},
          {"type":"log","x":12,"y":24,"width":12,"height":8,"properties":{"title":"ルート別の件数の時系列 (Q4)","region":"${AWS::Region}","view":"timeSeries","stacked":false,"query":"SOURCE 'aws/spans' | filter `resource.attributes.service.name` = '${ServiceName}' and kind = 'SERVER' and `attributes.aws.span.kind` = 'LOCAL_ROOT' | stats count(*) as requests by bin(1h), name"}},
          {"type":"log","x":0,"y":32,"width":8,"height":6,"properties":{"title":"メモリ (MB、REPORT 行) (Q5)","region":"${AWS::Region}","view":"timeSeries","stacked":false,"query":"SOURCE '${ApiLogGroup}' | filter @type = 'REPORT' | stats max(@maxMemoryUsed / 1000 / 1000) as max_mb, pct(@maxMemoryUsed / 1000 / 1000, 95) as p95_mb, avg(@maxMemoryUsed / 1000 / 1000) as avg_mb, max(@memorySize / 1000 / 1000) as limit_mb by bin(1h)"}},
          {"type":"log","x":8,"y":32,"width":8,"height":6,"properties":{"title":"コールドスタート 件数・割合 (Q6a)","region":"${AWS::Region}","view":"timeSeries","stacked":false,"query":"SOURCE '${ApiLogGroup}' | filter @type = 'REPORT' | stats count(*) as invocations, count(@initDuration) as cold_starts, count(@initDuration) * 100 / count(*) as cold_start_pct by bin(1h)"}},
          {"type":"log","x":16,"y":32,"width":8,"height":6,"properties":{"title":"コールドスタート Init Duration (ms) (Q6b)","region":"${AWS::Region}","view":"timeSeries","stacked":false,"query":"SOURCE '${ApiLogGroup}' | filter @type = 'REPORT' and ispresent(@initDuration) | stats pct(@initDuration, 50) as init_p50_ms, pct(@initDuration, 95) as init_p95_ms, max(@initDuration) as init_max_ms by bin(1h)"}},
          {"type":"log","x":0,"y":38,"width":24,"height":6,"properties":{"title":"タイムアウト / OOM / ランタイムの異常終了 (Q7)","region":"${AWS::Region}","view":"timeSeries","stacked":false,"query":"SOURCE '${ApiLogGroup}' | filter @message like /Task timed out/ or @message like /Runtime exited/ or @message like /Runtime.OutOfMemory/ | stats count(*) as n by bin(1h)"}}
          ]}
        - ConcurrencyLimit: !If [IsProd, '10', '5']
          ServiceName: sanposcape-backend-api  # Api の OTEL_SERVICE_NAME と一致させる（テストで固定）

  # 通知先は platform 層の SNS（SSM の契約値）。dev は ActionsEnabled: false で、状態はコンソールで見られるが
  # 通知は飛ばない（AlarmActions は dev でも設定しておく。有効化するときは ActionsEnabled を変えるだけ）。
  # レイテンシ / 4xx 率 / SLO のアラームは prod のベースラインが取れてから足す（docs/deployment.md §14）。
  ApiLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "sanposcape-${Env}-backend-api-lambda-errors"
      AlarmDescription: >-
        Api の Lambda が 5 分間に 1 件以上エラーを返した（タイムアウト・OOM・初期化の失敗・
        ランタイムのクラッシュ・ハンドラーまで届いた未処理例外）。5xx のアラームとは、ハンドラーが
        例外を投げたときに両方鳴りうる（二重の通知は許容する）。
        ダッシュボード sanposcape-<env>-backend-api の「Lambda: 呼び出し (左軸) / エラー・スロットル (右軸)」と
        「タイムアウト / OOM / ランタイムの異常終了 (Q7)」を見る。
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref Api
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: !If [IsProd, true, false]
      AlarmActions:
        - !Sub '{{resolve:ssm:/sanposcape/${Env}/platform/alerting/topic_arn}}'
      OKActions:
        - !Sub '{{resolve:ssm:/sanposcape/${Env}/platform/alerting/topic_arn}}'

  ApiLambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "sanposcape-${Env}-backend-api-lambda-throttles"
      AlarmDescription: >-
        Api が 5 分間に 1 件以上スロットルされた（同時実行数の上限: dev は予約 5、prod はアカウントの
        クォータ 10）。ダッシュボード sanposcape-<env>-backend-api の「Lambda: 同時実行数 (Maximum)」を見る。
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref Api
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: !If [IsProd, true, false]
      AlarmActions:
        - !Sub '{{resolve:ssm:/sanposcape/${Env}/platform/alerting/topic_arn}}'
      OKActions:
        - !Sub '{{resolve:ssm:/sanposcape/${Env}/platform/alerting/topic_arn}}'

  ApiFaultsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "sanposcape-${Env}-backend-api-5xx"
      AlarmDescription: >-
        API の 5xx が 5 分間に 3 件以上（Application Signals の Fault。外部 API の障害による 503 も含む）。
        率ではなく件数なのは、リクエストが少ないうちは 1 件で 100% になるため（件数から率に変える条件は
        docs/deployment.md §14）。Lambda の Errors のアラームと二重に鳴ることがある。
        ダッシュボード sanposcape-<env>-backend-api の「ルート別: 件数・レイテンシ・4xx/5xx 率 (Q1)」と
        「直近の 5xx (Q3、traceId から X-Ray のトレースへ)」を見る。
        鳴るはずの状況で鳴らないときは、Dimension の値がずれていないか list-metrics で確かめる（§14）。
      Namespace: ApplicationSignals
      MetricName: Fault
      # ダッシュボードの Application Signals と同じ 3 つ組（dev で存在を確認済み）。
      # Operation を外すと LambdaService / InternalOperation も数えて二重計上になる。
      Dimensions:
        - Name: Environment
          Value: !Ref Env
        - Name: Operation
          Value: !Sub "${Api}/FunctionHandler"
        - Name: Service
          Value: sanposcape-backend-api  # Api の OTEL_SERVICE_NAME と一致させる（テストで固定）
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: !If [IsProd, true, false]
      AlarmActions:
        - !Sub '{{resolve:ssm:/sanposcape/${Env}/platform/alerting/topic_arn}}'
      OKActions:
        - !Sub '{{resolve:ssm:/sanposcape/${Env}/platform/alerting/topic_arn}}'

  Migrate:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "sanposcape-${Env}-backend-migrate"
      CodeUri: .
      Handler: sanposcape.aws_lambda.migrate.handler
      Timeout: 300  # Function URL を持たないので CloudFront 由来の 29 秒制約の対象外
      # alembic upgrade head の同時実行を防ぐ（prod はクォータの都合で未予約。Api と同じ理由）。
      ReservedConcurrentExecutions: !If [IsProd, !Ref "AWS::NoValue", 1]
      # FunctionUrlConfig は付けない（外から叩けない。手動 invoke のみ）
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub '{{resolve:ssm:/sanposcape/${Env}/platform/secrets/shared/arn}}'

  MigrateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/sanposcape-${Env}-backend-migrate"
      RetentionInDays: !If [IsProd, 400, 30]

Outputs:
  FunctionUrl:
    Description: CloudFront のオリジンになる Function URL（末尾スラッシュ付き）
    Value: !GetAtt ApiUrl.FunctionUrl
  FunctionName:
    Description: Terraform が lambda:AddPermission を付ける対象
    Value: !Ref Api
  DashboardName:
    Description: API のダッシュボード名（CloudWatch コンソールで開く。docs/deployment.md §14）
    Value: !Ref ApiDashboard
