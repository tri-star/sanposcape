AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: sanposcape backend API on Lambda (Function URL origin for CloudFront)

# ★ Terraform（別リポジトリ sanposcape-infra）との契約:
#   - スタック名 sanposcape-backend-<env> / 関数名 sanposcape-<env>-backend-* は変更しない
#   - CloudFront / WAF / Route53 / ACM / Secrets Manager の器 / アクセスログ S3 は
#     ここでは一切作らない（Terraform 所有）
#   - CloudFront からの呼び出し許可（lambda:InvokeFunctionUrl / lambda:InvokeFunction）は
#     Terraform 側が付ける。AWS::Lambda::Permission をここに書かない（二重管理防止）
#   - 実行ロールには Terraform が作る Permission Boundary（SSM の lambda_boundary_arn）を必ず付ける。
#     外すと CI のデプロイロールが CreateRole を拒否する（Globals.Function の PermissionsBoundary 参照）
#   デプロイ順は常に SAM → Terraform。詳細: docs/deployment.md
#   - トレース（ADR-013 / SS-178）: Api だけに ADOT レイヤー・Active Tracing・OTEL_* と管理ポリシー
#     CloudWatchLambdaApplicationSignalsExecutionRolePolicy を付ける。これらの付与（デプロイロールの
#     lambda:GetLayerVersion / ReadAttachedManagedPolicies、境界の X-Ray / logs 許可）は infra の
#     SS-185 が前提。prod は SS-185 の prod 適用までデプロイできない（GetLayerVersion とポリシーの
#     付与で失敗する。docs/deployment.md §13）。
#   - 監視（ADR-013 / SS-179）: ダッシュボード 1 枚と、ap-southeast-1 のアラーム
#     （sanposcape-<env>-backend-*）はこのファイルが所有する。CloudFront のアラーム（us-east-1）は
#     Terraform 所有（live/services/backend-api/monitoring.tf）で、ここでは作らない。デプロイロールの
#     ManageBackendMonitoring（infra の sanposcape-infra PR #53。名前を sanposcape-<env>-backend-* に
#     絞った CloudWatch のダッシュボード・アラーム操作。DescribeAlarms だけ Resource: "*"）が前提。
#     infra の dev への apply より先にマージしない（dev へのデプロイが AccessDenied で止まる。
#     docs/deployment.md §3 / §14）。prod は ManageBackendMonitoring の prod 適用（SS-185 の prod 適用と
#     同じタイミング）と、platform 層の SNS（SSM alerting/topic_arn）の prod 値が前提。通知先の SNS は
#     SSM /sanposcape/<env>/platform/alerting/topic_arn から deploy 時解決する。
#   - AppConfig（フィーチャーフラグ、SS-94/ADR-008）の ID は SSM 契約（SS-94）から deploy 時解決。
#     Lambda 実行ロールの Permission Boundary（SS-95）は ID までは絞れないワイルドカード ARN
#     のため、完全 ARN への絞り込みは Api の Policies（このファイル）が唯一の場所（SS-98）。
#   - ピン写真バケット（S3、SS-106/ADR-009）の名前・ARN は SSM 契約（pin_photos/*）から deploy 時解決。
#     バケットは live/platform 所有で、ここでは作らない。境界（SS-107）は sanposcape-<env>-* 全体を
#     上限にしているため、写真バケットの ARN・prefix への絞り込みは Api の Policies が唯一の場所（SS-108）。

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, prod]
    Description: Terraform 側と共有するデプロイ環境識別子（アプリの ENV とは別物。下の Mappings 参照）

Conditions:
  IsProd: !Equals [!Ref Env, prod]

Mappings:
  # スタックパラメータ Env(dev/prod) は Terraform との契約。
  # アプリの ENV(staging/production) は config.py の許可リスト方式 fail-safe 検証の契約で、
  # 値域を安易に広げると過去に staging が検証から漏れて認証バイパスになった罠を再演するリスクがある
  # ため、config.py 側の Literal は変えずここで変換する
  # （docs/adr/ADR-005-backend-serverless-deployment-lambda-function-url.md 決定6）。
  EnvToAppEnv:
    dev: { AppEnv: staging }
    prod: { AppEnv: production }

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    MemorySize: 1024
    # CloudFront のオリジン読み取りタイムアウトが 30 秒。超えると CloudFront が 504 を返す。
    Timeout: 29
    # ★ SAM が作る Lambda 実行ロール（Api / Migrate）に付ける Permission Boundary。
    #   - GitHub Actions のデプロイロール（sanposcape-infra の live/account/sam_deploy.tf）は
    #     iam:CreateRole を「iam:PermissionsBoundary がこの ARN と一致する場合」だけ許可している。
    #     ここを外すと CI からのデプロイが CreateRole の AccessDenied で止まる。
    #   - 境界が許すのは自関数のログ書き込み・/sanposcape/<env>/* のシークレットと SSM の読み取り・
    #     KMS Decrypt・X-Ray 程度。デプロイロールは PutRolePolicy / AttachRolePolicy も持つため、
    #     境界が無いと「強い実行ロールを作って Lambda に渡す」経路で管理者へ昇格できてしまう。
    #     実行時に新しい AWS 操作が要るようになったら、ここではなく infra 側の境界を先に広げること。
    #   - 実行ロールの RoleName は明示しない。デプロイロールの許可は CFn の自動命名
    #     （sanposcape-backend-<env>-<論理ID>-<乱数>）に一致するロールだけが対象。
    #   - ARN はアカウント ID を含むため、SSM から deploy 時に解決する（APP_SECRET_ARN と同じ理由）。
    #   - 既存の（境界の無い）ロールへ境界を後付けするには iam:PutRolePermissionsBoundary が要るが、
    #     デプロイロールはこの操作を明示的に拒否している。境界を初めて入れるデプロイは
    #     CI からは通らず、手元の管理者権限で 1 回流す必要がある（docs/deployment.md §7）。
    PermissionsBoundary: !Sub '{{resolve:ssm:/sanposcape/${Env}/account/lambda_boundary_arn}}'
    # ★ VpcConfig は付けない。Neon / Google JWKS / Google Maps API はすべてインターネット経由で、
    #   VPC に入れると NAT Gateway の固定費と ENI 起因のコールドスタートが乗るだけ（決定5）。
    Environment:
      Variables:
        ENV: !FindInMap [EnvToAppEnv, !Ref Env, AppEnv]
        AUTH_MODE: real
        MAPS_MODE: real
        FEATURE_FLAG_MODE: real
        # コード既定も real だが、AUTH_MODE 等と同じく明示する（fake はローカル・E2E 専用）。
        STORAGE_MODE: real
        # Neon への同時接続数を ReservedConcurrentExecutions と合わせて有界化する（決定5）。
        DB_POOL_SIZE: '1'
        DB_MAX_OVERFLOW: '0'
        DB_POOL_RECYCLE_SECONDS: '280'
        # DB_DISABLE_PREPARED_STATEMENTS は意図的に設定しない（既定 false のまま）。
        # Neon の PgBouncer はプロトコルレベルの prepared statement に対応済みのため、
        # psycopg3 の既定（prepare_threshold=5）のままで問題ない。
        # "prepared statement ... already exists" 系のエラーが実際に出た場合のみ
        # true に変更する（docs/deployment.md のトラブルシュート参照）。
        # GOOGLE_MAPS_LOOP_ROUTE_ENABLED（周回ルートの kill switch、SS-33/ADR-007）も同じ方針で
        # 意図的に設定しない（既定 true のまま。config.py）。品質劣化時の緊急停止が必要なときだけ
        # false に変更する（即時反映は `aws lambda update-function-configuration`、恒久化はここに
        # `GOOGLE_MAPS_LOOP_ROUTE_ENABLED: 'false'` を追記して redeploy。docs/deployment.md
        # 「周回ルートの kill switch」参照）。
        # 値ではなく ARN を渡す。deploy 時に CloudFormation が SSM から解決する
        # （実行ロールに ssm:GetParameter は不要。account ID がリポジトリに出ないようにするため）。
        APP_SECRET_ARN: !Sub '{{resolve:ssm:/sanposcape/${Env}/platform/secrets/shared/arn}}'
    Tags:
      # ★ dev アカウントは他プロジェクトと共有。Budget が Project=sanposcape でコストを切り出す。
      Project: sanposcape
      Env: !Ref Env
      ManagedBy: sam
      Repo: sanposcape

Resources:
  Api:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "sanposcape-${Env}-backend-api"  # ★ sanposcape- 始まりが必須（契約）
      CodeUri: .
      Handler: sanposcape.aws_lambda.api.handler
      # in-process キャッシュ / レート制限の実効倍率と Neon への接続数をここで有界化する。
      # prod は Lambda 同時実行数クォータが初期値10のままで、予約すると必ず
      # InvalidParameterValueException になる（クォータ引き上げが通るまで）。
      # 引き上げが通ったら dev と同じ値を入れる
      # （docs/adr/ADR-005-backend-serverless-deployment-lambda-function-url.md 決定8 / docs/deployment.md）。
      ReservedConcurrentExecutions: !If [IsProd, !Ref "AWS::NoValue", 5]
      FunctionUrlConfig:
        AuthType: AWS_IAM  # ★ NONE にしない（Function URL の直叩きを構造的に塞ぐ）
      # ★ トレース（ADR-013 / SS-178）。Migrate には付けない（API のリクエストだけを計装する）。
      #   Active Tracing は Lambda サービス側の区間（Init / Invocation / Overhead）と ADOT の送信先
      #   （X-Ray のデーモン）に要る。SAM が AWSXrayWriteOnlyAccess を実行ロールに付ける。
      Tracing: Active
      # ADOT（AWS Distro for OpenTelemetry）の Python レイヤー。版は固定する。上げるときは dev で
      # 確かめ、pyproject.toml の dev グループの opentelemetry-* の版と
      # OTEL_PYTHON_DISABLED_INSTRUMENTATIONS（レイヤーの既定値）を一緒に見直す（docs/deployment.md）。
      # v28 の中身は aws-opentelemetry-distro 0.21.0（api/sdk 1.44.0、instrumentation 0.65b0）。zip を取得して
      # 確認済み（SS-178。計装の版は v27 = 0.20.0 と同じで、dev グループの == 固定と一致する）。
      # 上げたら、ダッシュボードのクエリが読むスパンのフィールド名（kind / http.status_code /
      # traceId / scope.name など）も dev で確かめる（docs/deployment.md §14 の Q1。Lambda 計装の版は 0.61b0）。
      Layers:
        - arn:aws:lambda:ap-southeast-1:615299751070:layer:AWSOpenTelemetryDistroPython:28
      # AppConfig の ID は Api だけに渡す（Migrate はフラグを読まない。最小権限）。
      # Globals の Variables とマージされる。
      Environment:
        Variables:
          APPCONFIG_APPLICATION_ID: !Sub '{{resolve:ssm:/sanposcape/${Env}/platform/appconfig/application_id}}'
          APPCONFIG_ENVIRONMENT_ID: !Sub '{{resolve:ssm:/sanposcape/${Env}/platform/appconfig/environment_id}}'
          APPCONFIG_CONFIGURATION_PROFILE_ID: !Sub '{{resolve:ssm:/sanposcape/${Env}/platform/appconfig/configuration_profile_id}}'
          # 写真バケット名（SS-106）。名前にアカウント ID を含むため直書きしない。
          # 空だと UnconfiguredObjectStorage（写真 API が 503）になる。Migrate には渡さない。
          PIN_PHOTO_BUCKET_NAME: !Sub '{{resolve:ssm:/sanposcape/${Env}/platform/pin_photos/bucket_name}}'
          # --- トレース（ADR-013 / SS-178）。Api だけ。Globals には置かない ---
          # アプリ側の計装（FastAPI・SQLAlchemy・httpx・urllib・threading の手動計装）を有効にする。
          TRACING_ENABLED: 'true'
          # ADOT の起動ラッパー。TracerProvider はこれが作る（アプリは作らない。決定7）。
          AWS_LAMBDA_EXEC_WRAPPER: /opt/otel-instrument
          OTEL_SERVICE_NAME: sanposcape-backend-api
          # aws.log.group.names はレイヤーも自動で付ける（重複するが値は同じで無害）。
          OTEL_RESOURCE_ATTRIBUTES: !Sub 'deployment.environment=${Env},aws.log.group.names=/aws/lambda/sanposcape-${Env}-backend-api'
          OTEL_AWS_APPLICATION_SIGNALS_ENABLED: 'true'
          # レイヤー v28 の otel-instrument の既定値と同じ文字列を明示する（レイヤーを上げて既定値が
          # 変わっても、有効な計装が黙って増減しないように。決定1）。結果として自動計装は
          # botocore だけ。fastapi / sqlalchemy / httpx は zip 側のライブラリで、起動時
          # （sitecustomize）の sys.path に /var/task が無く自動計装の依存チェックを通らないため、
          # urllib はクエリ（JWKS の URL など）を除くフックを付けるため、threading は
          # ThreadPoolExecutor の子スパンを繋ぐため、アプリから手動で計装する。
          # fastapi だけを書く方式は既定値を上書きして他の計装を一斉に有効にしてしまうので真似しない。
          OTEL_PYTHON_DISABLED_INSTRUMENTATIONS: 'aio-pika,aiohttp-client,aiohttp-server,aiopg,asgi,asyncio,asyncpg,boto,boto3,cassandra,celery,confluent_kafka,dbapi,django,falcon,fastapi,flask,grpc_client,grpc_server,grpc_aio_client,grpc_aio_server,httpx,jinja2,kafka,logging,mysql,mysqlclient,pika,psycopg,psycopg2,pymemcache,pymongo,pymysql,pyramid,redis,remoulade,requests,sklearn,sqlalchemy,sqlite3,starlette,system_metrics,threading,tornado,tortoiseorm,urllib,wsgi,openai_agents,aws_openai_agents,aws_crewai,aws_langchain,aws_mcp,aws_llama-index'
          # 公開エンドポイントでクライアントの traceparent / baggage を親として受け入れない
          # （トレースの乗っ取り・sampled の強制を防ぐ）。mobile からトレースを繋ぐときに見直す。
          OTEL_PROPAGATORS: xray
          # flush はレスポンスの前に同期で走る。既定の 30 秒は Lambda の Timeout（29 秒）より長く、
          # 時間予算（25 秒）の外にはみ出すため 1 秒に絞る（dev で実測して見直す）。
          OTEL_INSTRUMENTATION_AWS_LAMBDA_FLUSH_TIMEOUT: '1000'
          # 意図的に設定しないもの: OTEL_SEMCONV_STABILITY_OPT_IN（ADOT の Application Signals が旧
          # semconv しか読まない）、OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_*（決定6: ヘッダーを
          # 属性に入れない）、OTEL_TRACES_SAMPLER（決定4: 既定の parent based のまま実測する）、
          # logging 関係（SS-180）: LoggingConfig は Text のまま（アプリが JSON を出す。ADR-013 決定3
          # の SS-180 追補）。OTEL_PYTHON_LOG_CORRELATION も使わない（logging 計装は上の無効リスト）。
      Policies:
        # Application Signals の実行ロール用の管理ポリシー（xray:PutTraceSegments と
        # /aws/application-signals/data への logs 書き込み）。付与に必要な権限は infra の SS-185。
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/CloudWatchLambdaApplicationSignalsExecutionRolePolicy'
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub '{{resolve:ssm:/sanposcape/${Env}/platform/secrets/shared/arn}}'
            # kms:Decrypt は不要（AWS 管理キー + kms:ViaService で同一アカウントを許可済み）
            # ★ IAM のアクション名前空間は appconfig:（エンドポイントは appconfigdata だが
            #   IAM のアクションはこの綴り。境界（SS-95）もこの綴りで確認済み）。
            #   境界はワイルドカードなので、完全 ARN への絞り込みはここが唯一の場所。
            - Effect: Allow
              Action:
                - appconfig:StartConfigurationSession
                - appconfig:GetLatestConfiguration
              # ★ Fn::Sub の変数マップの値は素の文字列としてそのまま埋め込まれ、値の中の
              #   ${Env} は再評価されない（マップ値自身を !Sub で包んだときだけ、その !Sub が
              #   自分のスコープで ${Env} を解決する）。3本とも個別に !Sub で包む必要がある。
              Resource: !Sub
                - 'arn:aws:appconfig:ap-southeast-1:${AWS::AccountId}:application/${AppId}/environment/${EnvId}/configuration/${ProfileId}'
                - AppId: !Sub '{{resolve:ssm:/sanposcape/${Env}/platform/appconfig/application_id}}'
                  EnvId: !Sub '{{resolve:ssm:/sanposcape/${Env}/platform/appconfig/environment_id}}'
                  ProfileId: !Sub '{{resolve:ssm:/sanposcape/${Env}/platform/appconfig/configuration_profile_id}}'
            # ★ ピン写真（SS-108, ADR-009 決定8, docs/deployment.md §12）。
            #   - S3CrudPolicy 等の SAM ポリシーテンプレートは使わない（prefix で絞れず、境界外の
            #     PutObjectAcl 等まで並んで実効権限が読めなくなる）。
            #   - ARN は名前から組み立てず bucket_arn を使う。ここに無いアクションが要るときは、
            #     先に infra 側の境界（SS-107: Put/Get/Delete/AbortMultipartUpload + ListBucket）を広げる。
            #   - staging/* の PutObject は presigned POST の署名者権限として必須。外すと署名の発行は
            #     成功するのに実際のアップロードが全て 403 になる（デプロイでは検知できない）。
            #   - CopyObject（staging/ → original/）はコピー元の GetObject + コピー先の PutObject で足りる。
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
              Resource:
                - !Sub '{{resolve:ssm:/sanposcape/${Env}/platform/pin_photos/bucket_arn}}/staging/*'
                - !Sub '{{resolve:ssm:/sanposcape/${Env}/platform/pin_photos/bucket_arn}}/original/*'
                - !Sub '{{resolve:ssm:/sanposcape/${Env}/platform/pin_photos/bucket_arn}}/thumb/*'
            # 無いと存在しないキーの HEAD/GET が 404 ではなく 403 になり、backend は安全側の 503 に倒す
            # （409 が 503 に化ける）。Resource はバケット ARN そのもの（/* を付けると一致しない）。
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !Sub '{{resolve:ssm:/sanposcape/${Env}/platform/pin_photos/bucket_arn}}'

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/sanposcape-${Env}-backend-api"
      RetentionInDays: !If [IsProd, 400, 30]

  # ===========================================================================
  # 監視（ADR-013 / SS-179）: ダッシュボード 1 枚とアラーム 3 本
  #   - 置き場の理由: ADR-013 決定2 の SS-179 追補。クエリの読み方・アラームの意味・
  #     デプロイ後の確認: docs/deployment.md §14
  #   - ★ Application Signals の Service ディメンション・Logs Insights の service.name は
  #     Api の OTEL_SERVICE_NAME と同じ文字列でなければならない。ダッシュボードは Sub の変数
  #     ServiceName、アラームは直書きで持ち、一致は
  #     src/sanposcape/tests/test_monitoring_config.py が固定する。
  #   - ★ Application Signals のメトリクスとアラームは Operation = <関数名>/FunctionHandler で絞る。
  #     サービス単位 {Environment, Service} には LambdaService / InternalOperation（初期化時の
  #     Secrets Manager 呼び出しなど）の操作も含まれ、そのまま数えると二重計上になる
  #     （dev で確認済み、2026-10-05）。
  #   - ★ アラームは TreatMissingData: notBreaching。Dimension の値（Environment / Operation /
  #     Service）が実際のメトリクスとずれると、データ無し = 正常として黙って鳴らなくなる。
  #     デプロイ後に docs/deployment.md §14 の list-metrics で値を確かめること。
  #   - ★ コンソールでダッシュボードを編集しても、次のデプロイで上書きされる。試すときは
  #     「名前を付けて保存」で別名にする。
  #   - ★ SS-180 では Api の LoggingConfig を Text のままにした（アプリのフォーマッターが JSON を
  #     出す）。将来 LoggingConfig.LogFormat: JSON にするなら、メモリ / コールドスタート /
  #     異常終了のクエリ（REPORT 行を @type = 'REPORT' で読むもの）も platform.report の形式に直す
  #     （Q5〜Q6b は直さないと test_monitoring_config.py が落ちる。Q7 は @message の文言で
  #     引いていて見張りの対象外なので、JSON 化のときに手で見直すこと）。
  #   - 名前は必ず sanposcape-<env>-backend- で始める（デプロイロールの許可の接頭辞）。
  #   - Migrate（手動で invoke する）にはアラームを付けない。結果は呼び出した人が受け取り、
  #     失敗は §5.2 の手順の中で気づくため。
  #   - dev の実測で確認済みのフィールド名・次元と、まだ確認できていないもの（全ウィジェットの
  #     描画、Q4、Q7 の文言、サンプリング）は docs/deployment.md §14 を参照。
  # ===========================================================================
  ApiDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "sanposcape-${Env}-backend-api"
      # Sub の変数マップ:
      #   ConcurrencyLimit: 同時実行数のグラフに引く水平線（dev は Api の予約 5 / prod はアカウントの
      #     クォータ 10）。Api の ReservedConcurrentExecutions と一致することはテストで固定する。
      #   ServiceName: Api の OTEL_SERVICE_NAME（上の ★ を参照）。
      DashboardBody: !Sub
        - |
          {"start":"-P7D","periodOverride":"auto","widgets":[
          {"type":"text","x":0,"y":0,"width":24,"height":4,"properties":{"markdown":"## sanposcape backend API (${Env})\n- **Application Signals 由来**(上段の API 全体): 操作 `<関数名>/FunctionHandler` のメトリクス。Latency に Init(コールドスタート)は含まれない。ユーザー体感の遅さは CloudFront の OriginLatency(infra のアラーム)と Init Duration の表で見る。\n- **aws/spans 由来**(ルート別の表・直近の 5xx): サンプリングされたスパンだけ。\n- **Lambda 標準メトリクス / REPORT 行由来**(Lambda・メモリ・コールドスタート): 全件。件数の正はこちら。\n- ログのウィジェット(表・メモリ等)は開く・更新するたびにスキャンが走る。**自動更新は付けないこと**。\n- 読み方・クエリのコピー・アラームの意味: docs/deployment.md §14"}},
          {"type":"metric","x":0,"y":4,"width":8,"height":6,"properties":{"title":"API 全体: リクエスト数 / 4xx / 5xx","region":"${AWS::Region}","view":"timeSeries","period":300,"metrics":[
          ["ApplicationSignals","Latency","Environment","${Env}","Operation","${Api}/FunctionHandler","Service","${ServiceName}",{"stat":"SampleCount","id":"req","label":"requests"}],
          ["ApplicationSignals","Error","Environment","${Env}","Operation","${Api}/FunctionHandler","Service","${ServiceName}",{"stat":"Sum","id":"err","label":"4xx"}],
          ["ApplicationSignals","Fault","Environment","${Env}","Operation","${Api}/FunctionHandler","Service","${ServiceName}",{"stat":"Sum","id":"fault","label":"5xx"}]]}},
          {"type":"metric","x":8,"y":4,"width":8,"height":6,"properties":{"title":"API 全体: エラー率 (%)","region":"${AWS::Region}","view":"timeSeries","period":300,"yAxis":{"left":{"min":0}},"metrics":[
          ["ApplicationSignals","Latency","Environment","${Env}","Operation","${Api}/FunctionHandler","Service","${ServiceName}",{"stat":"SampleCount","id":"req","visible":false}],
          ["ApplicationSignals","Error","Environment","${Env}","Operation","${Api}/FunctionHandler","Service","${ServiceName}",{"stat":"Sum","id":"err","visible":false}],
          ["ApplicationSignals","Fault","Environment","${Env}","Operation","${Api}/FunctionHandler","Service","${ServiceName}",{"stat":"Sum","id":"fault","visible":false}],
          [{"expression":"100*FILL(fault,0)/req","label":"5xx %","id":"fault_pct"}],
          [{"expression":"100*FILL(err,0)/req","label":"4xx %","id":"err_pct"}]]}},
          {"type":"metric","x":16,"y":4,"width":8,"height":6,"properties":{"title":"API 全体: レイテンシ (ms、Init を含まない)","region":"${AWS::Region}","view":"timeSeries","period":300,"metrics":[
          ["ApplicationSignals","Latency","Environment","${Env}","Operation","${Api}/FunctionHandler","Service","${ServiceName}",{"stat":"p50","label":"p50"}],
          ["ApplicationSignals","Latency","Environment","${Env}","Operation","${Api}/FunctionHandler","Service","${ServiceName}",{"stat":"p95","label":"p95"}],
          ["ApplicationSignals","Latency","Environment","${Env}","Operation","${Api}/FunctionHandler","Service","${ServiceName}",{"stat":"p99","label":"p99"}]]}},
          {"type":"metric","x":0,"y":10,"width":8,"height":6,"properties":{"title":"Lambda: 呼び出し (左軸) / エラー・スロットル (右軸)","region":"${AWS::Region}","view":"timeSeries","period":300,"stat":"Sum","yAxis":{"left":{"min":0},"right":{"min":0}},"metrics":[
          ["AWS/Lambda","Invocations","FunctionName","${Api}"],
          ["AWS/Lambda","Errors","FunctionName","${Api}",{"yAxis":"right"}],
          ["AWS/Lambda","Throttles","FunctionName","${Api}",{"yAxis":"right"}]]}},
