[project]
name = "sanposcape-backend"
version = "0.1.0"
description = "sanposcape backend API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    # 0.142 以降は opentelemetry-api を必須依存にし、import 時に読み込み、さらに FastAPI 自身が
    # スパン・メトリクス・ログ（例外メッセージ・スタックトレース込み）を出す。OpenTelemetry は zip に
    # 入れない方針（ADR-013 決定1・Makefile の検査）、手動計装との二重化、外部へ出してよい情報の
    # ルール（決定6）と衝突するため、対応方針が決まるまで 0.142 未満に固定する（SS-223）。
    "fastapi>=0.141.1,<0.142",
    "uvicorn[standard]>=0.32",
    # [asyncio] extra = greenlet。アプリは同期 SQLAlchemy だが、OpenTelemetry の SQLAlchemy 計装
    # （ADR-013 / SS-178）は instrument() の中で `sqlalchemy.ext.asyncio` を import し、SQLAlchemy 2.1
    # は greenlet を既定の依存に含まない（入っていないと ImportError で get_engine() が落ちる）。
    "sqlalchemy[asyncio]>=2.0.52",
    "alembic>=1.19.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.27",
    "mangum>=0.22",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "scalar-fastapi>=1.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.16.3",
    "pyyaml>=6.0",
    # ランタイムには含めない（Lambda の python3.12 管理ランタイムに同梱されているため zip に
    # 含める必要がない）。ユニットテスト・型解決のためだけに dev 依存として追加する
    # （docs/adr/ADR-005-backend-serverless-deployment-lambda-function-url.md 決定5）。
    "boto3>=1.34",
    # OpenTelemetry（ADR-013 / SS-178）。boto3 と同じ扱いで、Lambda では ADOT レイヤー
    # （template.yaml の `Layers`）が提供するため zip に含めない。zip に入れると Lambda の
    # sys.path で /var/task が /opt/python より前に来て、レイヤーの SDK と版が混ざる
    # （`uv export --no-dev` が除くので requirements-lambda.txt にも入らない。Makefile の
    # build-Api に混入ガードあり）。ここに置く目的は、ローカル（compose）での送信・テスト・
    # 型解決だけ。版はレイヤー v28 が同梱するもの（aws-opentelemetry-distro 0.21.0 の固定版）に
    # `==` で合わせる。レイヤーを上げるときは一緒に上げる（dependabot は ignore 済み）。
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-distro==0.65b0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-instrumentation==0.65b0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-sqlalchemy==0.65b0",
    "opentelemetry-instrumentation-httpx==0.65b0",
    "opentelemetry-instrumentation-botocore==0.65b0",
    "opentelemetry-instrumentation-urllib==0.65b0",
    "opentelemetry-instrumentation-threading==0.65b0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanposcape"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"
# Alembic の自動生成マイグレーションは lint 対象外にする
# `.aws-sam` は `sam build` の成果物（依存パッケージ一式が展開される）。
# コンテナ内で ruff を実行すると .git が無く .gitignore 連動の除外が効かないため、
# ここで明示的に除外する（`sam build` 後に lint すると数万件のエラーになる）。
extend-exclude = ["alembic/versions", ".aws-sam"]

[tool.ruff.lint]
# C901・PLR0912・PLR0913・PLR0915: 関数の複雑度・分岐・引数・文の数（SS-253。閾値は下の mccabe・pylint）
select = ["E", "F", "I", "UP", "B", "SIM", "C901", "PLR0912", "PLR0913", "PLR0915"]
# B008: FastAPI の Depends() を引数デフォルトに置くのは公式の慣習のため許可
ignore = ["B008"]

# 関数の複雑度・長さの閾値（SS-253）。緩い値から始め、既存の違反を片付けてから段階的に下げる
# （ADR-017。ADR-016 決定6・7 と同じ進め方）。ruff の既定は max-complexity 10・max-branches 12・
# max-statements 50・max-args 5 で、下げるときの目安にする。
[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-branches = 15
max-statements = 60
max-args = 8

# 既存の違反の据え置き（baseline。ADR-017）。各行に片付ける課題と、今は分けない理由を書く。
# ファイルを足して通すときは、課題と理由を書いたうえでレビューで妥当かを見る。
# 片付けたら行を消す（消し忘れても ruff は教えないので、片付けた PR で必ず消す）。
[tool.ruff.lint.per-file-ignores]
# SS-258: 例外の種類ごとのハンドラを1関数で登録している（28）。種類ごとの登録関数に分ける
"src/sanposcape/main.py" = ["C901"]
# SS-258: 周回ルートの生成が候補の選定・再試行・距離の判定を1関数で持つ（複雑度 17・分岐 16）。
# __init__ は設定値を個別に受け取る（9）
"src/sanposcape/maps/service.py" = ["C901", "PLR0912", "PLR0913"]
# SS-258: update_pin が項目ごとの更新と写真の確定を1関数で持つ（複雑度 19・分岐 18・文 64）。
# ADR-011 の持ち越し（写真確定処理の切り出し）と一緒に分ける。__init__ は依存を個別に受け取る（12）
"src/sanposcape/sanpo_maps/pins/service.py" = ["C901", "PLR0912", "PLR0913", "PLR0915"]
# SS-258: 以下はキーワード専用引数で、呼び出し側での取り違えは起きにくい（9〜11）。
# 引数をまとめる型に寄せるかを SS-258 で判断する
"src/sanposcape/sanpo_maps/photos/service.py" = ["PLR0913"]
"src/sanposcape/sanpo_maps/pins/mappers.py" = ["PLR0913"]
"src/sanposcape/sanpo_maps/pins/repository.py" = ["PLR0913"]
"src/sanposcape/walks/repository.py" = ["PLR0913"]
# SS-258: テストの部品。ID トークンの各クレームを上書きできるようにキーワード専用で並べている（9・12）
"src/sanposcape/auth/tests/conftest.py" = ["PLR0913"]
"src/sanposcape/core/tests/test_access_log.py" = ["PLR0913"]
# SS-258: 並行実行の手順（スレッドの起動・待ち合わせ・検証）を1つのテストに順に書いている（65）
"src/sanposcape/sanpo_maps/maps/tests/test_delete_map_concurrency.py" = ["PLR0915"]
# SS-258: 1つのテストで写真の確定の前後を順に検証している（65）
"src/sanposcape/sanpo_maps/pins/tests/test_service.py" = ["PLR0915"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
# walkshare_migration は一回限りの移行のスクリプト（README）。スクリプトと一緒に SS-242 で外す。
testpaths = ["src", "scripts/walkshare_migration"]
python_files = ["test_*.py"]
pythonpath = ["src"]
