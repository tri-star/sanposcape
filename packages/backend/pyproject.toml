[project]
name = "sanposcape-backend"
version = "0.1.0"
description = "sanposcape backend API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.27",
    "mangum>=0.22",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.16.3",
    "pyyaml>=6.0",
    # ランタイムには含めない（Lambda の python3.12 管理ランタイムに同梱されているため zip に
    # 含める必要がない）。ユニットテスト・型解決のためだけに dev 依存として追加する
    # （docs/adr/ADR-005-backend-serverless-deployment-lambda-function-url.md 決定5）。
    "boto3>=1.34",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanposcape"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"
# Alembic の自動生成マイグレーションは lint 対象外にする
# `.aws-sam` は `sam build` の成果物（依存パッケージ一式が展開される）。
# コンテナ内で ruff を実行すると .git が無く .gitignore 連動の除外が効かないため、
# ここで明示的に除外する（`sam build` 後に lint すると数万件のエラーになる）。
extend-exclude = ["alembic/versions", ".aws-sam"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI の Depends() を引数デフォルトに置くのは公式の慣習のため許可
ignore = ["B008"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["src"]
python_files = ["test_*.py"]
pythonpath = ["src"]
