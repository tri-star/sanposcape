name: ${COMPOSE_PROJECT_NAME:-sanposcape}

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    user: app_user
    ports:
      - "${BACKEND_API_PORT:-8000}:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-app}
      TEST_DB_NAME: ${TEST_DB_NAME:-app_test}
      ENV: ${ENV:-local}
      AUTH_MODE: ${AUTH_MODE:-real}
      MAPS_MODE: ${MAPS_MODE:-real}
      FEATURE_FLAG_MODE: ${FEATURE_FLAG_MODE:-real}
      FEATURE_FLAG_STUB_DOCUMENT: ${FEATURE_FLAG_STUB_DOCUMENT:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STORAGE_MODE: ${STORAGE_MODE:-real}
      DEV_STORAGE_DIR: ${DEV_STORAGE_DIR:-storages/dev-storage}
      # STORAGE_MODE=real でローカルから実 S3 に繋いで確認するときだけ使う
      # （PIN_PHOTO_BUCKET_NAME が空なら UnconfiguredObjectStorage = 写真 API は 503）。
      # 認証情報は .env に書かず、`aws configure export-credentials` で取得した一時認証情報を
      # シェルから渡すこと（AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN は
      # 「ホストの環境変数があれば透過させる」だけで既定値を持たない。AWS_REGION のみ既定値あり）。
      # 手順は docs/local-development.md「実 S3 に繋いで確認する」。
      PIN_PHOTO_BUCKET_NAME: ${PIN_PHOTO_BUCKET_NAME:-}
      PIN_PHOTO_BUCKET_REGION: ${PIN_PHOTO_BUCKET_REGION:-ap-southeast-1}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      PIN_PHOTO_MAX_BYTES: ${PIN_PHOTO_MAX_BYTES:-10485760}
      PIN_PHOTO_USER_QUOTA_BYTES: ${PIN_PHOTO_USER_QUOTA_BYTES:-1073741824}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_REFRESH_TOKEN_TTL_DAYS: ${AUTH_REFRESH_TOKEN_TTL_DAYS:-30}
      GOOGLE_ALLOWED_AUDIENCES: ${GOOGLE_ALLOWED_AUDIENCES:-}
      GOOGLE_MAPS_SERVER_API_KEY: ${GOOGLE_MAPS_SERVER_API_KEY:-}
      GOOGLE_MAPS_CACHE_TTL_SECONDS: ${GOOGLE_MAPS_CACHE_TTL_SECONDS:-300}
      GOOGLE_MAPS_CACHE_MAX_ENTRIES: ${GOOGLE_MAPS_CACHE_MAX_ENTRIES:-256}
      GOOGLE_MAPS_SEARCH_DEADLINE_SECONDS: ${GOOGLE_MAPS_SEARCH_DEADLINE_SECONDS:-10}
      GOOGLE_MAPS_RATE_LIMIT_REQUESTS: ${GOOGLE_MAPS_RATE_LIMIT_REQUESTS:-30}
      GOOGLE_MAPS_ANONYMOUS_RATE_LIMIT_REQUESTS: ${GOOGLE_MAPS_ANONYMOUS_RATE_LIMIT_REQUESTS:-10}
      GOOGLE_MAPS_RATE_LIMIT_WINDOW_SECONDS: ${GOOGLE_MAPS_RATE_LIMIT_WINDOW_SECONDS:-60}
      GOOGLE_MAPS_EXPLORE_REQUEST_MAX_BYTES: ${GOOGLE_MAPS_EXPLORE_REQUEST_MAX_BYTES:-32768}
      GOOGLE_MAPS_LOOP_ROUTE_ENABLED: ${GOOGLE_MAPS_LOOP_ROUTE_ENABLED:-true}
    volumes:
      - ./:/app
      # コンテナ内で構築した .venv をホストのコピーで潰さないよう分離
      - venv-app-user:/app/.venv
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health'); sys.exit(0)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  db:
    image: postgres:17-alpine
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-app}
      # テスト用DBを初期化時に追加作成する
      TEST_DB_NAME: ${TEST_DB_NAME:-app_test}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
  venv-app-user:
