        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pin Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinPhotosAdd'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinPhotoListRead'
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '403':
          description: Permission denied
        '404':
          description: Pin not found
        '409':
          description: Photo upload not ready, or storage quota exceeded (see body
            `code` to distinguish them)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinConflictErrorRead'
        '422':
          description: Validation error
        '503':
          description: Photo storage unavailable
    get:
      tags:
      - pins
      summary: List Pin Photos
      description: 'ピンの写真全件を position 昇順の keyset ページングで返す（ADR-009 決定17）。


        member でないピン・存在しない ID は 404。写真の URL の有効期限は `urls_expire_at`。

        mobile の画像キャッシュのキーには URL ではなく `id` を使う（ADR-M-010 決定8）。'
      operationId: list_pin_photos
      security:
      - HTTPBearer: []
      parameters:
      - name: pin_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pin Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 30
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinPhotoPageRead'
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '400':
          description: Invalid cursor
        '404':
          description: Pin not found
        '422':
          description: Validation error
  /pins/{pin_id}:
    get:
      tags:
      - pins
      summary: Get Pin
      description: 'ピンの詳細を返す（SS-111）。member でないピン・存在しない ID は 404。


        `photos` は position 順の先頭10件、`photo_count` は総数。全件は

        `GET /pins/{pin_id}/photos` で取得する。写真の URL の有効期限は `urls_expire_at`。'
      operationId: get_pin
      security:
      - HTTPBearer: []
      parameters:
      - name: pin_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pin Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinRead'
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '404':
          description: Pin not found
        '422':
          description: Validation error
    patch:
      tags:
      - pins
      summary: Update Pin
      description: 'ピンの名前・メモ・訪問状況・アーカイブ状態の更新、地図の移動、タグの追加・削除

        （`add_tags`/`remove_tag_ids`）を1リクエストで原子的に行う（ADR-009 決定19・20・32・33）。


        省略したフィールドは変更しない。`name`/`memo` は `null` か空白のみの値で消せる。

        タグは全置換ではなく差分で送る（既にあるタグの再追加、このピンに無い ID の削除は

        何もせず成功扱い）。権限は「送られたフィールド」ごとに判定し、1つでも権限が無ければ

        何も反映せず 403 にする。地図 owner・対象の作成者本人（editor）は可能、作成者でない

        editor は名前・メモの更新はできない（タグの削除も自分が付けたものだけ）。

        `visited` はメンバーなら誰でも、`archived` は地図 owner かピンの作成者本人だけ変更できる

        （作成者でない editor は 403）。

        `sanpo_map_id` を送るとピンを別の地図へ移す。移動元の地図 owner かピンの作成者本人だけが

        移せ（作成者でない editor は 403）、移動先はメンバーなら owner/editor のどちらでもよい。

        移動先が存在しない・メンバーでない場合は 404（`code: "sanpo_map_not_found"`）。

        タグ・写真・訪問状況・アーカイブ状態・作成者はそのまま移る。値が今と同じでも権限は判定する。

        非メンバー・存在しないピンは 404（`code: "pin_not_found"`）。

        タグが10件を超えると 409（`code: "tag_limit_exceeded"`）。'
      operationId: update_pin
      security:
      - HTTPBearer: []
      parameters:
      - name: pin_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pin Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinRead'
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '403':
          description: Permission denied (including moving the pin out of / into a
            sanpo map)
        '404':
          description: 'Pin not found (code: pin_not_found), or the destination sanpo
            map does not exist or the user is not a member (code: sanpo_map_not_found)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinUpdateNotFoundErrorRead'
        '409':
          description: Applying add_tags/remove_tag_ids would exceed the per-pin tag
            limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinTagConflictErrorRead'
        '422':
          description: Validation error
    delete:
      tags:
      - pins
      summary: Delete Pin
      description: 'ピンを削除する（ADR-009 決定19）。


        写真・タグは DB の `ON DELETE CASCADE` で消え、S3 の実体（原本・サムネイル）は

        best-effort で削除する（ストレージ障害・未構成でも 204 のまま。決定22）。地図 owner・

        対象の作成者本人（editor）のみ可能（作成者ではない editor は 403）。非メンバー・

        存在しない ID は 404。削除済み ID への再送も 404（冪等にはしない。`DELETE /walks/{id}`

        と同じ）。'
      operationId: delete_pin
      security:
      - HTTPBearer: []
      parameters:
      - name: pin_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pin Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '403':
          description: Permission denied
        '404':
          description: Pin not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /pins/{pin_id}/photos/{photo_id}:
    delete:
      tags:
      - pins
      summary: Delete Pin Photo
      description: '写真1枚を削除する（ADR-009 決定19）。原本・サムネイルの S3 実体も best-effort で

        削除する（ストレージ障害・未構成でも 204 のまま）。


        持ち主はアップロード者本人（ピンの作成者ではない）。地図 owner は他人がアップロード

        した写真も削除できるが、ピン作成者の editor でも他人の写真は削除できない（403）。

        このピンに属さない・存在しない `photo_id`、非メンバー・存在しない `pin_id` はどちらも

        404（区別しない）。削除済みへの再送も 404。'
      operationId: delete_pin_photo
      security:
      - HTTPBearer: []
      parameters:
      - name: pin_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pin Id
      - name: photo_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Photo Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '403':
          description: Permission denied
        '404':
          description: Pin or pin photo not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /pin-photo-uploads:
    post:
      tags:
      - pins
      summary: Create Pin Photo Upload
      description: '写真のアップロード枠（presigned POST）を発行する。


        応答の `upload.fields` を multipart フォームで `upload.url` へ POST する

        （フィールドの意味はクライアントが解釈しない）。上限は応答の `max_byte_size` が正。'
      operationId: create_pin_photo_upload
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinPhotoUploadCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinPhotoUploadRead'
        '401':
          description: Not authenticated
        '409':
          description: 'Storage quota exceeded (body code: "storage_quota_exceeded")'
        '413':
          description: Request body too large, or photo exceeds the size limit
        '422':
          description: Validation error
        '429':
          description: Too many pending uploads
        '503':
          description: Photo storage unavailable
      security:
      - HTTPBearer: []
  /pin-photo-uploads/{upload_id}:
    delete:
      tags:
      - pins
      summary: Delete Pin Photo Upload
      description: '未使用（`pending`）のアップロード枠を取り消す（PR #93 T11）。


        写真を先行アップロードした後、ピンに紐付ける前に削除した場合に呼ぶ。本人の枠のみが

        対象（他人・存在しない `upload_id` は 404, IDOR 対策）。既に写真として紐付け済み

        （`attached`）の枠は 409（取り消しは未紐付けの枠専用）。呼ばなければ枠は紐付け期限

        まで容量予約・未使用枠カウントを占有し続ける。'
      operationId: delete_pin_photo_upload
      security:
      - HTTPBearer: []
      parameters:
      - name: upload_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Upload Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Not authenticated
        '404':
          description: Pin photo upload not found
        '409':
          description: Pin photo upload already attached
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
