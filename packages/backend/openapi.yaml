  /pins:
    post:
      tags:
      - pins
      summary: Create Pin
      description: 'ピンの記録を保存する。


        `client_pin_id` の再送は同じピンとして扱い、新規作成のみ 201、冪等な再送は 200 を

        返す（内容が違っても既存をそのまま返す。`walks` と同じ）。`sanpo_map_id` を省略すると

        自分の既定地図（無ければ「最初の地図」を同一トランザクションで作成）に登録される。

        `visited`（訪問済みか）は省略すると false。`archived` は作成時には指定できない。'
      operationId: create_pin
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinRead'
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '200':
          description: 'Idempotent replay: an existing pin with the same client_pin_id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinRead'
        '403':
          description: Permission denied
        '404':
          description: Sanpo map not found
        '409':
          description: Photo upload not ready, or storage quota exceeded (see body
            `code` to distinguish them)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinConflictErrorRead'
        '422':
          description: Validation error
        '503':
          description: Photo storage unavailable
    get:
      tags:
      - pins
      summary: List Pins
      description: '指定した地図のピン一覧を `created_at DESC` の keyset ページングで返す（SS-111）。


        member でない地図・存在しない `sanpo_map_id` は 404。bbox（`min_latitude`/

        `min_longitude`/`max_latitude`/`max_longitude`）は4つそろえて指定するか、

        1つも指定しないかのどちらか。`q`（名前・メモ・タグの部分一致）と `tags`

        （複数指定は AND）は SS-120（検索タブ）向け。各要素の `cover_photo` は

        position が最小の写真（無ければ null）。写真の URL の有効期限は `urls_expire_at`。

        mobile の画像キャッシュのキーには URL ではなく `id` を使う（ADR-M-010 決定8）。

        `archived`/`visited` は省略すると絞り込まない。指定すると true/false で絞り込み、

        bbox・`q`・`tags` と AND で `limit` の前に適用する（`archived=false` は地図表示用,

        SS-173）。'
      operationId: list_pins
      security:
      - HTTPBearer: []
      parameters:
      - name: sanpo_map_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Sanpo Map Id
      - name: min_latitude
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 90
            minimum: -90
          - type: 'null'
          title: Min Latitude
      - name: min_longitude
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 180
            minimum: -180
          - type: 'null'
          title: Min Longitude
      - name: max_latitude
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 90
            minimum: -90
          - type: 'null'
          title: Max Latitude
      - name: max_longitude
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 180
            minimum: -180
          - type: 'null'
          title: Max Longitude
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Q
      - name: tags
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          maxItems: 10
          title: Tags
      - name: archived
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Archived
      - name: visited
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Visited
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinListRead'
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '400':
          description: Invalid cursor
        '404':
          description: Sanpo map not found
        '422':
          description: Validation error
  /pins/{pin_id}/photos:
    post:
      tags:
      - pins
      summary: Add Pin Photos
      description: 'ピンに写真を追加する（1リクエストあたり1〜10枚。ピン全体の枚数は無制限, B-Y2）。


        既にこのピンに紐付いている `upload_id` の再送は成功扱い。別のピンに紐付け済みの

        `upload_id`・存在しない/他人の/期限切れの枠・デコード不可な画像は 409

        （`code: "photo_upload_not_ready"`）。確定時の実サイズで容量上限を超える場合も 409

        （`code: "storage_quota_exceeded"`）。他人のピン・存在しないピンは 404。'
      operationId: add_pin_photos
      security:
      - HTTPBearer: []
      parameters:
