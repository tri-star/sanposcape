openapi: 3.1.0
info:
  title: sanposcape API
  description: 散歩支援アプリ sanposcape のバックエンド API
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Health Check
      description: ロードバランサ・compose healthcheck 用の疎通確認エンドポイント。
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /app-config:
    get:
      tags:
      - app-config
      summary: Get App Config
      description: 'mobile / LP が読む公開エンドポイント。認証不要（`/health` と同じ扱い）。


        DB を触らない軽量経路にしている（DB 障害時にもフラグを配れるようにするため。

        ADR-008 が選択肢4 を却下した理由と同じ発想）。取得層（`integrations/aws/appconfig.py`）が

        ブロッキング I/O（boto3）を行うため、この関数は `async def` にしない

        （sync def なら FastAPI がスレッドプールで実行し、イベントループを止めない）。'
      operationId: get_app_config
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfigRead'
  /auth/session:
    post:
      tags:
      - auth
      summary: Create Session
      operationId: create_session_auth_session_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh Session
      operationId: refresh_session_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      operationId: logout_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionLogoutRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/me:
    get:
      tags:
      - auth
      summary: Get Me
      operationId: get_me_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserRead'
      security:
      - HTTPBearer: []
  /users/me:
    delete:
      tags:
      - users
      summary: Delete Me
      description: Bearer token で解決した本人のアカウントを削除する。
      operationId: delete_me_users_me_delete
      responses:
        '204':
          description: Successful Response
      security:
      - HTTPBearer: []
  /explore/places:
    post:
      tags:
      - explore
      summary: Search Places
      operationId: search_explore_places
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceSearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceSearchResponse'
        '401':
          description: Not authenticated
        '413':
          description: Explore request body too large
        '429':
          description: Map provider quota exceeded or explore rate limit reached
        '503':
          description: Map provider unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /explore/routes/walking:
    post:
      tags:
      - explore
      summary: Get Walking Route
      description: 'SS-33: `/explore/routes/loop` に置き換え。配布済みビルドの互換のため維持する

        （意味・スキーマは変えない。片道の duration_seconds/distance_meters のまま）。'
      operationId: get_walking_route_explore_routes_walking
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalkingRouteRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkingRouteResponse'
        '401':
          description: Not authenticated
        '413':
          description: Explore request body too large
        '429':
          description: Map provider quota exceeded or explore rate limit reached
        '503':
          description: Map provider unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      deprecated: true
  /explore/routes/loop:
    post:
      tags:
      - explore
      summary: Get Loop Walking Route
      description: 'SS-33: 現在地 → 目的地 → (往路と異なる道) → 現在地 の周回ルート。


        周回を作れない場合も 200 + `return_is_same_path=true`（同じ道で戻る）で返す

        （エラーにしない）。'
      operationId: get_loop_walking_route_explore_routes_loop
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalkingRouteRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoopWalkingRouteResponse'
        '401':
          description: Not authenticated
        '413':
          description: Explore request body too large
        '429':
          description: Map provider quota exceeded or explore rate limit reached
        '503':
          description: Map provider unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /walks:
    post:
      tags:
      - walks
      summary: Create Walk
      description: '散歩の記録を保存する。


        `client_walk_id` の再送は同じ散歩として扱い、新規作成のみ 201、

        冪等な再送は 200 を返す（軌跡はエコーバックしない: モバイルは送信済みの値を持つ）。'
      operationId: create_walk_walks_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalkCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkRead'
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '200':
          description: 'Idempotent replay: an existing walk with the same client_walk_id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkRead'
        '422':
          description: Validation error
    get:
      tags:
      - walks
      summary: List Walks
      description: 散歩履歴の一覧を `started_at DESC` の keyset ページネーションで返す。
      operationId: list_walks_walks_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: started_after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started After
      - name: started_before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started Before
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkListRead'
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '400':
          description: Invalid cursor
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /walks/stats:
    get:
      tags:
      - walks
      summary: Get Walk Stats
      description: '記録タブ向けの集計（今日 / 直近7日 / 直近28日 / 連続日数）を JST 基準で返す。


        クエリパラメータは持たず、散歩 0 件でも 200 + 全ゼロを返す（404 にしない）。'
      operationId: get_walk_stats_walks_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkStatsRead'
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
      security:
      - HTTPBearer: []
  /walks/{walk_id}:
    get:
      tags:
      - walks
      summary: Get Walk
      description: 散歩1件の詳細（軌跡付き）を返す。他ユーザーの散歩・存在しない ID は 404（D6）。
      operationId: get_walk_walks__walk_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: walk_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Walk Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkDetailRead'
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '404':
          description: Walk not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - walks
      summary: Delete Walk
      description: '散歩1件を削除する。他ユーザーの散歩・存在しない ID は 404（D6）。


        削除済み ID への再送も 404（冪等にはしない）。クライアントは 404 を

        「既に存在しない」として成功同様に扱ってよい。'
      operationId: delete_walk_walks__walk_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: walk_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Walk Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '404':
          description: Walk not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sanpo-maps:
    get:
      tags:
      - sanpo-maps
      summary: List Sanpo Maps
      description: 自分が member である地図を全件返す（クエリなし。MVP は件数が少ない前提）。
      operationId: list_sanpo_maps
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanpoMapListRead'
        '401':
          description: Not authenticated
      security:
      - HTTPBearer: []
  /pins:
    post:
      tags:
      - pins
      summary: Create Pin
      description: 'ピンの記録を保存する。


        `client_pin_id` の再送は同じピンとして扱い、新規作成のみ 201、冪等な再送は 200 を

        返す（内容が違っても既存をそのまま返す。`walks` と同じ）。`sanpo_map_id` を省略すると

        自分の既定地図（無ければ「最初の地図」を同一トランザクションで作成）に登録される。'
      operationId: create_pin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinRead'
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '200':
          description: 'Idempotent replay: an existing pin with the same client_pin_id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinRead'
        '403':
          description: Permission denied
        '404':
          description: Sanpo map not found
        '409':
          description: Photo upload not ready, or storage quota exceeded
        '422':
          description: Validation error
        '503':
          description: Photo storage unavailable
      security:
      - HTTPBearer: []
  /pins/{pin_id}/photos:
    post:
      tags:
      - pins
      summary: Add Pin Photos
      description: 'ピンに写真を追加する（1リクエストあたり1〜10枚。ピン全体の枚数は無制限, B-Y2）。


        既にこのピンに紐付いている `upload_id` の再送は成功扱い。別のピンに紐付け済みの

        `upload_id` は 409。他人のピン・存在しないピンは 404。'
      operationId: add_pin_photos
      security:
      - HTTPBearer: []
      parameters:
      - name: pin_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pin Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinPhotosAdd'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinPhotoListRead'
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '403':
          description: Permission denied
        '404':
          description: Pin not found
        '409':
          description: Photo upload not ready
        '422':
          description: Validation error
        '503':
          description: Photo storage unavailable
  /pin-photo-uploads:
    post:
      tags:
      - pins
      summary: Create Pin Photo Upload
      description: '写真のアップロード枠（presigned POST）を発行する。


        応答の `upload.fields` を multipart フォームで `upload.url` へ POST する

        （フィールドの意味はクライアントが解釈しない）。上限は応答の `max_byte_size` が正。'
      operationId: create_pin_photo_upload
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinPhotoUploadCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinPhotoUploadRead'
        '401':
          description: Not authenticated
        '409':
          description: Storage quota exceeded
        '413':
          description: Request body too large, or photo exceeds the size limit
        '422':
          description: Validation error
        '429':
          description: Too many pending uploads
        '503':
          description: Photo storage unavailable
      security:
      - HTTPBearer: []
components:
  schemas:
    AppConfigRead:
      properties:
        flags:
          additionalProperties:
            type: boolean
          type: object
          title: Flags
        minimum_supported_versions:
          $ref: '#/components/schemas/MinimumSupportedVersionsRead'
        config_source:
          type: string
          enum:
          - appconfig
          - default
          - stub
          title: Config Source
      type: object
      required:
      - flags
      - minimum_supported_versions
      - config_source
      title: AppConfigRead
      description: '`GET /app-config` のレスポンス。'
    AuthUserRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        photo_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Photo Url
      type: object
      required:
      - id
      - email
      - display_name
      - photo_url
      title: AuthUserRead
    ExploreCategory:
      type: string
      enum:
      - convenience_store
      - supermarket
      - retail
      - facility
      - park
      - station
      title: ExploreCategory
    GeoPoint:
      properties:
        latitude:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Latitude
        longitude:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Longitude
      type: object
      required:
      - latitude
      - longitude
      title: GeoPoint
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthStatus:
      properties:
        status:
          type: string
          title: Status
      type: object
      required:
      - status
      title: HealthStatus
    LoopWalkingRouteResponse:
      properties:
        origin:
          $ref: '#/components/schemas/GeoPoint'
        destination:
          $ref: '#/components/schemas/RouteDestinationRead'
        duration_seconds:
          type: integer
          minimum: 0.0
          title: Duration Seconds
          description: Sum of both legs' duration_seconds (the whole loop, not one-way).
        distance_meters:
          type: integer
          minimum: 0.0
          title: Distance Meters
          description: Sum of both legs' distance_meters (the whole loop, not one-way).
        legs:
          items:
            $ref: '#/components/schemas/WalkingRouteLeg'
          type: array
          maxItems: 2
          minItems: 2
          title: Legs
          description: Always exactly 2 legs, ordered [outbound, return]. When return_is_same_path
            is true, the return leg's path is the outbound leg's path reversed, and
            its duration/distance equal the outbound leg's.
        return_is_same_path:
          type: boolean
          title: Return Is Same Path
          description: True when no distinct return route could be produced (e.g.
            origin and destination are too close, or every candidate route failed
            validation) and the server falls back to retracing the outbound route.
        bounds:
          $ref: '#/components/schemas/MapBounds'
          description: Covers both legs' paths as well as origin and destination.
      type: object
      required:
      - origin
      - destination
      - duration_seconds
      - distance_meters
      - legs
      - return_is_same_path
      - bounds
      title: LoopWalkingRouteResponse
      description: 'SS-33: 現在地 → 目的地 → (往路と異なる、または同じ) 道 → 現在地 の周回ルート。'
    MapBounds:
      properties:
        north_east:
          $ref: '#/components/schemas/GeoPoint'
        south_west:
          $ref: '#/components/schemas/GeoPoint'
      type: object
      required:
      - north_east
      - south_west
      title: MapBounds
    MinimumSupportedVersionsRead:
      properties:
        ios:
          anyOf:
          - type: string
          - type: 'null'
          title: Ios
        android:
          anyOf:
          - type: string
          - type: 'null'
          title: Android
      type: object
      title: MinimumSupportedVersionsRead
      description: '`X.Y.Z` 形式のバージョン文字列、または `null`。


        `null` は「最低バージョンの指定なし = 強制アップデートしない」を意味する

        （AppConfig を読めない場合の安全側フォールバックも同じ値になる。ADR-008 追補 D1）。'
    PinCreate:
      properties:
        client_pin_id:
          type: string
          format: uuid
          title: Client Pin Id
        sanpo_map_id:
          type: string
          format: uuid
          title: Sanpo Map Id
        name:
          anyOf:
          - type: string
            maxLength: 50
          - type: 'null'
          title: Name
        memo:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Memo
        location:
          $ref: '#/components/schemas/GeoPoint'
        tags:
          items:
            type: string
            maxLength: 200
            minLength: 1
          type: array
          maxItems: 10
          title: Tags
        photo_upload_ids:
          items:
            type: string
            format: uuid
          type: array
          maxItems: 10
          title: Photo Upload Ids
        client_walk_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Client Walk Id
      type: object
      required:
      - client_pin_id
      - location
      title: PinCreate
    PinPhotoListRead:
      properties:
        items:
          items:
            $ref: '#/components/schemas/PinPhotoRead'
          type: array
          title: Items
        photo_count:
          type: integer
          title: Photo Count
      type: object
      required:
      - items
      - photo_count
      title: PinPhotoListRead
    PinPhotoRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        upload_id:
          type: string
          format: uuid
          title: Upload Id
        position:
          type: integer
          title: Position
        width:
          type: integer
          title: Width
        height:
          type: integer
          title: Height
        byte_size:
          type: integer
          title: Byte Size
        content_type:
          type: string
          title: Content Type
        thumbnail:
          anyOf:
          - $ref: '#/components/schemas/PinPhotoThumbnailRead'
          - type: 'null'
        urls_expire_at:
          type: string
          format: date-time
          title: Urls Expire At
        uploaded_by_user_id:
          type: string
          format: uuid
          title: Uploaded By User Id
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - upload_id
      - position
      - width
      - height
      - byte_size
      - content_type
      - thumbnail
      - urls_expire_at
      - uploaded_by_user_id
      - created_at
      title: PinPhotoRead
    PinPhotoThumbnailRead:
      properties:
        url:
          type: string
          title: Url
        width:
          type: integer
          title: Width
        height:
          type: integer
          title: Height
      type: object
      required:
      - url
      - width
      - height
      title: PinPhotoThumbnailRead
    PinPhotoUploadCreate:
      properties:
        content_type:
          type: string
          const: image/jpeg
          title: Content Type
        byte_size:
          type: integer
          minimum: 1.0
          title: Byte Size
      type: object
      required:
      - content_type
      - byte_size
      title: PinPhotoUploadCreate
      description: '`POST /pin-photo-uploads` のリクエスト。


        `width`/`height` は受け取らない（サーバーが確定時にデコードして実寸を得るため）。'
    PinPhotoUploadRead:
      properties:
        upload_id:
          type: string
          format: uuid
          title: Upload Id
        upload:
          $ref: '#/components/schemas/PresignedUploadRead'
        expires_at:
          type: string
          format: date-time
          title: Expires At
        max_byte_size:
          type: integer
          title: Max Byte Size
      type: object
      required:
      - upload_id
      - upload
      - expires_at
      - max_byte_size
      title: PinPhotoUploadRead
    PinPhotosAdd:
      properties:
        photo_upload_ids:
          items:
            type: string
            format: uuid
          type: array
