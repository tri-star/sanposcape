openapi: 3.1.0
info:
  title: sanposcape API
  description: 散歩支援アプリ sanposcape のバックエンド API
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Health Check
      description: ロードバランサ・compose healthcheck 用の疎通確認エンドポイント。
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /spots:
    get:
      tags:
      - spots
      summary: List Spots
      operationId: list_spots_spots_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SpotRead'
                type: array
                title: Response List Spots Spots Get
    post:
      tags:
      - spots
      summary: Create Spot
      operationId: create_spot_spots_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpotCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/session:
    post:
      tags:
      - auth
      summary: Create Session
      operationId: create_session_auth_session_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh Session
      operationId: refresh_session_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      operationId: logout_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionLogoutRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/me:
    get:
      tags:
      - auth
      summary: Get Me
      operationId: get_me_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserRead'
      security:
      - HTTPBearer: []
  /users/me:
    delete:
      tags:
      - users
      summary: Delete Me
      description: Bearer token で解決した本人のアカウントを削除する。
      operationId: delete_me_users_me_delete
      responses:
        '204':
          description: Successful Response
      security:
      - HTTPBearer: []
  /explore/places:
    post:
      tags:
      - explore
      summary: Search Places
      operationId: search_explore_places
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceSearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceSearchResponse'
        '401':
          description: Not authenticated
        '413':
          description: Explore request body too large
        '429':
          description: Map provider quota exceeded or explore rate limit reached
        '503':
          description: Map provider unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /explore/routes/walking:
    post:
      tags:
      - explore
      summary: Get Walking Route
      operationId: get_walking_route_explore_routes_walking
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalkingRouteRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkingRouteResponse'
        '401':
          description: Not authenticated
        '413':
          description: Explore request body too large
        '429':
          description: Map provider quota exceeded or explore rate limit reached
        '503':
          description: Map provider unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /walks:
    post:
      tags:
      - walks
      summary: Create Walk
      description: '散歩の記録を保存する。


        `client_walk_id` の再送は同じ散歩として扱い、新規作成のみ 201、

        冪等な再送は 200 を返す（軌跡はエコーバックしない: モバイルは送信済みの値を持つ）。'
      operationId: create_walk_walks_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalkCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkRead'
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '200':
          description: 'Idempotent replay: an existing walk with the same client_walk_id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkRead'
        '422':
          description: Validation error
    get:
      tags:
      - walks
      summary: List Walks
      description: 散歩履歴の一覧を `started_at DESC` の keyset ページネーションで返す。
      operationId: list_walks_walks_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: started_after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started After
      - name: started_before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started Before
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkListRead'
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '400':
          description: Invalid cursor
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /walks/stats:
    get:
      tags:
      - walks
      summary: Get Walk Stats
      description: '記録タブ向けの集計（今日 / 直近7日 / 直近28日 / 連続日数）を JST 基準で返す。


        クエリパラメータは持たず、散歩 0 件でも 200 + 全ゼロを返す（404 にしない）。'
      operationId: get_walk_stats_walks_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkStatsRead'
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
      security:
      - HTTPBearer: []
  /walks/{walk_id}:
    get:
      tags:
      - walks
      summary: Get Walk
      description: 散歩1件の詳細（軌跡付き）を返す。他ユーザーの散歩・存在しない ID は 404（D6）。
      operationId: get_walk_walks__walk_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: walk_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Walk Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkDetailRead'
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '404':
          description: Walk not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - walks
      summary: Delete Walk
      description: '散歩1件を削除する。他ユーザーの散歩・存在しない ID は 404（D6）。


        削除済み ID への再送も 404（冪等にはしない）。クライアントは 404 を

        「既に存在しない」として成功同様に扱ってよい。'
      operationId: delete_walk_walks__walk_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: walk_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Walk Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '404':
          description: Walk not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AuthUserRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        photo_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Photo Url
      type: object
      required:
      - id
      - email
      - display_name
      - photo_url
      title: AuthUserRead
    ExploreCategory:
      type: string
      enum:
      - convenience_store
      - supermarket
      - retail
      - facility
      - park
      - station
      title: ExploreCategory
    GeoPoint:
      properties:
        latitude:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Latitude
        longitude:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Longitude
      type: object
      required:
      - latitude
      - longitude
      title: GeoPoint
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthStatus:
      properties:
        status:
          type: string
          title: Status
      type: object
      required:
      - status
      title: HealthStatus
    MapBounds:
      properties:
        north_east:
          $ref: '#/components/schemas/GeoPoint'
        south_west:
          $ref: '#/components/schemas/GeoPoint'
      type: object
      required:
      - north_east
      - south_west
      title: MapBounds
    PlaceCandidate:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          minLength: 1
          title: Name
          description: Japanese-preferred display name supplied by the provider; falls
            back to another provider-available language when Japanese is unavailable.
        category:
          $ref: '#/components/schemas/ExploreCategory'
        location:
          $ref: '#/components/schemas/GeoPoint'
        round_trip_duration_seconds:
          type: integer
          minimum: 0.0
          title: Round Trip Duration Seconds
        round_trip_distance_meters:
          type: integer
          minimum: 0.0
          title: Round Trip Distance Meters
      type: object
      required:
      - id
      - name
      - category
      - location
      - round_trip_duration_seconds
      - round_trip_distance_meters
      title: PlaceCandidate
    PlaceSearchRequest:
      properties:
        origin:
          $ref: '#/components/schemas/GeoPoint'
        round_trip_duration_minutes:
          type: integer
          multipleOf: 5.0
          maximum: 120.0
          minimum: 10.0
          title: Round Trip Duration Minutes
        categories:
          items:
            $ref: '#/components/schemas/ExploreCategory'
          type: array
          maxItems: 6
          minItems: 1
          title: Categories
        limit:
          type: integer
          maximum: 20.0
          minimum: 1.0
          title: Limit
          default: 20
      type: object
      required:
      - origin
      - round_trip_duration_minutes
      - categories
      title: PlaceSearchRequest
    PlaceSearchResponse:
      properties:
        origin:
          $ref: '#/components/schemas/GeoPoint'
        round_trip_duration_minutes:
          type: integer
          title: Round Trip Duration Minutes
        candidates:
          items:
            $ref: '#/components/schemas/PlaceCandidate'
          type: array
          title: Candidates
      type: object
      required:
      - origin
      - round_trip_duration_minutes
      - candidates
      title: PlaceSearchResponse
    RouteDestination:
      properties:
        place_id:
          anyOf:
          - type: string
            maxLength: 256
            minLength: 1
          - type: 'null'
          title: Place Id
        location:
          $ref: '#/components/schemas/GeoPoint'
        name:
          anyOf:
          - type: string
            maxLength: 256
            minLength: 1
          - type: 'null'
          title: Name
          description: Optional display metadata copied from the selected PlaceCandidate.
            It is echoed as destination.name and is not used for authorization.
      type: object
      required:
      - location
      title: RouteDestination
    RouteDestinationRead:
      properties:
        place_id:
          anyOf:
          - type: string
            maxLength: 256
            minLength: 1
          - type: 'null'
          title: Place Id
        location:
          $ref: '#/components/schemas/GeoPoint'
        name:
          type: string
          title: Name
      type: object
      required:
      - location
      - name
      title: RouteDestinationRead
    SessionCreate:
      properties:
        provider:
          type: string
          const: google
          title: Provider
        id_token:
          type: string
          maxLength: 4096
          title: Id Token
      type: object
      required:
      - provider
      - id_token
      title: SessionCreate
    SessionLogoutRequest:
      properties:
        refresh_token:
          type: string
          maxLength: 512
          title: Refresh Token
      type: object
      required:
      - refresh_token
      title: SessionLogoutRequest
    SessionRead:
      properties:
        access_token:
          type: string
          title: Access Token
        expires_in:
          type: integer
          title: Expires In
        refresh_token:
          type: string
          title: Refresh Token
        user:
          $ref: '#/components/schemas/AuthUserRead'
      type: object
      required:
      - access_token
      - expires_in
      - refresh_token
      - user
      title: SessionRead
    SessionRefreshRequest:
      properties:
        refresh_token:
          type: string
          maxLength: 512
          title: Refresh Token
      type: object
      required:
      - refresh_token
      title: SessionRefreshRequest
    SpotCreate:
      properties:
        name:
          type: string
          title: Name
        latitude:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Latitude
        longitude:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Longitude
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      type: object
      required:
      - name
      - latitude
      - longitude
      title: SpotCreate
    SpotRead:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        latitude:
          type: number
          title: Latitude
        longitude:
          type: number
          title: Longitude
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - name
      - latitude
      - longitude
      - category
      - created_at
      title: SpotRead
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WalkCreate:
      properties:
        client_walk_id:
          type: string
          format: uuid
          title: Client Walk Id
        started_at:
          type: string
          format: date-time
          title: Started At
        ended_at:
          type: string
          format: date-time
          title: Ended At
        duration_seconds:
          type: integer
          maximum: 86400.0
          minimum: 0.0
          title: Duration Seconds
        distance_meters:
          type: integer
          maximum: 200000.0
          minimum: 0.0
          title: Distance Meters
        destination:
          $ref: '#/components/schemas/WalkDestinationCreate'
        track:
          items:
            $ref: '#/components/schemas/GeoPoint'
          type: array
          maxItems: 10000
          title: Track
      type: object
      required:
      - client_walk_id
      - started_at
      - ended_at
      - duration_seconds
      - distance_meters
      - destination
      - track
      title: WalkCreate
    WalkDestinationCreate:
      properties:
        place_id:
          type: string
          maxLength: 256
          minLength: 1
          title: Place Id
        name:
          type: string
          maxLength: 256
          minLength: 1
          title: Name
        location:
          $ref: '#/components/schemas/GeoPoint'
      type: object
      required:
      - place_id
      - name
      - location
      title: WalkDestinationCreate
    WalkDestinationRead:
      properties:
        place_id:
          type: string
          title: Place Id
        name:
          type: string
          title: Name
        location:
          $ref: '#/components/schemas/GeoPoint'
      type: object
      required:
      - place_id
      - name
      - location
      title: WalkDestinationRead
    WalkDetailRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        client_walk_id:
          type: string
          format: uuid
          title: Client Walk Id
        started_at:
          type: string
          format: date-time
          title: Started At
        ended_at:
          type: string
          format: date-time
          title: Ended At
        duration_seconds:
          type: integer
          title: Duration Seconds
        distance_meters:
          type: integer
          title: Distance Meters
        destination:
          $ref: '#/components/schemas/WalkDestinationRead'
        created_at:
          type: string
          format: date-time
          title: Created At
        track:
          items:
            $ref: '#/components/schemas/GeoPoint'
          type: array
          title: Track
      type: object
      required:
      - id
      - client_walk_id
      - started_at
      - ended_at
      - duration_seconds
      - distance_meters
      - destination
      - created_at
      - track
      title: WalkDetailRead
    WalkListRead:
      properties:
        items:
          items:
            $ref: '#/components/schemas/WalkRead'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - items
      - next_cursor
      title: WalkListRead
    WalkRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        client_walk_id:
          type: string
          format: uuid
          title: Client Walk Id
        started_at:
          type: string
          format: date-time
          title: Started At
        ended_at:
          type: string
          format: date-time
          title: Ended At
        duration_seconds:
          type: integer
          title: Duration Seconds
        distance_meters:
          type: integer
          title: Distance Meters
        destination:
          $ref: '#/components/schemas/WalkDestinationRead'
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - client_walk_id
      - started_at
      - ended_at
      - duration_seconds
      - distance_meters
      - destination
      - created_at
      title: WalkRead
    WalkStatsBucketRead:
      properties:
        start_date:
          type: string
          format: date
          title: Start Date
        end_date:
          type: string
          format: date
          title: End Date
        walk_count:
          type: integer
          title: Walk Count
        duration_seconds:
          type: integer
          title: Duration Seconds
        distance_meters:
          type: integer
          title: Distance Meters
        is_current:
          type: boolean
          title: Is Current
      type: object
      required:
      - start_date
      - end_date
      - walk_count
      - duration_seconds
      - distance_meters
      - is_current
      title: WalkStatsBucketRead
      description: 週/月チャートの1バケット（JST 暦日、両端含む）。
    WalkStatsPeriodRead:
      properties:
        start_date:
          type: string
          format: date
          title: Start Date
        end_date:
          type: string
          format: date
          title: End Date
        total_walk_count:
          type: integer
          title: Total Walk Count
        total_duration_seconds:
          type: integer
          title: Total Duration Seconds
        total_distance_meters:
          type: integer
          title: Total Distance Meters
        buckets:
          items:
            $ref: '#/components/schemas/WalkStatsBucketRead'
          type: array
          title: Buckets
      type: object
      required:
      - start_date
      - end_date
      - total_walk_count
      - total_duration_seconds
      - total_distance_meters
      - buckets
      title: WalkStatsPeriodRead
      description: 週 or 月の集計期間（ローリング）。
    WalkStatsRead:
      properties:
        timezone:
          type: string
          title: Timezone
        generated_at:
          type: string
          format: date-time
          title: Generated At
        today:
          $ref: '#/components/schemas/WalkStatsTodayRead'
        streak_days:
          type: integer
          title: Streak Days
        week:
          $ref: '#/components/schemas/WalkStatsPeriodRead'
        month:
          $ref: '#/components/schemas/WalkStatsPeriodRead'
      type: object
      required:
      - timezone
      - generated_at
      - today
      - streak_days
      - week
      - month
      title: WalkStatsRead
      description: '`GET /walks/stats` のレスポンス。集計境界はすべて JST（Asia/Tokyo）固定。'
    WalkStatsTodayRead:
      properties:
        date:
          type: string
          format: date
          title: Date
        walk_count:
          type: integer
          title: Walk Count
        duration_seconds:
          type: integer
          title: Duration Seconds
        distance_meters:
          type: integer
          title: Distance Meters
      type: object
      required:
      - date
      - walk_count
      - duration_seconds
      - distance_meters
      title: WalkStatsTodayRead
      description: 今日（JST 暦日）の集計。
    WalkingRouteLeg:
      properties:
        kind:
          $ref: '#/components/schemas/WalkingRouteLegKind'
        duration_seconds:
          type: integer
          minimum: 0.0
          title: Duration Seconds
        distance_meters:
          type: integer
          minimum: 0.0
          title: Distance Meters
        path:
          items:
            $ref: '#/components/schemas/GeoPoint'
          type: array
          minItems: 2
          title: Path
      type: object
      required:
      - kind
      - duration_seconds
      - distance_meters
      - path
      title: WalkingRouteLeg
    WalkingRouteLegKind:
      type: string
      enum:
      - outbound
      - return
      title: WalkingRouteLegKind
      description: 周回ルートを構成する leg の種別。綴りは Orval / mobile 側の契約として固定する。
    WalkingRouteRequest:
      properties:
        origin:
          $ref: '#/components/schemas/GeoPoint'
        destination:
          $ref: '#/components/schemas/RouteDestination'
        route_type:
          $ref: '#/components/schemas/WalkingRouteType'
          description: 'loop: origin -> destination -> a different path back to origin
            (the entire loop). one_way: origin -> destination only, e.g. recalculating
            the way back to the starting point while on the return leg (SS-35).'
          default: loop
      type: object
      required:
      - origin
      - destination
      title: WalkingRouteRequest
    WalkingRouteResponse:
      properties:
        origin:
          $ref: '#/components/schemas/GeoPoint'
        destination:
          $ref: '#/components/schemas/RouteDestinationRead'
        route_type:
          $ref: '#/components/schemas/WalkingRouteType'
        duration_seconds:
          type: integer
          minimum: 0.0
          title: Duration Seconds
          description: For route_type=loop, the duration of the entire loop (outbound
            + return legs summed). For route_type=one_way, the duration of that single
            leg.
        distance_meters:
          type: integer
          minimum: 0.0
          title: Distance Meters
          description: For route_type=loop, the distance of the entire loop (outbound
            + return legs summed). For route_type=one_way, the distance of that single
            leg.
        path:
          items:
            $ref: '#/components/schemas/GeoPoint'
          type: array
          minItems: 2
          title: Path
          description: 'For route_type=loop, the polyline of the entire loop: the
            outbound leg followed by the return leg, concatenated without duplicating
            the shared destination point. For route_type=one_way, the polyline of
            that single leg.'
        bounds:
          $ref: '#/components/schemas/MapBounds'
          description: Bounding box covering the entire loop (or the single leg for
            one_way).
        legs:
          items:
            $ref: '#/components/schemas/WalkingRouteLeg'
          type: array
          maxItems: 2
          title: Legs
          description: For route_type=loop, always exactly two legs ordered [outbound,
            return]. For route_type=one_way, an empty list.
        return_is_same_path:
          type: boolean
          title: Return Is Same Path
          description: True when a distinct return path could not be generated (or
            loop generation is disabled) and the response falls back to walking the
            outbound path in reverse. Always false for route_type=one_way.
      type: object
      required:
      - origin
      - destination
      - route_type
      - duration_seconds
      - distance_meters
      - path
      - bounds
      - legs
      - return_is_same_path
      title: WalkingRouteResponse
    WalkingRouteType:
      type: string
      enum:
      - loop
      - one_way
      title: WalkingRouteType
      description: 'SS-33: 提示するルートの形。既定は周回で、SS-35 の復路再計算が出発地への片道を明示する。'
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
