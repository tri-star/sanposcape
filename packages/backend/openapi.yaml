openapi: 3.1.0
info:
  title: sanposcape API
  description: 散歩支援アプリ sanposcape のバックエンド API
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Health Check
      description: ロードバランサ・compose healthcheck 用の疎通確認エンドポイント。
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /app-config:
    get:
      tags:
      - app-config
      summary: Get App Config
      description: 'mobile / LP が読む公開エンドポイント。認証不要（`/health` と同じ扱い）。


        DB を触らない軽量経路にしている（DB 障害時にもフラグを配れるようにするため。

        ADR-008 が選択肢4 を却下した理由と同じ発想）。取得層（`integrations/aws/appconfig.py`）が

        ブロッキング I/O（boto3）を行うため、この関数は `async def` にしない

        （sync def なら FastAPI がスレッドプールで実行し、イベントループを止めない）。'
      operationId: get_app_config
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfigRead'
  /auth/session:
    post:
      tags:
      - auth
      summary: Create Session
      operationId: create_session_auth_session_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh Session
      operationId: refresh_session_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      operationId: logout_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionLogoutRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/me:
    get:
      tags:
      - auth
      summary: Get Me
      operationId: get_me_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserRead'
      security:
      - HTTPBearer: []
  /users/me:
    delete:
      tags:
      - users
      summary: Delete Me
      description: Bearer token で解決した本人のアカウントを削除する。Apple ユーザーは削除の前に Apple のトークンを失効させる。Apple
        の一時障害で失効できないときは、アカウントを削除せず 503 を返す（再試行すれば完了できる）。
      operationId: delete_me_users_me_delete
      responses:
        '204':
          description: Successful Response
        '503':
          description: Account deletion temporarily unavailable; the account was not
            deleted
      security:
      - HTTPBearer: []
  /explore/places:
    post:
      tags:
      - explore
      summary: Search Places
      operationId: search_explore_places
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceSearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceSearchResponse'
        '401':
          description: Not authenticated
        '413':
          description: Explore request body too large
        '429':
          description: Map provider quota exceeded or explore rate limit reached
        '503':
          description: Map provider unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /explore/routes/walking:
    post:
      tags:
      - explore
      summary: Get Walking Route
      description: 'SS-33: `/explore/routes/loop` に置き換え。配布済みビルドの互換のため維持する

        （意味・スキーマは変えない。片道の duration_seconds/distance_meters のまま）。'
      operationId: get_walking_route_explore_routes_walking
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalkingRouteRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkingRouteResponse'
        '401':
          description: Not authenticated
        '413':
          description: Explore request body too large
        '429':
          description: Map provider quota exceeded or explore rate limit reached
        '503':
          description: Map provider unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      deprecated: true
  /explore/routes/loop:
    post:
      tags:
      - explore
      summary: Get Loop Walking Route
      description: 'SS-33: 現在地 → 目的地 → (往路と異なる道) → 現在地 の周回ルート。


        周回を作れない場合も 200 + `return_is_same_path=true`（同じ道で戻る）で返す

        （エラーにしない）。'
      operationId: get_loop_walking_route_explore_routes_loop
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalkingRouteRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoopWalkingRouteResponse'
        '401':
          description: Not authenticated
        '413':
          description: Explore request body too large
        '429':
          description: Map provider quota exceeded or explore rate limit reached
        '503':
          description: Map provider unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /explore/reverse-geocode:
    post:
      tags:
      - explore
      summary: Reverse Geocode
      description: 'ピンの位置の住所（SS-138。SS-212 からはピン詳細に表示する）。サインインが要る。


        座標を Google へ送るのはサーバーからだけで、DB・ログには残さない（メモリのキャッシュのみ。

        キャッシュは利用者ごとに分ける）。住所が無い場所では 200 + `address=null`。'
      operationId: reverse_geocode_explore
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReverseGeocodeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReverseGeocodeResponse'
        '401':
          description: Not authenticated
        '413':
          description: Explore request body too large
        '429':
          description: Map provider quota exceeded or explore rate limit reached
        '503':
          description: Map provider unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /explore/nearest-station:
    post:
      tags:
      - explore
      summary: Find Nearest Station
      description: 'ピンの位置の最寄り駅（SS-225）。ピンの登録画面で、駅名のタグを最初から入れておくのに使う。


        サインインが要る。同梱の駅のデータ（国土数値情報）から引き、Google は呼ばないので探索のレート

        制限は掛けない。座標は DB・ログに残さない。3km 以内に駅が無ければ 200 + `station=null`。'
      operationId: find_nearest_station_explore
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NearestStationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearestStationResponse'
        '401':
          description: Not authenticated
        '413':
          description: Explore request body too large
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /walks:
    post:
      tags:
      - walks
      summary: Create Walk
      description: '散歩の記録を保存する。


        `client_walk_id` の再送は同じ散歩として扱い、新規作成のみ 201、

        冪等な再送は 200 を返す（軌跡はエコーバックしない: モバイルは送信済みの値を持つ）。'
      operationId: create_walk_walks_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalkCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkRead'
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '200':
          description: 'Idempotent replay: an existing walk with the same client_walk_id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkRead'
        '422':
          description: Validation error
    get:
      tags:
      - walks
      summary: List Walks
      description: 散歩履歴の一覧を `started_at DESC` の keyset ページネーションで返す。
      operationId: list_walks_walks_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: started_after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started After
      - name: started_before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started Before
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkListRead'
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '400':
          description: Invalid cursor
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /walks/stats:
    get:
      tags:
      - walks
      summary: Get Walk Stats
      description: '記録タブ向けの集計（今日 / 直近7日 / 直近28日 / 連続日数）を JST 基準で返す。


        クエリパラメータは持たず、散歩 0 件でも 200 + 全ゼロを返す（404 にしない）。'
      operationId: get_walk_stats_walks_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkStatsRead'
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
      security:
      - HTTPBearer: []
  /walks/{walk_id}:
    get:
      tags:
      - walks
      summary: Get Walk
      description: 散歩1件の詳細（軌跡付き）を返す。他ユーザーの散歩・存在しない ID は 404（D6）。
      operationId: get_walk_walks__walk_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: walk_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Walk Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkDetailRead'
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '404':
          description: Walk not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - walks
      summary: Delete Walk
      description: '散歩1件を削除する。他ユーザーの散歩・存在しない ID は 404（D6）。


        削除済み ID への再送も 404（冪等にはしない）。クライアントは 404 を

        「既に存在しない」として成功同様に扱ってよい。'
      operationId: delete_walk_walks__walk_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: walk_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Walk Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '404':
          description: Walk not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sanpo-maps:
    get:
      tags:
      - sanpo-maps
      summary: List Sanpo Maps
      description: '自分が member である地図を全件返す（ページングなし。MVP は件数が少ない前提）。


        `?expand=pin_count` を指定すると各要素の `pin_count` が整数で埋まる（ピンが無い

        地図は0）。未指定なら `pin_count` は null のまま。各要素の `icon` は地図のアイコン

        （未設定は無く、既定は `pin`）。'
      operationId: list_sanpo_maps
      security:
      - HTTPBearer: []
      parameters:
      - name: expand
        in: query
        required: false
        schema:
          type: array
          items:
            const: pin_count
            type: string
          maxItems: 8
          title: Expand
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanpoMapListRead'
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '422':
          description: Validation error
    post:
      tags:
      - sanpo-maps
      summary: Create Sanpo Map
      description: '地図を新規作成する（作成者が owner になる）。


        自分の既定地図がまだ無ければ、作った地図が既定になる（`is_default` はリクエストで

        指定できない）。名前の重複は許可する。冪等キーは持たない。`icon` を省略すると

        `pin` になる。'
      operationId: create_sanpo_map
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SanpoMapCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanpoMapRead'
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '422':
          description: Validation error
  /sanpo-maps/{sanpo_map_id}:
    patch:
      tags:
      - sanpo-maps
      summary: Update Sanpo Map
      description: '地図の名前・アイコンを変更する。空のボディ `{}` は何も変えずに 200 を返す。


        地図 owner のみ可（editor は 403）。非メンバー・存在しない ID は 404。同名への

        変更も 200。名前・アイコンの変更では `updated_at` を更新しない。'
      operationId: update_sanpo_map
      security:
      - HTTPBearer: []
      parameters:
      - name: sanpo_map_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Sanpo Map Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SanpoMapUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanpoMapRead'
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '403':
          description: Permission denied
        '404':
          description: Sanpo map not found
        '422':
          description: Validation error
    delete:
      tags:
      - sanpo-maps
      summary: Delete Sanpo Map
      description: '地図を削除する。ピン・写真・タグも DB の `ON DELETE CASCADE` で消え、S3 の写真の

        実体は best-effort で削除する（ストレージ障害・未構成でも 204 のまま）。


        地図 owner のみ可（editor は 403）。非メンバー・存在しない ID は 404。非冪等

        （削除済み ID への再送も 404）。消したのが既定地図なら、残りの地図のうち

        `updated_at DESC, id DESC` の先頭が新しい既定に繰り上がる。'
      operationId: delete_sanpo_map
      security:
      - HTTPBearer: []
      parameters:
      - name: sanpo_map_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Sanpo Map Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '403':
          description: Permission denied
        '404':
          description: Sanpo map not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sanpo-maps/{sanpo_map_id}/tags:
    get:
      tags:
      - sanpo-maps
      summary: List Sanpo Map Tags
      description: '地図内の全ピン（作成者を問わない）のタグを、正規化キー（`label_key`）単位にまとめて返す。


        `label` は同じキーで最後に付けられた表記。並び順は付いているピン数の多い順

        （`pin_count DESC`）→ 最後に使われた日時の新しい順 → `label_key` の昇順。`limit`

        件（既定100・最大200）まで返し、続きは取れない（上位 N 件のランキング）。タグが

        無ければ `items` は空。


        地図の member（owner・editor）なら呼べる。非メンバー・存在しない ID は 404。'
      operationId: list_sanpo_map_tags
      security:
      - HTTPBearer: []
      parameters:
      - name: sanpo_map_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Sanpo Map Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanpoMapTagListRead'
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '404':
          description: Sanpo map not found
        '422':
          description: Validation error
  /sanpo-maps/{sanpo_map_id}/members:
    get:
      tags:
      - sanpo-maps
      summary: List Sanpo Map Members
      description: '地図のメンバーを返す（owner → 参加日時の古い順）。


        各要素は利用者の ID・表示名（未設定は null）・役割・参加日時だけで、メールアドレスや

        プロフィール画像は返さない。地図の member（owner・editor）なら呼べる。非メンバー・

        存在しない ID は 404。'
      operationId: list_sanpo_map_members
      security:
      - HTTPBearer: []
      parameters:
      - name: sanpo_map_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Sanpo Map Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanpoMapMemberListRead'
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '404':
          description: Sanpo map not found
        '422':
          description: Validation error
  /sanpo-maps/{sanpo_map_id}/members/{user_id}:
    delete:
      tags:
      - sanpo-maps
      summary: Remove Sanpo Map Member
      description: 'メンバーを地図から外す。自分の ID を指定すると、自分が地図から抜ける。


        owner は他のメンバーを外せる（editor が他人を指定すると 403）。editor は自分だけ抜けられ、

        owner が自分を指定すると 409（`owner_cannot_leave`）。呼んだ人が非メンバー・存在しない地図は

        404（`sanpo_map_not_found`）、owner が指定した相手が member でなければ 404

        （`sanpo_map_member_not_found`）。外した人・抜けた人が追加したピン・写真・タグは地図に残る。

        非冪等（抜けた後の再送は 404）。'
      operationId: remove_sanpo_map_member
      security:
      - HTTPBearer: []
      parameters:
      - name: sanpo_map_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Sanpo Map Id
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Not authenticated
        '413':
          description: Request body too large
        '403':
          description: Permission denied
        '404':
          description: Sanpo map not found, or the user is not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanpoMapMemberNotFoundErrorRead'
        '409':
          description: Owner cannot leave
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanpoMapLeaveConflictErrorRead'
        '422':
          description: Validation error
  /sanpo-maps/{sanpo_map_id}/invitations:
    post:
      tags:
      - sanpo-map-invitations
      summary: Create Sanpo Map Invitation
      description: '招待リンクを発行する（地図 owner のみ。editor は 403）。


        1つのリンクで参加できるのは1人、有効期限は7日。`token` と `url`（`<招待ページ>#<token>`）は

        この応答でだけ返す（DB にはハッシュだけを保存する）。メンバーが上限（10人）なら 409

        `member_limit_reached`、有効なリンクが上限（10件）なら 409 `invitation_limit_exceeded`。

        フラグ `map_invitation` が OFF なら 403 `feature_disabled`。'
      operationId: create_sanpo_map_invitation
      security:
