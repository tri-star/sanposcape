openapi: 3.1.0
info:
  title: sanposcape API
  description: 散歩支援アプリ sanposcape のバックエンド API
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Health Check
      description: ロードバランサ・compose healthcheck 用の疎通確認エンドポイント。
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /spots:
    get:
      tags:
      - spots
      summary: List Spots
      operationId: list_spots_spots_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SpotRead'
                type: array
                title: Response List Spots Spots Get
    post:
      tags:
      - spots
      summary: Create Spot
      operationId: create_spot_spots_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpotCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthStatus:
      properties:
        status:
          type: string
          title: Status
      type: object
      required:
      - status
      title: HealthStatus
    SpotCreate:
      properties:
        name:
          type: string
          title: Name
        latitude:
          type: number
          title: Latitude
        longitude:
          type: number
          title: Longitude
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      type: object
      required:
      - name
      - latitude
      - longitude
      title: SpotCreate
    SpotRead:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        latitude:
          type: number
          title: Latitude
        longitude:
          type: number
          title: Longitude
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - name
      - latitude
      - longitude
      - category
      - created_at
      title: SpotRead
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
