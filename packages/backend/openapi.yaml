openapi: 3.1.0
info:
  title: sanposcape API
  description: 散歩支援アプリ sanposcape のバックエンド API
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Health Check
      description: ロードバランサ・compose healthcheck 用の疎通確認エンドポイント。
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /spots:
    get:
      tags:
      - spots
      summary: List Spots
      operationId: list_spots_spots_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SpotRead'
                type: array
                title: Response List Spots Spots Get
    post:
      tags:
      - spots
      summary: Create Spot
      operationId: create_spot_spots_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpotCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/session:
    post:
      tags:
      - auth
      summary: Create Session
      operationId: create_session_auth_session_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh Session
      operationId: refresh_session_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      operationId: logout_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionLogoutRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/me:
    get:
      tags:
      - auth
      summary: Get Me
      operationId: get_me_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserRead'
      security:
      - HTTPBearer: []
components:
  schemas:
    AuthUserRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        photo_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Photo Url
      type: object
      required:
      - id
      - email
      - display_name
      - photo_url
      title: AuthUserRead
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthStatus:
      properties:
        status:
          type: string
          title: Status
      type: object
      required:
      - status
      title: HealthStatus
    SessionCreate:
      properties:
        provider:
          type: string
          const: google
          title: Provider
        id_token:
          type: string
          maxLength: 4096
          title: Id Token
      type: object
      required:
      - provider
      - id_token
      title: SessionCreate
    SessionLogoutRequest:
      properties:
        refresh_token:
          type: string
          maxLength: 512
          title: Refresh Token
      type: object
      required:
      - refresh_token
      title: SessionLogoutRequest
    SessionRead:
      properties:
        access_token:
          type: string
          title: Access Token
        expires_in:
          type: integer
          title: Expires In
        refresh_token:
          type: string
          title: Refresh Token
        user:
          $ref: '#/components/schemas/AuthUserRead'
      type: object
      required:
      - access_token
      - expires_in
      - refresh_token
      - user
      title: SessionRead
    SessionRefreshRequest:
      properties:
        refresh_token:
          type: string
          maxLength: 512
          title: Refresh Token
      type: object
      required:
      - refresh_token
      title: SessionRefreshRequest
    SpotCreate:
      properties:
        name:
          type: string
          title: Name
        latitude:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Latitude
        longitude:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Longitude
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      type: object
      required:
      - name
      - latitude
      - longitude
      title: SpotCreate
    SpotRead:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        latitude:
          type: number
          title: Latitude
        longitude:
          type: number
          title: Longitude
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - name
      - latitude
      - longitude
      - category
      - created_at
      title: SpotRead
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
