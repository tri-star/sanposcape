# 認証ゲート（SS-13 / ADR-009）の到達性フロー。
# 未認証でのディープリンクがサインイン画面へ弾かれ、サインイン後は同じリンクが通ることを見る。
# preview E2E ビルド（EXPO_PUBLIC_AUTH_MODE=dev）前提。外部データ（/explore/*）には依存しない。
appId: com.sanposcape.app
tags:
  - smoke
---
- launchApp:
    clearState: true
# スプラッシュは assert しない（理由は subflows/sign-in.yaml のコメントを参照:
# 表示窓が約900msしかなく、Maestroのポーリング間隔次第で見逃す構造的フレークになる）。
- extendedWaitUntil:
    visible:
      id: "sign-in-google-button"
    timeout: 15000
# 未認証で保護ルートへディープリンク → ゲートがサインインへ戻す。
- openLink: "sanposcape://walk-start"
- extendedWaitUntil:
    visible:
      id: "sign-in-google-button"
    timeout: 10000
- assertNotVisible:
    id: "walk-start-screen"
# サインイン後は同じ導線が通る。
- tapOn:
    id: "sign-in-google-button"
- extendedWaitUntil:
    visible:
      id: "walk-start-screen"
    timeout: 20000
- openLink: "sanposcape://settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 10000
