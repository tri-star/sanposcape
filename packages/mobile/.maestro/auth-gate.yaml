# ゲスト導線と認証状態の到達性フロー（SS-57 / ADR-M-009 SS-57 追補）。
# ゲストのまま保護ルートに入れること、ゲストからサインインへ戻れることを見る。
# preview E2E ビルド（EXPO_PUBLIC_AUTH_MODE=dev）前提。外部データ（/explore/*）には依存しない。
appId: com.sanposcape.app.dev
tags:
  - smoke
---
# 状態の消去と起動は分ける（clearState 直後の起動が kill される競合への対策。理由は subflows/launch-clean.yaml）。
- runFlow: subflows/launch-clean.yaml
# スプラッシュは assert しない（理由は subflows/sign-in.yaml のコメントを参照）。
# 未サインインの起動はサインイン画面に着く（getSplashDestination は guest を通さない）。
- extendedWaitUntil:
    visible:
      id: "sign-in-google-button"
    timeout: 15000
# プライバシーポリシーへの導線はサインイン画面にも出る（SS-158）。押さない（下の設定画面と同じ理由）。
- assertVisible:
    id: "sign-in-privacy-policy-link"
# 「ゲストで試す」で保護ルート（ピンタブ。SS-145 の着地点）に入れる。
- tapOn:
    id: "sign-in-guest-button"
- extendedWaitUntil:
    visible:
      id: "pin-tab-screen"
    timeout: 15000
# ゲストのピンタブは通信せず、サインイン案内を出す（SS-146 / ADR-M-012 D9）。
- extendedWaitUntil:
    visible:
      id: "pin-tab-sign-in"
    timeout: 10000
# ゲストのアカウントタブ: 集計・最近の散歩の代わりにサインイン案内（通信しない）。設定ボタンはゲストにも出る（SS-148）
- tapOn:
    id: "app-tab-account"
- extendedWaitUntil:
    visible:
      id: "history-sign-in-required"
    timeout: 10000
- assertNotVisible:
    id: "history-stats-error"
- assertVisible:
    id: "account-open-settings"
# ゲストのまま設定画面に入ると、ログアウトではなくサインイン導線が出る。
- openLink: "sanposcape-dev://settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 10000
- assertVisible:
    id: "settings-sign-in"
# プライバシーポリシーへの導線はゲストにも出る（SS-158）。押さない: 外部サイトと端末のブラウザに E2E を依存させない。
- assertVisible:
    id: "settings-privacy-policy-link"
- assertNotVisible:
    id: "settings-open-logout-dialog"
# アカウント削除の導線が出ないことだけを見る。実際に削除を実行するステップは追加しない
# （dev ユーザー e2e-user-1 は全 E2E フローで共有される固定アカウントで、取り消し不能な削除は
# 他フローと干渉するため。docs/architecture-guideline.md の E2E 方針を参照。SS-62）。
- assertNotVisible:
    id: "settings-open-account-delete-dialog"
# ゲストからサインインへ戻り、サインインできる。
- tapOn:
    id: "settings-sign-in"
- extendedWaitUntil:
    visible:
      id: "sign-in-google-button"
    timeout: 10000
- tapOn:
    id: "sign-in-google-button"
- extendedWaitUntil:
    visible:
      id: "pin-tab-screen"
    timeout: 20000
