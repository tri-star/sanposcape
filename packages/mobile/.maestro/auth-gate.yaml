# 認証ゲート（SS-13 / ADR-009）の到達性フロー。
# 未認証でのディープリンクがサインイン画面へ弾かれ、サインイン後は同じリンクが通ることを見る。
# preview E2E ビルド（EXPO_PUBLIC_AUTH_MODE=dev）前提。外部データ（/explore/*）には依存しない。
appId: com.sanposcape.app
tags:
  - smoke
---
- launchApp:
    clearState: true
# 初回描画までの待ちは subflows/sign-in.yaml と同じ理由で extendedWaitUntil にする
# （launchApp はJSの初回描画完了を保証せず、CIでは assertVisible の既定7秒を超え得る）。
- extendedWaitUntil:
    visible:
      id: "splash-screen"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "sign-in-google-button"
    timeout: 15000
# 未認証で保護ルートへディープリンク → ゲートがサインインへ戻す。
- openLink: "sanposcape://walk-start"
- extendedWaitUntil:
    visible:
      id: "sign-in-google-button"
    timeout: 10000
- assertNotVisible:
    id: "walk-start-screen"
# サインイン後は同じ導線が通る。
- tapOn:
    id: "sign-in-google-button"
- extendedWaitUntil:
    visible:
      id: "walk-start-screen"
    timeout: 20000
- openLink: "sanposcape://settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 10000
