# 散歩開始画面からの離脱導線（SS-34）。
# 候補（/explore/places）に依存しないため maps-required は付けない。
# `- back` は Android のシステムバック。CI は Android エミュレータで実行する。
appId: com.sanposcape.app.dev
tags:
  - smoke
---
- runFlow: subflows/sign-in.yaml
- runFlow: subflows/open-walk-start.yaml

# 画面上のキャンセル/戻る → ナビタブ（散歩を始めた元のタブ）へ。`/walk-start` は replace で入るため
# `canGoBack()` は false で、fallback の `/(tabs)`＝ナビタブへ replace される
# （SS-145 で着地点がピンタブになっても戻り先はナビタブ）
- tapOn:
    id: "walk-start-back"
- extendedWaitUntil:
    visible:
      id: "walk-active-idle"
    timeout: 10000
- assertVisible:
    id: "app-tab-bar"

# 戻ったあとに再度スポットを選び直せる（開始状態が残っていない＝idle 表示から入り直せる）
- tapOn:
    id: "walk-active-start-cta"
- extendedWaitUntil:
    visible:
      id: "walk-start-screen"
    timeout: 10000

# Android のシステムバックでも同じ遷移になる（アプリ終了しない）
- back
- extendedWaitUntil:
    visible:
      id: "walk-active-idle"
    timeout: 10000
- assertVisible:
    id: "app-tab-bar"
