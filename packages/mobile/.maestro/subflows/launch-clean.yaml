# 共通 subflow: アプリの状態を消してから起動する（`launchApp: { clearState: true }` の代わり。SS-152）。
# `subflows/` 配下なので単体では実行されない。
#
# `launchApp: { clearState: true }` を使わない理由:
# 直前のフローでアプリが前面にいる状態から状態を消す（pm clear）と、前面にいたタスクが
# 「プロセスが死んだ」扱いで破棄され、約1秒後に ActivityTaskManager がそのタスクの
# 「Destroy timeout of remove-task」でアプリのプロセスを kill しにいく。clearState と起動を
# 1コマンドで行うと、新しいプロセスが起動してから Activity を attach するまでの間にこの
# タイムアウトが来ることがあり、その *新しい* プロセスが「remove task」で kill され
# （起動から約25ms）、「failed to attach」になってネイティブスプラッシュのまま止まる
# （run 36868867068 の smoke / auth-gate。logcat で確認）。
# 同じランの他フローも、起動がタイムアウトの約20〜570ms 後だったために偶然通っていただけで、
# 毎回同じ競合に晒されている。アプリのコードの問題ではない。
# なお stopApp（force-stop）やプロセスが居ない状態での pm clear ではこのタイムアウトは出ていない。
#
# 対応: 状態の消去と起動を分け、その間でタイムアウトが過ぎるのを待つ。
# Maestro には固定時間の待機コマンドが無いので、存在しない要素を optional で待つことで代用する
# （3秒待って失敗しても optional なのでフローは続く）。タイムアウトは消去の開始から約1秒で、
# 消去自体にも約0.9秒かかるため、3秒あれば逼迫したランナーでも十分に余裕がある。
appId: com.sanposcape.app.dev
---
- clearState
# optional の失敗は毎回 warning としてログに出る（想定どおり）。label で意図が分かるようにする。
- extendedWaitUntil:
    visible:
      id: "e2e-wait-for-task-removal"
    timeout: 3000
    optional: true
    label: "clearState 後のタスク破棄タイムアウトを待つ（3秒の固定待ち）"
- launchApp
