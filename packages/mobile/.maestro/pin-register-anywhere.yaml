# 散歩していないときのピン登録（SS-124 / SS-146）: サインイン → ピンタブの地図を長押し
# → 登録画面 → 名前 → 位置を調整（タップ → 確定）→ 保存 → ピンタブへ戻る。
#
# 前提:
#   - preview ビルド（EXPO_PUBLIC_AUTH_MODE=dev / EXPO_PUBLIC_LOCATION_MODE=mock / EXPO_PUBLIC_PHOTO_MODE=mock）
#   - backend が packages/backend/.env.example どおり（FEATURE_FLAG_MODE=stub で pin_registration ON、STORAGE_MODE=fake）
#   - 地図の長押し・タップは Maps SDK が初期化されている必要がある（CI はキー注入済み。ADR-M-007）。
#     タイルの描画結果は assert しない。
# /explore/places に依存しないので maps-required は付けない（散歩を始めない）。
# assert しないもの: 座標の値・地図の名前・件数・地図タイル・保存完了トースト（理由は保存の直後のコメント）。
appId: com.sanposcape.app.dev
tags:
  - pin
---
- runFlow: subflows/sign-in.yaml
- extendedWaitUntil:
    visible:
      id: "pin-tab-map"
    timeout: 15000
# 地図の中心（= mock の現在地）を避けて長押しする。E2E ユーザーのピンは同じ地点に溜まり、
# マーカーは座標の上側に描かれるので、中心より下を押す。
# 不安定なら `longPressOn: { id: "pin-tab-map" }`（中心）に戻すこと。
- longPressOn:
    point: "50%,62%"
- extendedWaitUntil:
    visible:
      id: "pin-register-screen"
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: "pin-register-sanpo-map-loading"
    timeout: 15000
- assertNotVisible:
    id: "pin-register-sanpo-map-retry"
# 名前を先に入れ、位置調整の往復で入力が消えないことも見る
- tapOn:
    id: "pin-register-name-input"
# 入力は ASCII にする（日本語は Maestro の IME 経由になり、直後の hideKeyboard の BACK が画面の「戻る」に化けることがある。docs/local-env.md の E2E 節。SS-152）。
- inputText: "E2E-anywhere-pin"
- hideKeyboard
- tapOn:
    id: "pin-register-location-adjust"
- extendedWaitUntil:
    visible:
      id: "pin-location-adjust-map"
    timeout: 10000
# 地図の中心（= 現在の位置）を避けてタップする（中心だと「元と同じ位置」になり調整済みにならない）
- tapOn:
    point: "30%,40%"
- tapOn:
    id: "pin-location-adjust-confirm"
- extendedWaitUntil:
    notVisible:
      id: "pin-location-adjust-overlay"
    timeout: 5000
- assertVisible:
    id: "pin-register-location-adjusted"
- assertVisible:
    text: "E2E-anywhere-pin"
- scrollUntilVisible:
    element:
      id: "pin-register-save"
- tapOn:
    id: "pin-register-save"
# 保存完了トースト（「ピンを保存しました」）は assert しない（SS-152）。
# トーストは 1.9 秒（useToast の既定）で消えるが、保存ボタンの tapOn は「タップ後に画面が変わったか」を
# ビュー階層の取得（逼迫したランナーでは1回1〜2秒）で確かめてから返るため、返った時点で既に消えている
# ことがある（run 36880788927 で失敗。直前の run 36868867068 では約1秒差で通っていた）。消え去った要素は
# 待っても二度と現れないので、待ち時間を伸ばしても解決しない（sign-in.yaml のスプラッシュと同じ構造）。
# 代わりに登録画面が閉じてピンタブへ戻ることを待つ（保存に失敗すると登録画面に残る）。
- extendedWaitUntil:
    notVisible:
      id: "pin-register-screen"
    timeout: 20000
- assertVisible:
    id: "pin-tab-screen"
