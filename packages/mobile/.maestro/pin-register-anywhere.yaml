# 散歩していないときのピン登録（SS-124 / SS-146）: サインイン → ピンタブの地図を長押し
# → 登録画面 → 名前 → 位置を調整（タップ → 確定）→ 保存 → ピンタブへ戻る。
# 保存完了トーストはピンタブの PinTabView が出す（SS-145 / SS-146）。
#
# 前提:
#   - preview ビルド（EXPO_PUBLIC_AUTH_MODE=dev / EXPO_PUBLIC_LOCATION_MODE=mock / EXPO_PUBLIC_PHOTO_MODE=mock）
#   - backend が packages/backend/.env.example どおり（FEATURE_FLAG_MODE=stub で pin_registration ON、STORAGE_MODE=fake）
#   - 地図の長押し・タップは Maps SDK が初期化されている必要がある（CI はキー注入済み。ADR-007）。
#     タイルの描画結果は assert しない。
# /explore/places に依存しないので maps-required は付けない（散歩を始めない）。
# assert しないもの: 座標の値・地図の名前・件数・地図タイル。
# 保存完了トーストは assert する（idle 分岐の ToastOverlay の欠落を SS-124 で直したため。PR #102 レビュー）。
appId: com.sanposcape.app.dev
tags:
  - pin
---
- runFlow: subflows/sign-in.yaml
- extendedWaitUntil:
    visible:
      id: "pin-tab-map"
    timeout: 15000
# 地図の中心（= mock の現在地）を避けて長押しする。E2E ユーザーのピンは同じ地点に溜まり、
# マーカーは座標の上側に描かれるので、中心より下を押す。
# 不安定なら `longPressOn: { id: "pin-tab-map" }`（中心）に戻すこと。
- longPressOn:
    point: "50%,62%"
- extendedWaitUntil:
    visible:
      id: "pin-register-screen"
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: "pin-register-sanpo-map-loading"
    timeout: 15000
- assertNotVisible:
    id: "pin-register-sanpo-map-retry"
# 名前を先に入れ、位置調整の往復で入力が消えないことも見る
- tapOn:
    id: "pin-register-name-input"
- inputText: "E2Eの任意地点ピン"
- hideKeyboard
- tapOn:
    id: "pin-register-location-adjust"
- extendedWaitUntil:
    visible:
      id: "pin-location-adjust-map"
    timeout: 10000
# 地図の中心（= 現在の位置）を避けてタップする（中心だと「元と同じ位置」になり調整済みにならない）
- tapOn:
    point: "30%,40%"
- tapOn:
    id: "pin-location-adjust-confirm"
- extendedWaitUntil:
    notVisible:
      id: "pin-location-adjust-overlay"
    timeout: 5000
- assertVisible:
    id: "pin-register-location-adjusted"
- assertVisible:
    text: "E2Eの任意地点ピン"
- scrollUntilVisible:
    element:
      id: "pin-register-save"
- tapOn:
    id: "pin-register-save"
# トーストは 1.9 秒で消える（useToast の既定）ので、idle 画面を待ってからでは取りこぼしうる。
# 文言が出るのを直接待ち、そのあとピンタブにいることを確かめる。
- extendedWaitUntil:
    visible:
      text: "ピンを保存しました"
    timeout: 20000
- assertVisible:
    id: "pin-tab-screen"
- assertNotVisible:
    id: "pin-register-screen"
- assertNotVisible:
    id: "pin-register-save-error"
