# ピン登録: サインイン → 散歩開始 → 「この場所にピンを追加」→ 地図を新規作成して保存先に選ぶ（SS-117）
# → 名前・タグ・メモ → 保存 → 散歩中画面へ戻る。
#
# 前提:
#   - preview ビルド（EXPO_PUBLIC_AUTH_MODE=dev / EXPO_PUBLIC_LOCATION_MODE=mock / EXPO_PUBLIC_PHOTO_MODE=mock）
#   - backend が packages/backend/.env.example どおり（STORAGE_MODE=fake）
# 写真は添付しない（写真付きの登録は pin-register-photo.yaml。SS-123）。
# タグは追加ボタンと送信キーの両方で1件ずつ追加する。候補の表示は件数が実行順に依存するので見ない。
# assert しないもの: 地図の件数（同一 CI ランで他フローの登録が残る）、トースト、地図タイル。
# 地図はこのフローが作った一意な名前のものだけを見る。CI のランごとに地図が1つ増えるが、sanpo-map-list.yaml と同じ扱い。
appId: com.sanposcape.app.dev
tags:
  - pin
  - maps-required
---
- runFlow: subflows/sign-in.yaml
- runFlow: subflows/open-walk-start.yaml
- runFlow: subflows/start-walk-from-spot.yaml
- tapOn:
    id: "walk-active-add-pin"
- extendedWaitUntil:
    visible:
      id: "pin-register-screen"
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: "pin-register-sanpo-map-loading"
    timeout: 15000
- assertNotVisible:
    id: "pin-register-sanpo-map-retry"
# --- 登録画面で地図を作る（SS-117）。作った地図が保存先の選択肢に出る（選択は単体テストで担保）---
- evalScript: ${output.mapName = 'E2E-reg-map-' + String(Date.now())}
- scrollUntilVisible:
    element:
      id: "pin-register-sanpo-map-create"
- tapOn:
    id: "pin-register-sanpo-map-create"
- extendedWaitUntil:
    visible:
      id: "pin-register-sanpo-map-create-dialog"
    timeout: 5000
- tapOn:
    id: "pin-register-sanpo-map-create-name-input"
- inputText: ${output.mapName}
- hideKeyboard
- tapOn:
    id: "pin-register-sanpo-map-create-submit"
- extendedWaitUntil:
    notVisible:
      id: "pin-register-sanpo-map-create-dialog"
    timeout: 15000
- assertNotVisible:
    id: "pin-register-sanpo-map-create-error"
- extendedWaitUntil:
    visible:
      text: ${output.mapName}
    timeout: 10000
# 地図の欄まで下へ送ったので、名前欄を画面内へ戻す（隠れた要素の座標をそのままタップしないように）。
- scrollUntilVisible:
    element:
      id: "pin-register-name-input"
    direction: UP
# 入力は ASCII にする（日本語は Maestro の IME 経由になり、直後の hideKeyboard の BACK が画面の「戻る」に化けることがある。docs/local-env.md の E2E 節。SS-152）。
- runFlow:
    file: subflows/replace-text.yaml
    env:
      FIELD_ID: "pin-register-name-input"
      TEXT: "E2E-pin"
# タグ欄は位置プレビュー・位置調整ボタン（SS-124）の下にあり、キーボードを開いたままだと
# その裏に隠れる。Maestro は隠れた要素の座標をそのままタップするので、タップがキーボードに
# 吸われて名前欄に入力が続いてしまう。キーボードを閉じてからタグ欄を画面内に出す。
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "pin-register-tag-input"
- tapOn:
    id: "pin-register-tag-input"
- inputText: "e2e"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "pin-register-tag-add"
- tapOn:
    id: "pin-register-tag-add"
- assertVisible:
    id: "pin-register-tag-0"
- tapOn:
    id: "pin-register-tag-input"
- inputText: "e2e-enter"
- pressKey: Enter
- assertVisible:
    id: "pin-register-tag-1"
- tapOn:
    id: "pin-register-memo-input"
- inputText: "registered-by-maestro"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "pin-register-save"
- tapOn:
    id: "pin-register-save"
- extendedWaitUntil:
    visible:
      id: "walk-active-screen"
    timeout: 20000
- assertNotVisible:
    id: "pin-register-screen"
- assertNotVisible:
    id: "pin-register-save-error"
