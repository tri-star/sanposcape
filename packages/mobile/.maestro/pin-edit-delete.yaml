# ピンの編集・削除（SS-119）: サインイン → 地図を作成 → その地図にピンを登録
# → 地図詳細からピン詳細 → 編集（名前・メモ・タグ）→ 保存して詳細に反映
# → ピンを削除 → 地図詳細が0件。
#
# 前提: pin-register-anywhere.yaml と同じ
#   - preview ビルド（EXPO_PUBLIC_AUTH_MODE=dev / EXPO_PUBLIC_LOCATION_MODE=mock / EXPO_PUBLIC_PHOTO_MODE=mock）
#   - backend が packages/backend/.env.example どおり（FEATURE_FLAG_MODE=stub で pin_registration ON、STORAGE_MODE=fake）
#   - 地図の長押しは Maps SDK が初期化されている必要がある（CI はキー注入済み。ADR-M-007）。
# /explore/places に依存しないので maps-required は付けない（散歩を始めない）。
#
# 写真の追加・削除は E2E の対象外: mock の photo サービスは実ファイルを返さない（ADR-M-010 決定6）。
# 単体テストと、/dev-screens からの手動確認で担保する。
#
# assert しないもの: トースト（「ピンを更新しました」「ピンを削除しました」は 1.9 秒で消え、画面遷移の
# 検出待ちの間に取りこぼす。SS-152）、件数、ほかの地図・ピン。
# このフローが作る地図とピンにだけ依存する（実行ごとに一意な名前）。
#
# 共有ユーザーへの影響: このフローが作ったピンだけを削除する。地図は残る（mobile に地図の削除が無い）。
# CI のランごとに地図が1つ増えるが、sanpo-map-list.yaml と同じ扱い。
#
# 注意:
#   - 入力はすべて ASCII にする（日本語は Maestro の IME 経由になり、直後の hideKeyboard の BACK が
#     画面の「戻る」に化けることがある。SS-152）。
#   - 保存の成功は「編集画面が閉じて詳細へ戻り、詳細に新しい名前が出る」ことで確かめる。
appId: com.sanposcape.app.dev
tags:
  - pin
---
- runFlow: subflows/sign-in.yaml
- extendedWaitUntil:
    visible:
      id: "pin-tab-map"
    timeout: 15000
# 実行ごとに一意な値（同じ CI ランの他フロー・前回の実行の地図と区別する）
- evalScript: ${output.suffix = String(Date.now())}
- evalScript: ${output.mapName = 'E2E-edit-map-' + output.suffix}
- evalScript: ${output.pinName = 'E2E-edit-pin-' + output.suffix}
- evalScript: ${output.editedName = output.pinName + '-ed'}
# タグは 20 文字以内
- evalScript: ${output.tagLabel = 't' + output.suffix.slice(-8)}

# --- 地図一覧 → 作成 → ピンタブへ戻る ---
- tapOn:
    id: "pin-tab-open-sanpo-map-list"
- extendedWaitUntil:
    visible:
      id: "sanpo-map-list-screen"
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: "sanpo-map-list-loading"
    timeout: 15000
- tapOn:
    id: "sanpo-map-list-create-fab"
- extendedWaitUntil:
    visible:
      id: "sanpo-map-create-dialog"
    timeout: 5000
- tapOn:
    id: "sanpo-map-create-name-input"
- inputText: ${output.mapName}
- hideKeyboard
- tapOn:
    id: "sanpo-map-create-submit"
- extendedWaitUntil:
    notVisible:
      id: "sanpo-map-create-dialog"
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: ${output.mapName}
    timeout: 10000
- tapOn:
    id: "sanpo-map-list-back"
- extendedWaitUntil:
    visible:
      id: "pin-tab-screen"
    timeout: 10000

# --- 作った地図にピンを登録する（pin-register-anywhere.yaml と同じ長押しの地点） ---
- longPressOn:
    point: "50%,62%"
- extendedWaitUntil:
    visible:
      id: "pin-register-screen"
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: "pin-register-sanpo-map-loading"
    timeout: 15000
- tapOn:
    id: "pin-register-name-input"
- inputText: ${output.pinName}
- hideKeyboard
- scrollUntilVisible:
    element:
      text: ${output.mapName}
- tapOn:
    text: ${output.mapName}
- scrollUntilVisible:
    element:
      id: "pin-register-save"
- tapOn:
    id: "pin-register-save"
# 保存の成功はトーストでは見ない（sanpo-map-list.yaml と同じ。SS-152）。
- extendedWaitUntil:
    notVisible:
      id: "pin-register-screen"
    timeout: 20000
- assertVisible:
    id: "pin-tab-screen"

# --- 地図詳細 → ピン詳細 ---
- tapOn:
    id: "pin-tab-open-sanpo-map-list"
- extendedWaitUntil:
    visible:
      id: "sanpo-map-list-screen"
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: "sanpo-map-list-loading"
    timeout: 15000
- tapOn:
    id: "sanpo-map-list-search-input"
- inputText: ${output.suffix}
- hideKeyboard
- tapOn:
    id: "sanpo-map-list-item-0"
- extendedWaitUntil:
    visible:
      id: "sanpo-map-detail-screen"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "sanpo-map-detail-pin-0"
    timeout: 15000
- tapOn:
    id: "sanpo-map-detail-pin-0"
- extendedWaitUntil:
    visible:
      id: "pin-detail-name"
    timeout: 15000

# --- 編集（名前・メモ・タグ）→ 保存 ---
- tapOn:
    id: "pin-detail-edit"
- extendedWaitUntil:
    visible:
      id: "pin-edit-form"
    timeout: 15000
- tapOn:
    id: "pin-edit-name-input"
- eraseText: 100
- inputText: ${output.editedName}
- hideKeyboard
- tapOn:
    id: "pin-edit-memo-input"
- inputText: "E2E memo"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "pin-edit-tag-input"
- tapOn:
    id: "pin-edit-tag-input"
- inputText: ${output.tagLabel}
- tapOn:
    id: "pin-edit-tag-add"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "pin-edit-save"
- tapOn:
    id: "pin-edit-save"
# 保存の成功は、編集画面が閉じて詳細へ戻ることで確かめる（失敗すると編集画面に残る）。
- extendedWaitUntil:
    notVisible:
      id: "pin-edit-screen"
    timeout: 20000
- assertVisible:
    id: "pin-detail-screen"
# 詳細は保存成功の invalidate で取り直される。新しい名前が出るのを待つ。
- extendedWaitUntil:
    visible:
      text: ${output.editedName}
    timeout: 15000
- assertVisible:
    id: "pin-detail-memo"
- assertVisible:
    text: ${output.tagLabel}

# --- 削除 → 地図詳細が0件（削除はヘッダー右端のゴミ箱。編集は画面下部に固定） ---
- tapOn:
    id: "pin-detail-delete"
- extendedWaitUntil:
    visible:
      id: "pin-delete-dialog"
    timeout: 5000
- tapOn:
    id: "pin-delete-confirm"
- extendedWaitUntil:
    notVisible:
      id: "pin-detail-screen"
    timeout: 20000
- assertVisible:
    id: "sanpo-map-detail-screen"
# このフローが作った地図なので、削除後は必ず0件になる。
- extendedWaitUntil:
    visible:
      id: "sanpo-map-detail-pins-empty"
    timeout: 15000
