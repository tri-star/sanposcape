# Maestro E2E スモークフロー
# 実行には Android エミュレータ/実機 + preview ビルド（standalone APK。Expo Go 不可）が必要。
# ローカル(Windows側 Android)やCIでのエミュレータ上で実行する。
# フローの分類（smoke / mvp）は tags で管理する。詳細は docs/local-env.md を参照。
#
#   maestro test .maestro/smoke.yaml
#
appId: com.sanposcape.app.dev
tags:
  - smoke
---
# 状態の消去と起動は分ける（clearState 直後の起動が kill される競合への対策。理由は subflows/launch-clean.yaml）。
- runFlow: subflows/launch-clean.yaml
# スプラッシュは assert しない（理由は subflows/sign-in.yaml のコメントを参照:
# 表示窓が約900msしかなく、Maestroのポーリング間隔次第で見逃す構造的フレークになる）。
# スプラッシュは最低 900ms 表示 + restoreSession() の通信を待つため extendedWaitUntil を使う
# （subflows/sign-in.yaml と同じ待ち方針に揃える）。
- extendedWaitUntil:
    visible:
      id: "sign-in-google-button"
    timeout: 15000
