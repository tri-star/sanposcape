# preview E2E ビルド（EXPO_PUBLIC_AUTH_MODE=dev）で実行するログアウトフロー。
#
# SS-15 以降、walk-start の候補はネットワーク由来（/explore/places）になり、
# CI 環境には Google の server key が無いため候補が0件（503）になり得る。
# 「目的地を選ぶ→散歩を始める→散歩中画面の設定ボタン」という導線に依存すると
# 候補の有無でこのフローがフレークするため、ピンタブ（ログイン直後の着地点。SS-145）からは
# ディープリンク（`sanposcape-dev://settings`）で直接 /settings へ遷移する。
# ログアウト検証の本質（サインイン→ログアウト）は候補の存在に依存しない。
appId: com.sanposcape.app.dev
tags:
  - smoke
---
- runFlow: subflows/sign-in.yaml
- openLink: "sanposcape-dev://settings"
- assertVisible:
    id: "settings-screen"

# ダイアログの表示中の Android のシステムバックは、ダイアログだけを閉じて設定画面に残る（SS-46）
- tapOn:
    id: "settings-open-logout-dialog"
- assertVisible:
    id: "logout-dialog"
- back
- assertNotVisible:
    id: "logout-dialog"
- assertVisible:
    id: "settings-screen"
# アカウント削除のダイアログは開かない（e2e-user-1 は全フローで共有される固定アカウント。account-tab.yaml と同じ方針）。
# どちらも同じ Dialog（RN の Modal の onRequestClose）の経路なので、ログアウトのダイアログで代表させる。
- tapOn:
    id: "settings-open-logout-dialog"
- assertVisible:
    id: "logout-dialog"
- tapOn:
    id: "settings-confirm-logout"
- assertVisible:
    id: "sign-in-google-button"
