# 探索画面の表示確認。候補件数・地図描画は backend/Google/端末の状態に依存するため assert しない。
appId: com.sanposcape.app
---
- launchApp:
    clearState: true
- assertVisible:
    id: "splash-screen"
- tapOn:
    id: "sign-in-google-button"
- assertVisible:
    id: "walk-start-screen"
- assertVisible:
    id: "walk-start-duration-slider"
- assertVisible:
    id: "walk-start-begin"
