# MVP 主要フロー: 認証 → スポット探索 → 散歩開始 → 散歩終了・保存 → 履歴確認（タブ/一覧/詳細）。
#
# 前提:
#   - preview ビルド（EXPO_PUBLIC_AUTH_MODE=dev / EXPO_PUBLIC_LOCATION_MODE=mock）
#   - backend が起動しており、/explore/places が候補を返せること
#     （MAPS_MODE=fake もしくは実の GOOGLE_MAPS_SERVER_API_KEY）
#   → 候補に依存するため `maps-required` タグを付ける。CI は MAPS_MODE=fake で前提を満たせるため
#     絞り込まずに実行する（SS-54）。タグは前提を用意できないローカル環境での除外用。
#
# assert しないもの（ADR-004）: 地図タイルの描画・候補件数・距離/時間の具体値・履歴の件数・
# 記録タブの集計値。
appId: com.sanposcape.app
tags:
  - mvp
  - maps-required
---
- runFlow: subflows/sign-in.yaml
- runFlow: subflows/start-walk-from-spot.yaml

# --- 散歩中 ---
# 経過時間が進むまで待つ。アニメーションの有無ではなく、保存に必要な started_at / ended_at の
# 差分が生じたことを確認するため、初期表示の 00:00:00 が消えることを条件にする。
- extendedWaitUntil:
    notVisible: "00:00:00"
    timeout: 5000

# --- 散歩終了 ---
# 「タップ→ダイアログ確認」を retry の単位にする理由（2026-08-15 追補）:
# CIランナーが逼迫して描画が約1fpsまで落ちたとき、正しい座標に MotionEvent が届いている
# のにダイアログが開かない（タップの取りこぼし）事象を確認した（run 31824150888）。
# Maestro の再タップ（`retryTapIfNoChange`）は現在の版では既定で無効な上、有効にしても
# 散歩中画面は経過時間が毎秒書き換わるため「階層が変化した＝効いた」と判定されて
# 再タップされない。よってタップ自体を retry で包む必要がある。
# retry は MaestroException（アサーション失敗・要素が見つからない）でのみ再試行するため、
# アプリが本当に壊れている場合は maxRetries 消費後にきちんと落ちる。
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "walk-active-end"
      - assertVisible:
          id: "walk-end-dialog"
- tapOn:
    id: "walk-end-confirm"

# --- サマリ・保存 ---
- extendedWaitUntil:
    visible:
      id: "walk-summary-screen"
    timeout: 15000
# POST /walks の完了（saved）を待ってから遷移する。
# saving のまま「記録を見る」を押すと savedWalkId が無く /(tabs)/history に落ちる。
- extendedWaitUntil:
    visible:
      id: "walk-summary-save-status-saved"
    timeout: 30000
- tapOn:
    id: "walk-summary-view-history"

# --- 履歴詳細（保存した散歩へ直行）---
- extendedWaitUntil:
    visible:
      id: "walk-detail-screen"
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: "walk-detail-loading"
    timeout: 20000
- assertNotVisible:
    id: "walk-detail-error"
- assertVisible:
    id: "walk-detail-map"

# --- 戻る → 記録タブ → 最近の散歩 ---
# 詳細はサマリを replace して開いているため、戻り先はタブ（散歩は終了済みなので idle 表示）。
- tapOn:
    id: "walk-detail-back"
- extendedWaitUntil:
    visible:
      id: "walk-active-idle"
    timeout: 10000
- tapOn:
    id: "app-tab-history"
- assertVisible:
    id: "history-screen"
# 集計（GET /walks/stats）のロード完了を待つ。値は assert しない（同一 CI ラン内で
# 他フローの記録が残るため、日数・距離・歩数は不定）。
- extendedWaitUntil:
    notVisible:
      id: "history-stats-loading"
    timeout: 20000
- assertNotVisible:
    id: "history-stats-error"
- assertVisible:
    id: "history-period-chart"
- assertVisible:
    id: "history-step-goal-card"
- extendedWaitUntil:
    notVisible:
      id: "recent-walks-loading"
    timeout: 20000
# 直前に保存した散歩が「最近の散歩」に出る（useWalkSave の invalidateQueries の検証）。
- assertVisible:
    id: "recent-walk-0"

# --- 履歴一覧 → 詳細 ---
- tapOn:
    id: "history-see-all-walks"
- extendedWaitUntil:
    visible:
      id: "walk-history-screen"
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: "walk-history-loading"
    timeout: 20000
- assertNotVisible:
    id: "walk-history-error"
- assertVisible:
    id: "walk-history-item-0"
- tapOn:
    id: "walk-history-item-0"
- extendedWaitUntil:
    visible:
      id: "walk-detail-screen"
    timeout: 15000
- assertVisible:
    id: "walk-detail-map"
