# 散歩中の「ルートを再計算」導線が画面を壊さないことだけを見るフロー（SS-35）。
#
# 前提: preview ビルド（EXPO_PUBLIC_AUTH_MODE=dev / EXPO_PUBLIC_LOCATION_MODE=mock）。
#       スポット候補に依存するため maps-required（CI は MAPS_MODE=fake で前提を満たすため
#       絞り込まずに実行する。SS-54）。
# assert しないもの: 再計算の成功可否・ルートの形・所要時間/距離の値
#   （再計算は現在地起点で /explore/routes を引き直すため、環境によって結果が変わりうる。ADR-004）。
# SS-33 以降: 往路にいる間は周回（route_type: loop）、復路にいる間は出発地への片道
#   （route_type: one_way）を引き直すようになったが、フロー開始直後は必ず往路のため
#   この assert の対象・挙動は変わらない。
# SS-33 の動作確認以降: 自動再計算は廃止され、再計算はこのボタンを押したときだけ走る
#   （散歩開始時に往路・復路のルートは固定される）。このフローが唯一の再計算導線の E2E になった。
appId: com.sanposcape.app
tags:
  - maps-required
---
- runFlow: subflows/sign-in.yaml
- runFlow: subflows/start-walk-from-spot.yaml
- assertVisible:
    id: "walk-active-route-recalc"
- tapOn:
    id: "walk-active-route-recalc"
# 成否にかかわらず散歩中画面が生き続けること（既存ルート・進行状態が壊れない）。
- assertVisible:
    id: "walk-stats-panel"
- assertVisible:
    id: "walk-active-map"
# 後始末: 散歩を終了して次のフローに状態を持ち越さない。
# retry で包む理由は mvp-walk-flow.yaml の同じ箇所のコメントを参照（タップの取りこぼし対策）。
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "walk-active-end"
      - assertVisible:
          id: "walk-end-dialog"
- tapOn:
    id: "walk-end-confirm"
- extendedWaitUntil:
    visible:
      id: "walk-summary-screen"
    timeout: 15000
