# SS-33: 参考ルート表示と自由な手動終了。通信回数はQueryClientテストで検証。
appId: com.sanposcape.app.dev
tags:
  - maps-required
---
- runFlow: subflows/sign-in.yaml
- runFlow: subflows/start-walk-from-spot.yaml
- assertNotVisible:
    id: "walk-active-route-recalc"
- assertVisible: "ルートは参考です。自由に歩いてください。"
- assertVisible:
    id: "walk-stats-panel"
- assertVisible:
    id: "walk-active-map"
# 後始末: 散歩を終了して次のフローに状態を持ち越さない。
# retry で包む理由は mvp-walk-flow.yaml の同じ箇所のコメントを参照（タップの取りこぼし対策）。
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "walk-active-end"
      - assertVisible:
          id: "walk-end-dialog"
- tapOn:
    id: "walk-end-confirm"
- extendedWaitUntil:
    visible:
      id: "walk-summary-screen"
    timeout: 15000
